/**
 * Tooltip — shows an explanation bubble on hover/tap.
 * Works on both desktop (hover) and mobile (tap to toggle).
 * Usage: <Info text="Explanation here" />
 *        <Info label="Elo model" text="Explanation" />
 */
function Info({text, label}){
  const [open,setOpen]=useState(false);
  const ref=useRef(null);
  const closeTimer=useRef(null);
  const [flipDown,setFlipDown]=useState(false);

  const handleOpen=()=>{
    clearTimeout(closeTimer.current);
    if(ref.current){
      const rect=ref.current.getBoundingClientRect();
      setFlipDown(rect.top<180);
    }
    setOpen(true);
  };
  const handleClose=()=>{
    // Small delay so user can move cursor to read the tooltip
    closeTimer.current=setTimeout(()=>setOpen(false),200);
  };

  return (
    <span ref={ref} style={{position:"relative",display:"inline-flex",alignItems:"center",gap:4,verticalAlign:"middle"}}>
      {label&&<span style={{font:`inherit`}}>{label}</span>}
      <button
        onClick={e=>{e.stopPropagation();open?setOpen(false):handleOpen();}}

        onMouseLeave={handleClose}

        <span style={{

          transition:"border-color 120ms,color 120ms",

      </button>
      {open&&<div
        role="tooltip"
        onMouseEnter={()=>clearTimeout(closeTimer.current)}
        onMouseLeave={handleClose}
        style={{
          position:"fixed",
          top:ref.current?ref.current.getBoundingClientRect().bottom+8+"px":"50%",
          left:ref.current?Math.min(ref.current.getBoundingClientRect().left,window.innerWidth-260)+"px":"50%",

// Shared time/date helpers — always render in the VISITOR'S local timezone.
// Passing no timeZone option to Intl/toLocaleTimeString uses the browser's
// local timezone automatically. We append the short TZ name (e.g. "GMT+8")
// so users know exactly what timezone they're seeing.
// Anonymous per-browser device ID — used for community vote tallies.
// No login, no PII, just a random UUID persisted in localStorage.
function getDeviceId(){
  try{
    let id=localStorage.getItem("wc-device-id");
    if(!id){
      id=crypto.randomUUID?crypto.randomUUID():"d-"+Date.now()+"-"+Math.random().toString(36).slice(2);
      localStorage.setItem("wc-device-id",id);
    }
    return id;
  }catch{ return "anon-"+Math.random().toString(36).slice(2); }
}

const TZ_LABEL = (() => {
  try { return Intl.DateTimeFormat().resolvedOptions().timeZone.replace("_"," "); } catch { return ""; }
})();
function localTime(utcString) {
  if (!utcString) return "—";
  return new Date(utcString).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
}
function localDate(utcString) {
  if (!utcString) return "—";
  return new Date(utcString).toLocaleDateString([], {weekday:"short", day:"numeric", month:"short"});
}
function localDateTime(utcString) {
  if (!utcString) return "—";
  return localDate(utcString) + " · " + localTime(utcString);
}

/* ── MICRO-INTERACTION COMPONENTS ────────────────────────────────────────── */

/** Counts up from 0 to target value on mount — energetic "live app" feel */
function AnimatedNumber({value, suffix="", duration=1200, style={}}){
  const [display,setDisplay]=useState(0);
  useEffect(()=>{
    if(!value) return;
    let start=null;
    const step=(ts)=>{
      if(!start) start=ts;
      const progress=Math.min((ts-start)/duration,1);
      // Ease out: fast at start, slow at end
      const eased=1-Math.pow(1-progress,3);
      setDisplay(Math.round(eased*value));
      if(progress<1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  },[value]);
  return <span style={style}>{display.toLocaleString()}{suffix}</span>;
}

/** Typewriter input placeholder — cycles through questions every 4s */
function TypewriterInput({value, onChange, onKeyDown, style={}}){
  const prompts=[
    "Who has the most World Cup goals ever?",
    "Did Morocco make history in 2022?",
    "Which coach won the most tournaments?",
    "What was the biggest upset in 1950?",
    "How many finals has Germany reached?",
    "Who scored the Goal of the Century?",
    "Which team has the best knockout record?",
    "What happened at the 1970 final?",
  ];
  const [ph,setPh]=useState("");
  // Use refs (not state) for the animation engine itself — avoids stale-closure
  // bugs where setTimeout callbacks read an outdated character count.
  const pidxRef=useRef(0);
  const charRef=useRef(0);
  const phaseRef=useRef("typing"); // "typing" | "pause" | "erasing"
  const timeoutRef=useRef(null);

  useEffect(()=>{
    if(value){ clearTimeout(timeoutRef.current); return; } // user is typing — pause animation

    const TYPE_MS=42, ERASE_MS=22, PAUSE_MS=2400, GAP_MS=400;

    const tick=()=>{
      const target=prompts[pidxRef.current];

      if(phaseRef.current==="typing"){
        charRef.current++;
        setPh(target.slice(0,charRef.current));
        if(charRef.current>=target.length){
          phaseRef.current="pause";
          timeoutRef.current=setTimeout(tick,PAUSE_MS);
        } else {
          timeoutRef.current=setTimeout(tick,TYPE_MS);
        }
      } else if(phaseRef.current==="pause"){
        phaseRef.current="erasing";
        timeoutRef.current=setTimeout(tick,ERASE_MS);
      } else { // erasing
        charRef.current--;
        setPh(target.slice(0,charRef.current));
        if(charRef.current<=0){
          pidxRef.current=(pidxRef.current+1)%prompts.length;
          phaseRef.current="typing";
          timeoutRef.current=setTimeout(tick,GAP_MS);
        } else {
          timeoutRef.current=setTimeout(tick,ERASE_MS);
        }
      }
    };

    timeoutRef.current=setTimeout(tick,TYPE_MS);
    return ()=>clearTimeout(timeoutRef.current);
  },[value]);

  return <input value={value} onChange={onChange} onKeyDown={onKeyDown}
    className="search-hero"
    placeholder={value?"Search teams, coaches, upsets, records…":ph||"Ask anything about the World Cup…"}
    style={style}/>;
}

            {d.events.map((e,i)=>(

                <span style={{width:34,fontFamily:mono,fontSize:12,color:C.gold,flexShrink:0}}>{e.minute!=null?e.minute+"'":""}</span>
                <span style={{width:20,flexShrink:0}}>{icon(e.type)}</span>
                {e.type==="GOAL"&&<Avatar name={e.player} team={e.team} size={28}/>}
                <span style={{flex:1,font:`500 13px ${display}`}}>{e.player}{e.type==="GOAL"&&e.assist?<span style={{color:C.mute}}> (assist {e.assist})</span>:null}{e.type==="SUB"&&e.playerOut?<span style={{color:C.mute}}> ↔ {e.playerOut}</span>:null}</span>
                <span style={{color:C.mute,fontFamily:mono,fontSize:11,flexShrink:0}}>{e.team}</span>
              </div>
            ))}
          </>}
          {(hasLineup(d.home)||hasLineup(d.away))&&<>
            <div style={{font:`600 11px ${mono}`,color:C.mute,letterSpacing:".12em",margin:"20px 0 10px"}}>LINEUPS</div>
            <div style={{display:"flex",gap:20}}><Side s={d.home}/><Side s={d.away}/></div>
          </>}
          {/* Momentum chart — shows for live and finished matches with events */}
          {(isLive||isFinished)&&d.events?.length>0&&
            <LiveMomentum matchId={id} homeTeam={d.home?.name} awayTeam={d.away?.name}/>}

          {/* ── MATCH STORY ─────────────────────────────────────── */}
          {isFinished&&<div style={{marginTop:20,paddingTop:16,borderTop:`1px solid ${C.line}`}}>
            <div style={{font:`600 11px ${mono}`,color:C.gold,letterSpacing:".12em",marginBottom:12}}>📰 MATCH STORY</div>
            {!story&&<div style={{font:`12px ${mono}`,color:C.mute,padding:"10px 0"}}>Generating story…</div>}
            {story&&<>
              {/* headline */}
              {story.headline&&<div style={{font:`800 18px/1.2 ${display}`,color:C.chalk,marginBottom:12}}>{story.headline}</div>}
              {/* key facts */}
              {story.facts?.length>0&&<div style={{marginBottom:14}}>
                <div style={{font:`600 10px ${mono}`,color:C.mute,letterSpacing:".1em",marginBottom:8}}>KEY FACTS</div>
                {story.facts.map((f,i)=>(
                  <div key={i} style={{display:"flex",gap:10,padding:"6px 0",borderBottom:`1px solid ${C.line}`,alignItems:"flex-start"}}>
                    <span style={{color:C.gold,fontFamily:mono,fontSize:12,flexShrink:0,marginTop:1}}>▸</span>
                    <span style={{font:`13px/1.5 ${display}`,color:C.chalk}}>{f}</span>
                  </div>
                ))}
              </div>}
              {/* AI narrative */}
              {story.narrative&&<>
                <div style={{font:`600 10px ${mono}`,color:C.mute,letterSpacing:".1em",marginBottom:8}}>MATCH REPORT</div>
                <div style={{font:`14px/1.7 ${display}`,color:C.mute}}>{story.narrative}</div>
                <div style={{font:`10px ${mono}`,color:C.line,marginTop:10}}>AI-generated from match data · Not a human report</div>
              </>}
              {!story.narrative&&<div style={{font:`12px ${mono}`,color:C.mute}}>Add ANTHROPIC_API_KEY to Vercel env vars to enable AI match reports.</div>}
            </>}
          </div>}
        </div>}
      </div>
    </div>
  );
}

/* ===================== LIVE ===================== */
function Live({onOpenMatch}) {
  const [data,setData]=useState(null); const [err,setErr]=useState(null);
  const [secs,setSecs]=useState(REFRESH_MS/1000); const timer=useRef(null);
  async function load(){ try{ const r=await fetch("/api/live"); if(!r.ok)throw new Error("Feed "+r.status); setData(await r.json()); setErr(null);}catch(e){setErr(e.message);} setSecs(REFRESH_MS/1000); }
  useEffect(()=>{ load(); timer.current=setInterval(load,REFRESH_MS); const t=setInterval(()=>setSecs(s=>s>0?s-1:0),1000); return()=>{clearInterval(timer.current);clearInterval(t);}; },[]);
  const Row=({m})=>(
    <div onClick={()=>onOpenMatch&&onOpenMatch(m.id)}
      style={{display:"grid",gridTemplateColumns:"1fr 72px 1fr 44px",alignItems:"center",gap:6,
        padding:"12px 4px",borderBottom:`1px solid ${C.line}`,cursor:"pointer"}}
      title="View match detail">
      {/* Home team — name then crest, right-aligned */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"flex-end",gap:6,minWidth:0}}>
        <span style={{font:`600 14px/1.2 ${display}`,color:C.chalk,textAlign:"right",wordBreak:"break-word"}}>{m.home.name}</span>
        <Crest src={m.home.crest} size={20}/>
      </div>
      {/* Score — centre */}
      <div style={{display:"flex",gap:4,alignItems:"center",justifyContent:"center"}}>
        <span style={{font:`800 18px ${display}`,color:C.gold}}>{m.home.score??"–"}</span>
        <span style={{color:C.mute,fontSize:14}}>:</span>
        <span style={{font:`800 18px ${display}`,color:C.gold}}>{m.away.score??"–"}</span>
      </div>
      {/* Away team — crest then name, left-aligned */}
      <div style={{display:"flex",alignItems:"center",gap:6,minWidth:0}}>
        <Crest src={m.away.crest} size={20}/>
        <span style={{font:`600 14px/1.2 ${display}`,color:C.chalk,wordBreak:"break-word"}}>{m.away.name}</span>
      </div>
      {/* Status */}
      <div style={{textAlign:"right",font:`600 11px ${mono}`,color:m.status==="LIVE"?C.red:C.mute,whiteSpace:"nowrap"}}>
        {m.status==="LIVE"?(m.minute?m.minute+"'":"LIVE"):m.status==="FINISHED"?"FT":localTime(m.utcKickoff)}
      </div>
    </div>
  );
  return (<div>
    <H2 eyebrow="Live Feed — 2026 FIFA World Cup" title="Today's matches" right={
      <div style={{font:`600 11px ${mono}`,color:C.mute,textAlign:"right"}}><div><span className="pulse"></span> &nbsp;AUTO-REFRESH</div><div style={{marginTop:6}}>next pull in {secs}s</div></div>}/>
    {err && <Panel style={{borderColor:"rgba(217,84,63,.35)"}}><div style={{font:`600 13px ${mono}`,color:C.red}}>Feed unavailable</div><div style={{font:`13px/1.5 ${display}`,color:C.mute,marginTop:8}}>{err}. Check FOOTBALL_DATA_API_KEY in Vercel. Retrying automatically.</div></Panel>}
    {!data && !err && <Panel><MatchSkeleton/><MatchSkeleton/><MatchSkeleton/></Panel>}
    {data && <div>
      {data.live.length>0 && <Panel style={{marginBottom:16,borderColor:"rgba(217,84,63,.35)",background:"linear-gradient(135deg, rgba(217,84,63,.05), rgba(217,84,63,.01))"}}><div style={{font:`700 11px ${mono}`,letterSpacing:".14em",color:C.red,marginBottom:6}}>● IN PLAY</div>{data.live.map(m=><Row key={m.id} m={m}/>)}</Panel>}
      <Panel style={{marginBottom:16}}><div style={{font:`700 11px ${mono}`,letterSpacing:".14em",color:C.gold,marginBottom:6}}>FINISHED TODAY</div>{data.finishedToday.length?data.finishedToday.map(m=><Row key={m.id} m={m}/>):<Empty>No matches finished yet today.</Empty>}</Panel>
      <Panel><div style={{font:`700 11px ${mono}`,letterSpacing:".14em",color:C.mute,marginBottom:6}}>UPCOMING TODAY</div>{data.upcomingToday.length?data.upcomingToday.map(m=><Row key={m.id} m={m}/>):<Empty>Nothing else scheduled today.</Empty>}</Panel>
      <div style={{font:`11px ${mono}`,color:C.mute,textAlign:"center",marginTop:16}}>Feed updated {localTime(data.updatedAt)} ({TZ_LABEL}) · served from cache</div>
    </div>}
  </div>);
}

/* ===================== SCORER RACE (live) ===================== */
function ScorerRace(){
  const [data,setData]=useState(null); const [err,setErr]=useState(null);
  const [statTab,setStatTab]=useState("goals");
  const [expanded,setExpanded]=useState(null);
  const [fading,setFading]=useState(false);
  const tabRefs=useRef({});
  const [pillStyle,setPillStyle]=useState({left:0,width:0});
  const RECORDS={goals:{all:16,player:"Miroslav Klose",single:13},assists:{all:8,player:"Various",single:8},penalties:{all:4,player:"Various",single:3}};
  useEffect(()=>{ fetch("/api/scorers").then(r=>r.json()).then(setData).catch(e=>setErr(e.message)); },[]);
  const tabs=[["goals","Goals"],["assists","Assists"],["penalties","Pens"]];

  // Position the sliding gold pill behind whichever tab is active
  useEffect(()=>{
    const el=tabRefs.current[statTab];
    if(el) setPillStyle({left:el.offsetLeft,width:el.offsetWidth});
  },[statTab,data]);

  const switchTab=(k)=>{
    if(k===statTab) return;
    setFading(true);
    setTimeout(()=>{ setStatTab(k); setExpanded(null); setFading(false); },160);
  };

  const rows=(data?.scorers||[])
    .filter(s=>(s[statTab]||0)>0)
    .sort((a,b)=>(b[statTab]||0)-(a[statTab]||0))
    .slice(0,15);
  const max=rows[0]?.[statTab]||1;
  const rec=RECORDS[statTab];
  return (<div>
    <H2 eyebrow="Live — Golden Boot Race" title="Top scorers, this tournament"/>
    <div style={{position:"relative",display:"flex",gap:8,marginBottom:18,flexWrap:"wrap"}}>
      {/* Sliding gold pill background */}
      <div style={{position:"absolute",top:0,bottom:0,left:pillStyle.left,width:pillStyle.width,
        background:C.gold,borderRadius:3,transition:"left .25s cubic-bezier(.3,.7,.4,1),width .25s cubic-bezier(.3,.7,.4,1)",zIndex:0}}/>
      {tabs.map(([k,l])=><button key={k} ref={el=>tabRefs.current[k]=el} onClick={()=>switchTab(k)}
        style={{position:"relative",zIndex:1,font:`600 12px ${mono}`,padding:"7px 14px",cursor:"pointer",borderRadius:3,
          border:"none",background:"transparent",
          outline:statTab===k?"none":`1px solid ${C.line}`,
          color:statTab===k?C.pitch:"#a0b8ac",transition:"color .2s"}}>{l}</button>)}
    </div>
    {err && <Panel style={{borderColor:"rgba(217,84,63,.35)"}}><span style={{color:C.red,fontFamily:mono}}>Scorers unavailable — {err}</span></Panel>}
    {!data && !err && <div style={{padding:30,color:C.mute,fontFamily:mono}}>Loading…</div>}
    {data && rows.length===0 && <Empty>No data yet for this stat — check back once more matches are played.</Empty>}
    {rows.length>0 && <Panel style={{opacity:fading?0:1,transform:fading?"translateY(6px)":"translateY(0)",transition:"opacity .16s,transform .16s"}}>
      {rows.map((s,i)=>{
        const isOpen=expanded===s.player;
        const val=s[statTab]||0;
        const pctRecord=Math.min(100,Math.round(val/rec.all*100));
        return <div key={i}>
          <div onClick={()=>setExpanded(isOpen?null:s.player)}
            style={{display:"flex",alignItems:"center",gap:14,padding:"12px 0",
              borderBottom:`1px solid ${C.line}`,cursor:"pointer",
              background:isOpen?"rgba(232,184,75,.04)":"transparent",transition:"background .15s"}}>
            <span style={{font:`800 15px ${mono}`,color:i===0?C.gold:i<3?C.chalk:C.mute,width:24,textAlign:"right",flexShrink:0}}>{i+1}</span>
            <Avatar name={s.player} team={s.team} size={42}/>
            <div style={{flex:1,minWidth:0}}>
              <div style={{font:`700 15px ${display}`,color:C.chalk,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{s.player}</div>
              <div style={{font:`11px ${mono}`,color:C.mute,marginTop:3}}>{s.team}</div>
            </div>
            <div style={{width:100,height:6,background:C.pitch2,borderRadius:3,overflow:"hidden",flexShrink:0}}>
              <div style={{width:(val/max*100)+"%",height:"100%",borderRadius:3,background:i===0?C.gold:i<3?C.goldDim:C.line}}/>
            </div>
            <span style={{font:`900 20px/1 ${display}`,color:i===0?C.gold:i<3?C.chalk:C.mute,minWidth:24,textAlign:"right",flexShrink:0}}>{val}</span>
            <span style={{font:`10px ${mono}`,color:C.mute,flexShrink:0}}>{isOpen?"▲":"▼"}</span>
          </div>
          {isOpen&&<div style={{padding:"12px 14px 16px 80px",background:"rgba(232,184,75,.03)",borderBottom:`1px solid ${C.line}`}}>
            <div style={{font:`600 10px ${mono}`,color:C.mute,letterSpacing:".1em",marginBottom:8}}>PROGRESS TO ALL-TIME RECORD</div>
            <div style={{height:8,background:C.pitch2,borderRadius:4,overflow:"hidden",marginBottom:6}}>
              <div style={{width:pctRecord+"%",height:"100%",background:pctRecord>75?C.gold:C.grass,borderRadius:4}}/>
            </div>
            <div style={{font:`11px ${mono}`,color:C.mute,marginBottom:12}}>
              <b style={{color:C.chalk}}>{val}</b> of {rec.all} all-time record ({rec.player}) — {pctRecord}%
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,textAlign:"center"}}>
              <div><div style={{font:`700 20px ${display}`,color:C.gold}}>{val}</div><div style={{font:`9px ${mono}`,color:C.mute,marginTop:3}}>This WC</div></div>
              <div><div style={{font:`700 20px ${display}`,color:C.chalk}}>{rec.single}</div><div style={{font:`9px ${mono}`,color:C.mute,marginTop:3}}>Single WC record</div></div>
              <div><div style={{font:`700 20px ${display}`,color:rec.all-val<=3?C.red:C.mute}}>{Math.max(0,rec.all-val)}</div><div style={{font:`9px ${mono}`,color:C.mute,marginTop:3}}>To beat all-time</div></div>
            </div>
          </div>}
        </div>;
      })}
      <div style={{font:`11px ${mono}`,color:C.mute,marginTop:14,paddingTop:12,borderTop:`1px solid ${C.line}`}}>
        Click any player to see their progress toward World Cup records.
      </div>
    </Panel>}
  </div>);
}

/* ===================== SQUAD MODAL ===================== */
function SquadModal({id,onClose}){
  const [d,setD]=useState(null); const [err,setErr]=useState(null);
  useEffect(()=>{
    if(!id||id==="null"||id==="undefined") return;
    setD(null); setErr(null);
    fetch("/api/match?squad="+id)
      .then(r=>r.json())
      .then(j=>{ if(j.error) throw new Error(j.error); setD(j); })
      .catch(e=>setErr(e.message));
  },[id]);
  if(!id||id==="null"||id==="undefined") return null;
  const age=(dob)=>{ if(!dob)return"—"; const d=new Date(dob); return Math.floor((Date.now()-d)/3.15576e10); };
  const byPos={}; (d?.squad||[]).forEach(p=>{ const k=p.position||"Other"; (byPos[k]=byPos[k]||[]).push(p); });
  return (
    <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(4,12,9,.82)",zIndex:50,display:"grid",placeItems:"center",padding:16}}>
      <div onClick={e=>e.stopPropagation()} style={{background:C.panel,border:`1px solid ${C.line}`,borderRadius:6,maxWidth:640,width:"100%",maxHeight:"86vh",overflowY:"auto",padding:24}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}>
          <span style={{font:`700 11px ${mono}`,letterSpacing:".14em",color:C.gold}}>SQUAD</span>
          <button onClick={onClose} style={{background:"none",border:`1px solid ${C.line}`,color:C.chalk,borderRadius:4,padding:"6px 12px",cursor:"pointer",fontFamily:mono}}>Close ✕</button>
        </div>
        {err && <Panel style={{borderColor:"rgba(217,84,63,.35)"}}>
          <div style={{color:C.red,fontFamily:mono,fontSize:13,marginBottom:6}}>Squad not available</div>
          <div style={{color:C.mute,fontFamily:mono,fontSize:11,lineHeight:1.6}}>{err}</div>
          <div style={{color:C.mute,fontFamily:mono,fontSize:11,marginTop:8}}>Squad data from football-data.org becomes available once a team has registered their 2026 World Cup squad. Try again closer to or during the tournament.</div>
        </Panel>}
        {!d && !err && <div style={{padding:30,textAlign:"center",color:C.mute,fontFamily:mono}}>Loading squad…</div>}
        {d && <div>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:6}}><Crest src={d.crest}/><span style={{font:`800 22px ${display}`}}>{d.team}</span></div>
          {d.coach && <div style={{font:`12px ${mono}`,color:C.mute,marginBottom:14}}>Coach: {d.coach}</div>}
          {Object.keys(byPos).length===0 && <Empty>Squad not published in the feed yet.</Empty>}
          {Object.entries(byPos).map(([pos,players])=>(
            <div key={pos} style={{marginBottom:14}}>
              <div style={{font:`600 11px ${mono}`,color:C.gold,letterSpacing:".1em",marginBottom:6}}>{pos.toUpperCase()}</div>
              {players.map((p,i)=>(
                <div key={i} style={{display:"flex",gap:10,padding:"7px 0",borderBottom:`1px solid ${C.line}`,alignItems:"center"}}>
                  <Avatar name={p.name} team={d.team} size={30}/>
                  <span style={{width:24,fontFamily:mono,fontSize:11,color:C.mute,textAlign:"right",flexShrink:0}}>{p.shirt??""}</span>
                  <span style={{flex:1,font:`500 13px ${display}`,color:C.chalk}}>{p.name}</span>
                  <span style={{font:`11px ${mono}`,color:C.mute,flexShrink:0}}>{p.nationality}</span>
                  <span style={{width:30,textAlign:"right",font:`11px ${mono}`,color:C.mute,flexShrink:0}}>{age(p.dob)}y</span>
                </div>
              ))}
            </div>
          ))}
        </div>}
      </div>
    </div>
  );
}

/* ===================== STANDINGS + FORM ===================== */
function Standings({onOpenTeam}){
  const [data,setData]=useState(null); const [err,setErr]=useState(null);
  useEffect(()=>{ fetch("/api/standings").then(r=>r.json()).then(setData).catch(e=>setErr(e.message)); },[]);

  // Enhanced pip: lettered badge with colour + letter for accessibility
  const Pip=({type})=>{
    const cfg={W:{bg:C.grass,label:"W"},D:{bg:C.mute,label:"D"},L:{bg:C.red,label:"L"}};
    const c=cfg[type]||cfg.D;
    return <span title={type==="W"?"Win":type==="D"?"Draw":"Loss"} style={{display:"inline-flex",alignItems:"center",justifyContent:"center",width:16,height:16,borderRadius:4,background:c.bg,font:`700 8px/1 ${mono}`,color:"rgba(255,255,255,.9)",flexShrink:0}}>{c.label}</span>;
  };
  const Pips=({w,d,l})=>(
    <div style={{display:"flex",gap:3,alignItems:"center"}}>
      {Array.from({length:w}).map((_,i)=><Pip key={"w"+i} type="W"/>)}
      {Array.from({length:d}).map((_,i)=><Pip key={"d"+i} type="D"/>)}
      {Array.from({length:l}).map((_,i)=><Pip key={"l"+i} type="L"/>)}
    </div>
  );

  // Derive progress stats from all groups
  const progress=data?(() => {
    let totalPlayed=0, totalMatches=0;
    data.groups.forEach(g=>{ g.table.forEach(r=>{ totalPlayed+=r.played; }); totalMatches+=g.table.length*(g.table.length-1)/2*2; });
    const matchesPlayed=totalPlayed/2;
    const groupSize=data.groups[0]?.table?.length||4;
    const gamesPerGroup=groupSize*(groupSize-1)/2;
    const totalGroupGames=data.groups.length*gamesPerGroup;
    return {matchesPlayed, totalGroupGames};
  })():null;

  const GroupTable=({g})=>(
    <div style={{background:C.panel,border:`1px solid ${C.line}`,borderRadius:4,overflow:"hidden"}}>
      {/* group header */}
      <div style={{padding:"10px 14px",borderBottom:`1px solid ${C.line}`,display:"flex",justifyContent:"space-between",alignItems:"center",background:"rgba(232,184,75,.04)"}}>
        <div style={{font:`700 10px ${mono}`,color:C.gold,letterSpacing:".3em",borderLeft:`2px solid ${C.gold}`,paddingLeft:8}}>{g.group?.replace("GROUP ","GRP ")}</div>
        <div style={{font:`10px ${mono}`,color:C.mute}}>P&nbsp;W&nbsp;D&nbsp;L</div>
      </div>
      {/* col headers */}
      <div style={{display:"grid",gridTemplateColumns:"20px 1fr 56px 26px 32px",gap:6,padding:"5px 14px",font:`500 9px ${mono}`,letterSpacing:".1em",color:C.mute,textTransform:"uppercase"}}>
        <span/><span>Team</span><span>Form</span><span style={{textAlign:"center"}}><Info text="Goal Difference: goals scored minus goals conceded. Used to separate teams level on points." label="GD"/></span><span style={{textAlign:"center"}}>Pts</span>
      </div>
      {/* rows */}
      {g.table.map((r,ri)=>{
        const advancing=r.position<=2;
        const hasSquad=r.teamId&&Number(r.teamId)>0;
        return (
          <div key={r.position}
            onClick={()=>{ if(hasSquad&&onOpenTeam) onOpenTeam(r.teamId); }}
            title={hasSquad?"Tap to view squad":"Squad not available"}
            style={{
              display:"grid",gridTemplateColumns:"20px 1fr 56px 26px 32px",gap:6,
              padding:"9px 14px",alignItems:"center",cursor:hasSquad?"pointer":"default",
              borderTop:`1px solid ${C.line}`,
              borderLeft:`3px solid ${advancing?C.grass:"transparent"}`,
              transition:"background 120ms",
              background:"transparent",
            }}
            onMouseEnter={e=>{ if(hasSquad) e.currentTarget.style.background="rgba(255,255,255,.03)"; }}
            onMouseLeave={e=>e.currentTarget.style.background="transparent"}
          >
            <span style={{font:`700 11px ${mono}`,color:advancing?C.grass:C.mute}}>{r.position}</span>
            <span style={{display:"flex",alignItems:"center",gap:7,minWidth:0}}>
              <Crest src={r.crest} size={16}/>
              <span style={{font:`600 12px ${display}`,color:advancing?C.chalk:C.mute,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{r.team}</span>
            </span>
            <Pips w={r.won} d={r.draw} l={r.lost}/>
            <span style={{textAlign:"center",font:`600 11px ${mono}`,color:r.gd>0?C.grass:r.gd<0?C.red:C.mute}}>{r.gd>0?"+":""}{r.gd}</span>
            <span style={{textAlign:"center",font:`800 14px ${display}`,color:advancing?C.gold:C.chalk}}>{r.points}</span>
          </div>
        );
      })}
    </div>
  );

  return <div>
    <H2 eyebrow="Live — Group Stage" title="Standings & form"/>

    {/* Progress bar */}
    {progress && <div style={{marginBottom:20,padding:"12px 16px",background:C.panel,border:`1px solid ${C.line}`,borderRadius:4}}>
      <div style={{display:"flex",justifyContent:"space-between",font:`600 11px ${mono}`,color:C.mute,marginBottom:8}}>
        <span>GROUP STAGE PROGRESS</span>
        <span style={{color:C.chalk}}>{progress.matchesPlayed} <span style={{color:C.mute}}>/ {progress.totalGroupGames} matches played</span></span>
      </div>
      <div style={{height:4,background:C.pitch2,borderRadius:2,overflow:"hidden"}}>
        <div style={{width:(progress.matchesPlayed/progress.totalGroupGames*100)+"%",height:"100%",borderRadius:2,background:`linear-gradient(90deg,${C.gold},${C.grass})`,transition:"width 600ms ease"}}/>
      </div>

function QualOdds(){
  const [data,setData]=useState(null); const [err,setErr]=useState(null);
  useEffect(()=>{ fetch("/api/standings").then(r=>r.json()).then(setData).catch(e=>setErr(e.message)); },[]);
  // Simple, transparent: blend current points with Elo strength to estimate
  // probability of finishing top 2 in the group.
  function odds(group){
    const teams=group.table.map(r=>({team:r.team,pts:r.points,played:r.played,elo:M.rating(r.team)}));
    const scored=teams.map(t=>({...t, score: t.pts*1.0 + (t.elo-1750)/100 + (3-t.played)*0.1}));
    const exps=scored.map(t=>Math.exp(t.score/1.5));
    const sum=exps.reduce((a,b)=>a+b,0);
    // approximate P(top2) by softmax mass of the two best slots
    return scored.map((t,i)=>({team:t.team, p: Math.min(0.99, (exps[i]/sum)*2 )})).sort((a,b)=>b.p-a.p);
  }
  return (<div>
    <H2 eyebrow="Live — Qualification Model" title="Who advances?" right={<span className="est" style={{display:"inline-flex",alignItems:"center",gap:5}}>MODEL ESTIMATE <Info text="These percentages are calculated by a mathematical model — not official predictions. They blend real current points with each team's pre-tournament strength rating. Treat them as informed estimates, not facts."/></span>}/>
    <p style={{font:`13px/1.5 ${display}`,color:C.mute,margin:"0 0 18px",maxWidth:560}}>Probability of finishing top-2 and reaching the knockouts. Blends current points (real) with team strength and games remaining. An estimate, not a guarantee.</p>
    {err && <Panel style={{borderColor:"rgba(217,84,63,.35)"}}><span style={{color:C.red,fontFamily:mono}}>Standings unavailable — {err}</span></Panel>}
    {!data && !err && <div style={{padding:30,color:C.mute,fontFamily:mono}}>Loading…</div>}
    {data && data.groups.map(g=>(
      <Panel key={g.group} style={{marginBottom:14}}>
        <div style={{font:`700 13px ${mono}`,color:C.gold,marginBottom:12}}>{g.group}</div>
        {odds(g).map(o=>(
          <div key={o.team} style={{display:"flex",alignItems:"center",gap:12,padding:"7px 0"}}>
            <div style={{width:150,font:`600 14px ${display}`}}>{o.team}</div>
            <div style={{flex:1,height:18,background:C.pitch2,borderRadius:3,overflow:"hidden"}}>
              <div style={{width:(o.p*100)+"%",height:"100%",background:o.p>0.55?C.grass:o.p>0.3?C.gold:C.goldDim}}></div>
            </div>
            <div style={{width:46,textAlign:"right",font:`700 13px ${mono}`,color:C.chalk}}>{(o.p*100).toFixed(0)}%</div>
          </div>
        ))}
      </Panel>
    ))}
  </div>);
}

/* ===================== PATH TO FINAL (Monte Carlo) ===================== */
function Simulator(){
  const teams=Object.keys(M.RATINGS);
  const [team,setTeam]=useState("Brazil");
  const [rounds,setRounds]=useState(4);
  const [res,setRes]=useState(null);
  const [running,setRunning]=useState(false);
  function run(){
    setRunning(true);
    // defer so the button can show "running" before the 10k-loop blocks
    setTimeout(()=>{
      const field=teams.slice().sort((a,b)=>M.rating(b)-M.rating(a)).slice(0,16);
      const withTeam=field.includes(team)?field:[team,...field.slice(0,15)];
      setRes(M.simulateBracket(team,withTeam,rounds,10000));
      setRunning(false);
    },30);
  }
  useEffect(()=>{ run(); },[team,rounds]); // eslint-disable-line
  const roundsLabel={1:"Final only",2:"From semis",3:"From quarters",4:"From Round of 16"};
  return (<div>
    <H2 eyebrow="Prediction — Monte Carlo" title={<>Path to the final <Info text="Simulates a team's full knockout run thousands of times, accounting for realistic draw of opponents each round. The % is how often they win the whole thing across all simulations."/></>} right={<span className="est">10,000 SIMS</span>}/>
    <p style={{font:`13px/1.5 ${display}`,color:C.mute,margin:"0 0 18px",maxWidth:600}}>Simulates a team's remaining knockout run ten thousand times. Each round the opponent is a random survivor weighted by strength — so the odds reflect a realistic, uncertain path, not one fixed bracket. <Info text="A Monte Carlo simulation runs thousands of random 'versions' of the tournament. Each run picks a random opponent for each round based on team strength. The final % shows how often your team wins across all those runs." label="How does this work?"/></p>
    <div style={{display:"flex",gap:16,marginBottom:18,flexWrap:"wrap"}}>
      <Select label="Team" value={team} onChange={setTeam} options={teams}/>
      <div style={{flex:1,minWidth:140}}>
        <div style={{font:`600 10px ${mono}`,letterSpacing:".14em",color:C.mute,marginBottom:6,textTransform:"uppercase",display:"flex",alignItems:"center",gap:6}}>
          Starting from <Info text={`Choose which stage of the knockout rounds to simulate from:\n4 = Round of 16 (last 32 teams)\n3 = Quarter-finals (last 8)\n2 = Semi-finals (last 4)\n1 = Final only`}/>
        </div>
        <select value={String(rounds)} onChange={e=>setRounds(+e.target.value)} style={{width:"100%",font:`600 14px ${display}`,padding:"10px 12px",color:C.chalk,background:C.pitch2,border:`1px solid ${C.line}`,borderRadius:3}}>
          {[["4","Round of 16 → Final"],["3","Quarter-final → Final"],["2","Semi-final → Final"],["1","Final only"]].map(([v,l])=><option key={v} value={v}>{l}</option>)}
        </select>
      </div>
    </div>
    <Panel style={{marginBottom:16,textAlign:"center"}}>
      <div style={{font:`600 11px ${mono}`,color:C.mute,letterSpacing:".12em"}}>TITLE ODDS — {team.toUpperCase()}, {roundsLabel[rounds]} <Info text="The probability this team lifts the trophy, based on 10,000 simulated knockout brackets. Not a prediction — a model estimate based on team strength ratings."/></div>
      <div style={{font:`800 64px/1 ${display}`,color:C.gold,margin:"10px 0"}}>{running?"…":res?(res.titleOdds*100).toFixed(1)+"%":"—"}</div>
      <button onClick={run} disabled={running} style={{font:`600 12px ${mono}`,padding:"8px 16px",cursor:"pointer",borderRadius:3,border:`1px solid ${C.gold}`,background:"transparent",color:C.gold}}>Re-run simulation</button>
    </Panel>
    {res && <Panel>
      <div style={{font:`600 11px ${mono}`,color:C.mute,letterSpacing:".12em",marginBottom:12}}>WHERE THE RUN ENDS — probability of exiting at each stage</div>
      <ResponsiveContainer width="100%" height={240}>
        <BarChart data={[...res.exitByRound.map(e=>({stage:e.label,pct:+(e.pct*100).toFixed(1)})),{stage:"Champion",pct:+(res.titleOdds*100).toFixed(1)}]} margin={{left:-12,right:16,top:0,bottom:0}}>
          <CartesianGrid stroke={C.line} vertical={false}/>
          <XAxis dataKey="stage" tick={{fill:C.mute,fontSize:10,fontFamily:mono}} angle={-20} textAnchor="end" height={56}/>
          <YAxis tick={{fill:C.mute,fontSize:10,fontFamily:mono}} unit="%"/>
          <Tooltip {...tip} formatter={v=>[v+"%","Probability"]}/>
          <Bar dataKey="pct" radius={[3,3,0,0]}>
            {[...res.exitByRound,{}].map((e,i,arr)=><Recharts.Cell key={i} fill={i===arr.length-1?C.gold:C.goldDim}/>)}
          </Bar>
        </BarChart>
      </ResponsiveContainer>
      <div style={{font:`11px ${mono}`,color:C.mute,marginTop:10}}>Gold = lifts the trophy. Field = top 16 teams by rating; opponents sampled by strength each round.</div>
    </Panel>}
  </div>);
}

      <button onClick={submit} disabled={busy||!email} style={{width:"100%",font:`700 14px ${display}`,padding:"12px",cursor:busy?"default":"pointer",borderRadius:4,border:"none",background:busy?C.goldDim:C.gold,color:C.pitch}}>{busy?"Sending…":"Subscribe"}</button>
      {status && <div style={{marginTop:14,padding:"10px 12px",borderRadius:4,font:`13px/1.4 ${display}`,background:status.ok?"rgba(63,174,111,.12)":"rgba(217,84,63,.12)",color:status.ok?C.grass:C.red,border:`1px solid ${status.ok?C.grass:C.red}`}}>{status.msg}</div>}
    </Panel>
  </div>);
}

function Search(){
  const [q,setQ]=useState("");
  const [results,setResults]=useState([]);

    const t=D.TEAMS[k]; if(!t) return null;
    return <div>
      <div style={{font:`800 28px/1 ${display}`,color:C.chalk,marginBottom:4}}>{t.flag} {t.name}</div>

        <Stat label="Win %" value={(t.overall.won/t.overall.played*100).toFixed(0)+"%"} accent={C.grass}/>
        <Stat label="Goals for" value={t.overall.gf}/>
        <Stat label="Finals" value={t.overall.finals}/>

      <div style={{font:`13px/1.6 ${display}`,color:C.mute,borderLeft:`2px solid ${C.gold}`,paddingLeft:12}}>{t.summary}</div>

    const c=D.COACHES.find(x=>x.name===k); if(!c) return null;
    return <div>
      <div style={{font:`800 24px/1 ${display}`,color:C.chalk,marginBottom:4}}>{c.flag} {c.name}</div>
      <div style={{font:`12px ${mono}`,color:C.gold,marginBottom:16}}>{c.country} · {c.period}</div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,marginBottom:14}}>

        <Stat label="Win %" value={(c.won/c.matches*100).toFixed(0)+"%"} accent={C.grass}/>
        <Stat label="Best finish" value={c.bestFinish}/>

      <div style={{font:`13px/1.6 ${display}`,color:C.mute,borderLeft:`2px solid ${C.gold}`,paddingLeft:12}}>{c.style}</div>
    </div>;
  };

    const u=D.UPSETS.find(x=>x.match===k); if(!u) return null;
    return <div>
      <div style={{font:`800 22px/1.1 ${display}`,color:C.chalk,marginBottom:4}}>{u.match}</div>
      <div style={{font:`12px ${mono}`,color:C.gold,marginBottom:16}}>{u.year} · {u.stage}</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
        <Stat label="Elo difference" value={u.eloDiff+" pts"} accent={C.red}/>
        <Stat label="Upset score" value={u.upsetScore+"/100"} accent={C.red}/>
      </div>
      <div style={{font:`13px/1.6 ${display}`,color:C.mute,borderLeft:`2px solid ${C.red}`,paddingLeft:12}}>{u.detail}</div>
    </div>;
  };
  const Preview=({item})=>{
    if(!item) return null;
    return <Panel style={{marginTop:16}}>
      {item.type==="team" && <TeamPreview k={item.key}/>}
      {item.type==="coach" && <CoachPreview k={item.key}/>}
      {item.type==="upset" && <UpsetPreview k={item.key}/>}
      {item.type==="record" && <div><div style={{font:`800 22px/1.1 ${display}`,color:C.chalk,marginBottom:8}}>{item.label}</div><div style={{font:`15px/1.5 ${display}`,color:C.mute}}>{item.sublabel}</div></div>}
    </Panel>;
  };
  return <div>
    <H2 eyebrow="Universal Search" title="Search World Cup data"/>
    <p style={{font:`13px/1.5 ${display}`,color:C.mute,margin:"0 0 16px",maxWidth:560}}>Search teams, coaches, upsets, and records. Try "Brazil titles", "upset 2022", "most goals", or any coach name.</p>
    <div style={{position:"relative",marginBottom:8}}>
      <input value={q} onChange={e=>setQ(e.target.value)} placeholder='Try "Brazil", "Klose", "biggest upset", "most finals"...'
        style={{width:"100%",font:`500 16px ${display}`,padding:"14px 16px 14px 44px",color:C.chalk,background:C.panel,border:`1px solid ${q?C.gold:C.line}`,borderRadius:6,outline:"none"}}/>
      <span style={{position:"absolute",left:14,top:"50%",transform:"translateY(-50%)",font:"18px sans-serif"}}>🔍</span>
      {q&&<button onClick={()=>{setQ(""); setSel(null);}} style={{position:"absolute",right:12,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",font:`13px ${mono}`,color:C.mute,padding:"4px 8px"}}>✕ Clear</button>}
    </div>

    {/* Results list */}
    {results.length>0 && <div style={{background:C.pitch2,border:`1px solid ${C.line}`,borderRadius:6,overflow:"hidden",marginBottom:4}}>
      {results.map((r,i)=>(
        <div key={i} onClick={()=>setSel(r)} style={{display:"flex",alignItems:"center",gap:12,padding:"11px 16px",cursor:"pointer",background:sel?.key===r.key?"rgba(232,184,75,.08)":"transparent",borderBottom:`1px solid ${C.line}`}}>
          <span>{icons[r.type]||"•"}</span>
          <div style={{flex:1}}><div style={{font:`600 14px ${display}`,color:C.chalk}}>{r.label}</div><div style={{font:`11px ${mono}`,color:C.mute,marginTop:2}}>{r.sublabel}</div></div>
          <span style={{font:`10px ${mono}`,color:C.mute,background:C.line,padding:"2px 6px",borderRadius:3}}>{r.type}</span>
        </div>
      ))}
    </div>}

    {/* Empty state — query typed but nothing found */}
    {q.length>1 && results.length===0 && !sel && <div style={{textAlign:"center",padding:"40px 20px",background:C.panel,border:`1px solid ${C.line}`,borderRadius:6,marginBottom:8}}>
      <div style={{font:"32px sans-serif",marginBottom:12}}>🔍</div>
      <div style={{font:`700 18px/1.2 ${display}`,color:C.chalk,marginBottom:8}}>No results for "{q}"</div>
      <div style={{font:`13px/1.6 ${display}`,color:C.mute,maxWidth:380,margin:"0 auto 20px"}}>
        The search covers World Cup teams, coaches, famous upsets, and records — not individual players or specific match scores. Try one of these instead:
      </div>
      <div style={{display:"flex",flexWrap:"wrap",gap:8,justifyContent:"center",marginBottom:16}}>
        {["Brazil","Germany","Didier Deschamps","most goals","biggest upset","2022 final"].map(s=>(
          <button key={s} onClick={()=>setQ(s)} style={{font:`12px ${mono}`,padding:"7px 14px",cursor:"pointer",borderRadius:20,border:`1px solid ${C.gold}`,background:"transparent",color:C.gold}}>{s}</button>
        ))}
      </div>
      <button onClick={()=>{setQ(""); setSel(null);}} style={{font:`600 12px ${mono}`,padding:"8px 16px",cursor:"pointer",borderRadius:4,border:`1px solid ${C.line}`,background:"transparent",color:C.mute}}>← Clear search</button>
    </div>}

    {sel && <Preview item={sel}/>}

    {/* Default state — no query yet */}
    {!sel && !q && <div>
      <div style={{font:`600 10px ${mono}`,color:C.mute,letterSpacing:".14em",marginBottom:10,marginTop:16}}>TRENDING SEARCHES</div>
      <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
        {["Brazil","Germany upsets","Didier Deschamps","most goals","Saudi Arabia 2022","Spain 2010","Miroslav Klose","Netherlands finals"].map(s=>(
          <button key={s} onClick={()=>setQ(s)} style={{font:`12px ${mono}`,padding:"7px 12px",cursor:"pointer",borderRadius:20,border:`1px solid ${C.line}`,background:"transparent",color:C.mute}}>{s}</button>
        ))}
      </div>
    </div>}
  </div>;
}

function KnowledgeGraph(){

    </div>
    {/* Visual graph — SVG hub-and-spoke */}
    <Panel style={{marginBottom:16,overflow:"hidden"}}>
      <svg viewBox="0 0 700 380" style={{width:"100%",height:"auto"}}>
        {/* center node */}
        <circle cx="350" cy="190" r="46" fill={C.gold} opacity=".15" stroke={C.gold} strokeWidth="2"/>

        <text x="350" y="204" textAnchor="middle" style={{fill:C.chalk,fontSize:13,fontWeight:700,fontFamily:display}}>{center}</text>
        {/* spoke groups */}
        {nodeTypes.map((nt,gi)=>{
          const angles=[[270,315,45,90],[270,315,45,90]]; // top, right, bottom, left quadrant
          const baseAngle=gi*(360/nodeTypes.length)-30;
          const spokeAngle=(baseAngle)*Math.PI/180;
          const r=140;
          const sx=350+Math.cos(spokeAngle)*r;

          return <g key={gi}>
            <line x1="350" y1="190" x2={sx} y2={sy} stroke={nt.color} strokeWidth="1.5" strokeDasharray="4 3" opacity=".5"/>

            <text x={sx} y={sy+10} textAnchor="middle" style={{fill:C.chalk,fontSize:9,fontFamily:mono}}>{nt.label}</text>
          </g>;
        })}
      </svg>
    </Panel>
    {/* Expanded relationship panels */}
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
      {nodeTypes.map((nt,i)=>(
        <Panel key={i} style={{borderTop:`2px solid ${nt.color}`}}>
          <div style={{font:`700 11px ${mono}`,color:nt.color,letterSpacing:".1em",marginBottom:10}}>{nt.icon} {nt.label.toUpperCase()}</div>

        </Panel>
      ))}
    </div>
  </div>;
}

function StickyPredictor({onNavigate}){
  const M=window.WCModel;
  const [data,setData]=useState(null);
  const [votes,setVotes]=useState({});
  const [flash,setFlash]=useState(null);
  const [community,setCommunity]=useState({}); // {matchKey: {community:{TeamA:pct,...}, totalVotes}}
  const deviceId=useRef(getDeviceId());

  useEffect(()=>{
    fetch("/api/live").then(r=>r.json()).then(d=>{
      setData(d);
      const stored=JSON.parse(localStorage.getItem("wc-predictor-votes")||"{}");
      let updated=false;
      (d.finishedToday||[]).forEach(m=>{
        const key=`${m.home.name}v${m.away.name}`;
        const v=stored[key];
        if(v&&v.result==="pending"){
          const hs=m.home.score??0, as=m.away.score??0;
          const actualWinner=hs>as?m.home.name:as>hs?m.away.name:"Draw";
          const userCorrect=v.choice===actualWinner;
          stored[key]={...v,result:userCorrect?"correct":"wrong",actualWinner,score:`${hs}–${as}`};
          updated=true;
        }
      });
      if(updated) localStorage.setItem("wc-predictor-votes",JSON.stringify(stored));
      setVotes(stored);

      // Fetch real community vote percentages for each upcoming match
      (d.upcomingToday||[]).slice(0,2).forEach(m=>{
        const key=`${m.home.name}v${m.away.name}`;
        fetch(`/api/community?action=predict&matchKey=${encodeURIComponent(key)}`)
          .then(r=>r.json()).then(j=>setCommunity(prev=>({...prev,[key]:j})))
          .catch(()=>{});
      });
    }).catch(()=>{
      try{setVotes(JSON.parse(localStorage.getItem("wc-predictor-votes")||"{}"));}catch{}
    });
  },[]);

  const vote=(key,choice,aiPick)=>{
    const entry={choice,aiPick,lockedAt:new Date().toISOString(),result:"pending"};
    const next={...votes,[key]:entry};
    setVotes(next);
    try{localStorage.setItem("wc-predictor-votes",JSON.stringify(next));}catch{}
    setFlash(key);
    setTimeout(()=>setFlash(null),3000);
    // Persist to Supabase for real community tallies — fire and forget
    fetch("/api/community?action=predict",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({matchKey:key,deviceId:deviceId.current,choice,aiPick}),
    }).then(()=>
      fetch(`/api/community?action=predict&matchKey=${encodeURIComponent(key)}`).then(r=>r.json()).then(j=>setCommunity(prev=>({...prev,[key]:j})))
    ).catch(()=>{});
  };

  const Confetti=({active})=>{
    if(!active) return null;
    const dots=["#e8b84b","#3fae6f","#eef3ee","#d9543f","#74acdf"];
    return <div style={{position:"absolute",top:0,left:"50%",pointerEvents:"none",zIndex:50}}>
      {dots.map((color,i)=>(
        <div key={i} style={{
          position:"absolute",width:6,height:6,borderRadius:"50%",background:color,
          left:(i-2)*14+"px",top:0,
          animation:`confettiFall ${0.6+i*0.12}s ease forwards`,
          animationDelay:(i*0.06)+"s",
        }}/>
      ))}
    </div>;
  };

  const allVotes=Object.values(votes);
  const correct=allVotes.filter(v=>v.result==="correct").length;
  const wrong=allVotes.filter(v=>v.result==="wrong").length;
  const pending=allVotes.filter(v=>v.result==="pending").length;

  const upcoming=(data?.upcomingToday||[]).slice(0,2);
  const liveNow=(data?.live||[]).slice(0,2);
  const resolvedKeys=Object.keys(votes).filter(k=>votes[k].result!=="pending");
  const resolvedToShow=resolvedKeys.slice(-2);

  if(!data&&Object.keys(votes).length===0) return null;
  if(upcoming.length===0&&resolvedToShow.length===0&&liveNow.length===0) return null;

  return <Panel style={{marginBottom:20,borderColor:C.goldDim,background:"rgba(232,184,75,.03)"}}>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14,flexWrap:"wrap",gap:8}}>
      <div style={{font:`700 11px ${mono}`,color:C.gold,letterSpacing:".1em"}}>
        AI PREDICTOR vs YOU
        <Info text="Vote before each match kicks off. After full time, we check if your prediction was correct. Your personal score is saved on this device; community percentages are shared across all visitors."/>
      </div>
      {(correct+wrong)>0&&<div style={{display:"flex",gap:10,font:`11px ${mono}`}}>
        <span style={{color:C.grass}}>Correct: <b>{correct}</b></span>
        <span style={{color:C.red}}>Wrong: <b>{wrong}</b></span>
        {pending>0&&<span style={{color:C.mute}}>Pending: <b>{pending}</b></span>}
      </div>}
    </div>

    {/* Live match minute ticker — if anything is in play right now */}
    {liveNow.map(m=>(
      <div key={m.id} style={{display:"flex",alignItems:"center",gap:10,marginBottom:12,padding:"10px 12px",
        borderRadius:5,background:"rgba(217,84,63,.08)",border:"1px solid rgba(217,84,63,.3)"}}>
        <span style={{position:"relative",width:7,height:7,flexShrink:0}}>
          <span style={{position:"absolute",width:7,height:7,borderRadius:"50%",background:C.red}}/>
          <span style={{position:"absolute",width:7,height:7,borderRadius:"50%",background:C.red,animation:"liveDotPing 1.6s ease-out infinite"}}/>
        </span>
        <span style={{font:`700 11px ${mono}`,color:C.red}}>LIVE {m.minute?m.minute+"'":""}</span>
        <span style={{font:`600 13px ${display}`,color:C.chalk,flex:1}}>
          {flagOf(m.home.name)} {m.home.name} {m.home.score??0}–{m.away.score??0} {m.away.name} {flagOf(m.away.name)}
        </span>
      </div>
    ))}

    {resolvedToShow.map(key=>{
      const v=votes[key];
      const isCorrect=v.result==="correct";
      const [home,away]=key.replace("v"," vs ").split(" vs ");
      return <div key={key} style={{marginBottom:12,padding:"10px 12px",borderRadius:4,
        background:isCorrect?"rgba(63,174,111,.08)":"rgba(217,84,63,.08)",
        border:`1px solid ${isCorrect?C.grass:"rgba(217,84,63,.4)"}`}}>
        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
          <span style={{font:`700 14px ${display}`,color:isCorrect?C.grass:C.red}}>{isCorrect?"✓":"✗"}</span>
          <span style={{font:`600 13px ${display}`,color:C.chalk}}>{flagOf(home)} {key.replace("v"," vs ")} {flagOf(away)}</span>
          {v.score&&<span style={{font:`700 13px ${mono}`,color:C.gold}}>{v.score}</span>}
        </div>
        <div style={{font:`11px ${mono}`,color:C.mute,marginTop:4}}>
          You predicted {v.choice} · AI picked {v.aiPick} · {isCorrect?"You beat the AI!":"AI got it right"}
        </div>
      </div>;
    })}

    {upcoming.map(m=>{
      const key=`${m.home.name}v${m.away.name}`;
      const {winA,winB}=M.matchOutcome(m.home.name,m.away.name);
      const drawProb=Math.max(0,1-winA-winB)||0.08;
      const norm=winA+winB+drawProb;
      const aiPcts={[m.home.name]:Math.round(winA/norm*100),[m.away.name]:Math.round(winB/norm*100),Draw:Math.round(drawProb/norm*100)};
      const aiPick=Object.entries(aiPcts).sort((a,b)=>b[1]-a[1])[0][0];
      const myVote=votes[key];
      const comm=community[key]?.community||{};
      const commTotal=community[key]?.totalVotes||0;
      const isFlashing=flash===key;

      const ChoiceBtn=({team,pct})=>{
        const selected=myVote?.choice===team;
        const col=team==="Draw"?C.mute:C.chalk;
        return <button onClick={()=>!myVote&&vote(key,team,aiPick)}
          onMouseEnter={e=>{ if(!myVote){e.currentTarget.style.transform="scale(1.03)";e.currentTarget.style.boxShadow=`0 0 0 3px rgba(232,184,75,.18)`;e.currentTarget.style.borderColor=C.gold;} }}

            border:`1.5px solid ${selected?C.gold:C.line}`,
            background:selected?"rgba(232,184,75,.14)":"transparent",
            color:selected?C.gold:col,transition:"transform .15s,box-shadow .15s,border-color .15s",
            display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
          <span>{team==="Draw"?"🤝":flagOf(team)} {team==="Draw"?"Draw":team}</span>
          {myVote&&<span style={{font:`700 10px ${mono}`,color:C.mute}}>{comm[team]||0}%</span>}
        </button>;
      };

      return <div key={key} style={{marginBottom:14,paddingBottom:14,borderBottom:`1px solid ${C.line}`,position:"relative"}}>
        <Confetti active={isFlashing}/>
        <div style={{font:`600 14px/1.3 ${display}`,color:C.chalk,marginBottom:4}}>
          {flagOf(m.home.name)} {m.home.name} vs {m.away.name} {flagOf(m.away.name)}
          <span style={{font:`11px ${mono}`,color:C.mute,marginLeft:8}}>{localTime(m.utcKickoff)}</span>
        </div>
        <div style={{font:`12px ${mono}`,color:C.gold,marginBottom:10}}>
          AI picks <b style={{color:C.chalk}}>{aiPick}</b> — {aiPcts[aiPick]}% confidence
          <Info text={`Elo model: ${m.home.name} rated ${M.rating(m.home.name)}, ${m.away.name} rated ${M.rating(m.away.name)}. Win probability uses the logistic formula: 1/(1+10^(ΔElo/400)).`}/>
        </div>

        {isFlashing&&<div className="pred-badge" style={{
          padding:"10px 14px",borderRadius:5,marginBottom:10,
          background:"rgba(232,184,75,.12)",border:`1px solid ${C.gold}`,
          display:"flex",alignItems:"center",gap:8,
        }}>
          <span style={{fontSize:16}}>✓</span>
          <div>
            <div style={{font:`600 13px ${display}`,color:C.gold,marginBottom:2}}>Prediction saved!</div>
            <div style={{font:`11px ${mono}`,color:C.mute}}>Come back post-match to check your score.</div>
          </div>
        </div>}

        <div style={{display:"flex",gap:6,marginBottom:myVote?10:0}}>
          <ChoiceBtn team={m.home.name} pct={aiPcts[m.home.name]}/>
          <ChoiceBtn team="Draw" pct={aiPcts.Draw}/>
          <ChoiceBtn team={m.away.name} pct={aiPcts[m.away.name]}/>
        </div>

        {/* Community vs AI consensus bar */}
        {myVote&&commTotal>0&&<div>
          <div style={{font:`9px ${mono}`,color:C.mute,letterSpacing:".08em",marginBottom:6}}>
            COMMUNITY ({commTotal} {commTotal===1?"vote":"votes"}) VS AI
          </div>
          {[m.home.name,"Draw",m.away.name].map(team=>(
            <div key={team} style={{marginBottom:5}}>
              <div style={{display:"flex",justifyContent:"space-between",font:`10px ${mono}`,color:C.mute,marginBottom:2}}>
                <span>{team==="Draw"?"Draw":`${flagOf(team)} ${team}`}</span>
                <span>Community {comm[team]||0}% · AI {aiPcts[team]}%</span>
              </div>
              <div style={{position:"relative",height:5,background:C.pitch2,borderRadius:3,overflow:"hidden"}}>
                <div style={{position:"absolute",left:0,height:"100%",width:(comm[team]||0)+"%",background:C.gold,borderRadius:3,opacity:.85}}/>
                <div style={{position:"absolute",left:0,top:0,height:"100%",width:aiPcts[team]+"%",borderRight:`2px solid ${C.chalk}`}}/>
              </div>
            </div>
          ))}
        </div>}
      </div>;
    })}
    <button onClick={()=>onNavigate("Team Predictor")} style={{font:`11px ${mono}`,color:C.gold,background:"none",border:"none",cursor:"pointer",padding:0}}>
      View full Elo match predictor
    </button>
  </Panel>;
}

// Surfaces the single most newsworthy storyline from today's finished matches.
// Built ENTIRELY from real match event data (goals/cards with minute + player),
// never from unstructured news text — so we never risk inventing a stat.
/* ===================== TOURNAMENT HIGHLIGHTS ===================== */
// Best storylines from the WHOLE tournament so far (hat-tricks, routs),
// not just today. Keeps moments like Messi's hat-trick visible even days
// after it happened, instead of disappearing once "today" moves on.
function TournamentHighlights({onOpenMatch}){
  const [highlights,setHighlights]=useState(null);
  const [idx,setIdx]=useState(0);

  useEffect(()=>{
    fetch("/api/results?highlights=1").then(r=>r.json()).then(d=>{
      setHighlights(d.highlights||[]);
    }).catch(()=>setHighlights([]));
  },[]);

  if(highlights===null) return null; // still loading, don't flash empty state
  if(highlights.length===0) return null;

  const TYPE_STYLE={
    hattrick:{accent:"#e8b84b", label:"HAT-TRICK"},
    brace:   {accent:"#e8b84b", label:"BRACE"},
    rout:    {accent:"#d9543f", label:"ROUT"},
  };
  const h=highlights[idx];
  const ts=TYPE_STYLE[h.type]||TYPE_STYLE.hattrick;

  return <div style={{maxWidth:680,margin:"0 auto 20px"}}>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
      <div style={{font:`600 9px ${mono}`,color:C.mute,letterSpacing:".14em"}}>TOURNAMENT HIGHLIGHTS</div>
      {highlights.length>1&&<div style={{font:`10px ${mono}`,color:C.mute}}>{idx+1} / {highlights.length}</div>}
    </div>
    <div onClick={()=>onOpenMatch&&onOpenMatch(h.matchId)} style={{
      display:"flex",alignItems:"center",gap:12,padding:"12px 16px",borderRadius:8,cursor:"pointer",
      background:`${ts.accent}10`,border:`1px solid ${ts.accent}55`,transition:"background .15s",
    }}
    onMouseEnter={e=>e.currentTarget.style.background=`${ts.accent}18`}
    onMouseLeave={e=>e.currentTarget.style.background=`${ts.accent}10`}>
      <span style={{fontSize:22,flexShrink:0}}>{h.icon}</span>
      <div style={{flex:1,minWidth:0}}>
        <span style={{font:`700 9px ${mono}`,color:ts.accent,letterSpacing:".12em",marginRight:8}}>{ts.label}</span>
        <span style={{font:`600 13px/1.4 ${display}`,color:C.chalk}}>{h.text}</span>
      </div>
      {highlights.length>1&&<div style={{display:"flex",gap:4,flexShrink:0}}>
        <button onClick={e=>{e.stopPropagation();setIdx(i=>(i-1+highlights.length)%highlights.length);}}
          style={{width:22,height:22,borderRadius:"50%",border:`1px solid ${C.line}`,background:"transparent",color:C.mute,cursor:"pointer",font:`12px ${mono}`}}>‹</button>
        <button onClick={e=>{e.stopPropagation();setIdx(i=>(i+1)%highlights.length);}}
          style={{width:22,height:22,borderRadius:"50%",border:`1px solid ${C.line}`,background:"transparent",color:C.mute,cursor:"pointer",font:`12px ${mono}`}}>›</button>
      </div>}
    </div>
  </div>;
}

function TodayHighlight({onOpenMatch}){
  const [highlight,setHighlight]=useState(null);
  const [loading,setLoading]=useState(true);

  useEffect(()=>{
    fetch("/api/live").then(r=>r.json()).then(async d=>{
      // finishedToday spans a rolling 2-day UTC window (for timezone safety
      // elsewhere in the app) — but a HIGHLIGHT should only ever be about
      // something that actually happened recently. Filter to matches whose
      // kickoff was within the last 18 hours, which comfortably covers a
      // full match + stoppage time while excluding yesterday's results.
      const RECENT_MS=18*3600*1000;
      const now=Date.now();
      const finished=(d.finishedToday||[]).filter(m=>{
        const kicked=new Date(m.utcKickoff).getTime();
        return !isNaN(kicked) && (now-kicked)<=RECENT_MS;
      });
      if(finished.length===0){ setLoading(false); return; }

      // Fetch match detail (goal scorers) for each finished match, in parallel
      const details=await Promise.all(
        finished.slice(0,6).map(m=>
          fetch("/api/match?id="+m.id).then(r=>r.json()).then(detail=>({m,detail})).catch(()=>null)
        )
      );

      const candidates=[];
      details.filter(Boolean).forEach(({m,detail})=>{
        if(!detail.events) return;
        const goals=detail.events.filter(e=>e.type==="GOAL");
        // Tally goals per player
        const tally={};
        goals.forEach(g=>{ if(g.player) tally[g.player]=(tally[g.player]||0)+1; });

        // Candidate 1: hat-trick or brace (3+ or 2+ goals by one player)
        Object.entries(tally).forEach(([player,count])=>{
          if(count>=2){
            const scorerTeam=goals.find(g=>g.player===player)?.team;
            candidates.push({
              priority: count>=3?100:60,
              type: count>=3?"hattrick":"brace",
              text: `${player} scored ${count>=3?"a hat-trick":"a brace"} as ${m.home.name} ${m.home.score}–${m.away.score} ${m.away.name}`,
              icon: count>=3?"🔥":"⚽", matchId:m.id, team:scorerTeam,
            });
          }
        });

        // Candidate 2: big win margin (3+ goal difference)
        const margin=Math.abs((m.home.score??0)-(m.away.score??0));
        if(margin>=3){
          const winner=m.home.score>m.away.score?m.home.name:m.away.name;
          candidates.push({
            priority:50+margin,
            type:"rout",
            text:`${winner} put on a statement performance — ${m.home.name} ${m.home.score}–${m.away.score} ${m.away.name}`,
            icon:"💥", matchId:m.id,
          });
        }

        // Candidate 3: late drama (goal in 85'+)
        const lateGoals=goals.filter(g=>g.minute>=85);
        if(lateGoals.length>0 && margin<=1){
          candidates.push({
            priority:40,
            type:"late",
            text:`${lateGoals[lateGoals.length-1].player} struck in the ${lateGoals[lateGoals.length-1].minute}' to decide ${m.home.name} ${m.home.score}–${m.away.score} ${m.away.name}`,
            icon:"⏱", matchId:m.id,
          });
        }

        // Candidate 4: red card drama
        const reds=detail.events.filter(e=>e.type==="RED");
        if(reds.length>0){
          candidates.push({
            priority:30,
            type:"red",
            text:`${reds[0].player} sent off as ${m.home.name} ${m.home.score}–${m.away.score} ${m.away.name}`,
            icon:"🟥", matchId:m.id,
          });
        }
      });

      // Pick highest-priority candidate
      candidates.sort((a,b)=>b.priority-a.priority);
      setHighlight(candidates[0]||null);
      setLoading(false);
    }).catch(()=>setLoading(false));
  },[]);

  if(loading) return <div style={{maxWidth:680,margin:"0 auto 28px"}}><Skeleton height={64} radius={10}/></div>;
  if(!highlight) return null;

  // Type-specific accent colour and label for visual variety
  const TYPE_STYLE={
    hattrick:{accent:"#e8b84b", label:"HAT-TRICK", glow:"rgba(232,184,75,.4)"},
    brace:   {accent:"#e8b84b", label:"BRACE",     glow:"rgba(232,184,75,.4)"},
    rout:    {accent:"#d9543f", label:"ROUT",      glow:"rgba(217,84,63,.4)"},
    late:    {accent:"#3fae6f", label:"LATE DRAMA", glow:"rgba(63,174,111,.4)"},
    red:     {accent:"#d9543f", label:"RED CARD",  glow:"rgba(217,84,63,.4)"},
  };
  const ts=TYPE_STYLE[highlight.type]||TYPE_STYLE.hattrick;

  return (
    <div onClick={()=>onOpenMatch&&onOpenMatch(highlight.matchId)}
      className="highlight-banner"
      style={{maxWidth:680,margin:"0 auto 28px",cursor:"pointer",position:"relative"}}>
      <div style={{
        position:"relative",overflow:"hidden",
        display:"flex",alignItems:"center",gap:14,padding:"16px 22px",borderRadius:10,
        background:`linear-gradient(135deg, ${ts.accent}22, ${ts.accent}08)`,
        border:`1.5px solid ${ts.accent}`,
        transition:"transform .15s",
      }}
      onMouseEnter={e=>e.currentTarget.style.transform="scale(1.012)"}
      onMouseLeave={e=>e.currentTarget.style.transform="scale(1)"}>
        {/* Shimmer sweep overlay */}
        <div className="highlight-shimmer"/>

        {/* Pulsing live-style dot + label */}
        <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:4,flexShrink:0}}>
          <span className="highlight-icon" style={{fontSize:28}}>{highlight.icon}</span>
          <div style={{position:"relative",width:6,height:6}}>
            <span style={{position:"absolute",width:6,height:6,borderRadius:"50%",background:ts.accent}}/>
            <span style={{position:"absolute",width:6,height:6,borderRadius:"50%",background:ts.accent,animation:"liveDotPing 1.8s ease-out infinite"}}/>
          </div>
        </div>

        <div style={{flex:1,minWidth:0,position:"relative",zIndex:1}}>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
            <span style={{font:`800 9px ${mono}`,color:ts.accent,letterSpacing:".16em",padding:"2px 7px",borderRadius:3,border:`1px solid ${ts.accent}`}}>{ts.label}</span>
            <span style={{font:`600 9px ${mono}`,color:C.mute,letterSpacing:".12em"}}>TODAY'S HIGHLIGHT</span>
          </div>

// Swipeable card carousel of the greatest World Cup moments — touch drag,
// mouse drag, dot indicators, auto-advance every 6s (pauses on interaction).
function StoryCarousel({onNavigate}){
  const D=window.WCData;
  const stories=[...D.STORIES.greatestFinals, ...D.STORIES.greatestGoals];
  const [idx,setIdx]=useState(0);
  const [dragX,setDragX]=useState(0);
  const dragging=useRef(false);
  const startX=useRef(0);
  const autoRef=useRef(null);

  const next=()=>setIdx(i=>(i+1)%stories.length);
  const prev=()=>setIdx(i=>(i-1+stories.length)%stories.length);

  // Auto-advance every 6s, paused while user is dragging
  useEffect(()=>{
    autoRef.current=setInterval(()=>{ if(!dragging.current) next(); },6000);
    return ()=>clearInterval(autoRef.current);
  },[stories.length]);

  const onDown=(clientX)=>{ dragging.current=true; startX.current=clientX; };
  const onMove=(clientX)=>{ if(dragging.current) setDragX(clientX-startX.current); };
  const onUp=()=>{
    if(!dragging.current) return;
    dragging.current=false;
    if(dragX<-60) next();
    else if(dragX>60) prev();
    setDragX(0);
  };

  if(stories.length===0) return null;
  const s=stories[idx];

  return <Panel style={{background:"rgba(232,184,75,.04)",borderColor:C.gold,padding:0,overflow:"hidden"}}>
    <div style={{padding:"18px 22px 6px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
      <div style={{font:`700 11px ${mono}`,color:C.gold,letterSpacing:".1em"}}>📖 GREATEST WORLD CUP MOMENTS</div>
      <div style={{font:`10px ${mono}`,color:C.mute}}>{idx+1} / {stories.length}</div>
    </div>

    <div
      style={{position:"relative",overflow:"hidden",cursor:"grab",touchAction:"pan-y",userSelect:"none"}}
      onMouseDown={e=>onDown(e.clientX)}
      onMouseMove={e=>onMove(e.clientX)}
      onMouseUp={onUp}
      onMouseLeave={onUp}
      onTouchStart={e=>onDown(e.touches[0].clientX)}
      onTouchMove={e=>onMove(e.touches[0].clientX)}
      onTouchEnd={onUp}
    >
      <div style={{
        display:"flex",transform:`translateX(${-idx*100+(dragX/3.6)}%)`,
        transition:dragging.current?"none":"transform .4s cubic-bezier(.25,.8,.3,1)",
      }}>
        {stories.map((st,i)=>(
          <div key={i} style={{flex:"0 0 100%",padding:"10px 22px 18px",boxSizing:"border-box"}}>
            <div style={{font:`800 20px/1.1 ${display}`,color:C.chalk,marginBottom:6}}>{st.icon} {st.title}</div>
            <div style={{font:`12px ${mono}`,color:C.gold,marginBottom:10}}>{st.year} · {st.subtitle}</div>
            <div style={{position:"relative",maxHeight:84,overflow:"hidden",marginBottom:6}}>
              <div style={{font:`14px/1.7 ${display}`,color:C.mute}}>{st.story}</div>
              <div style={{position:"absolute",bottom:0,left:0,right:0,height:32,background:`linear-gradient(transparent,${C.panel})`}}/>
            </div>
          </div>
        ))}
      </div>
    </div>

    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"4px 22px 18px"}}>
      <div style={{display:"flex",gap:6}}>
        {stories.map((_,i)=>(
          <button key={i} onClick={()=>setIdx(i)}
            style={{width:i===idx?18:6,height:6,borderRadius:3,border:"none",cursor:"pointer",
              background:i===idx?C.gold:C.line,transition:"width .25s,background .25s",padding:0}}/>
        ))}
      </div>
      <div style={{display:"flex",gap:6}}>
        <button onClick={prev} style={{width:28,height:28,borderRadius:"50%",border:`1px solid ${C.line}`,background:"transparent",color:C.mute,cursor:"pointer",font:`14px ${mono}`}}>‹</button>
        <button onClick={next} style={{width:28,height:28,borderRadius:"50%",border:`1px solid ${C.line}`,background:"transparent",color:C.mute,cursor:"pointer",font:`14px ${mono}`}}>›</button>
        <button onClick={()=>onNavigate("Stories")} style={{font:`600 11px ${mono}`,color:C.gold,background:"none",border:`1px solid ${C.gold}`,borderRadius:14,padding:"5px 12px",cursor:"pointer",marginLeft:4}}>All stories →</button>
      </div>
    </div>
  </Panel>;
}

// Lighter-weight version of DailyTrivia for the front page — answer right
// there without a click-through, see real community vote tallies.
function HomepageTrivia(){
  const todaySeed=new Date().toISOString().slice(0,10).replace(/-/g,'');
  const q=TRIVIA[parseInt(todaySeed)%TRIVIA.length];
  const [ans,setAns]=useState(null);
  const [tally,setTally]=useState(null);
  const deviceId=useRef(getDeviceId());

  useEffect(()=>{
    // Restore previous answer for today, if any
    try{
      const saved=JSON.parse(localStorage.getItem("wc-trivia-"+todaySeed)||"null");
      if(saved) setAns(saved);
    }catch{}
    fetch(`/api/community?action=trivia&questionDate=${todaySeed}`).then(r=>r.json()).then(setTally).catch(()=>{});
  },[]);

  const correct=ans===q.a;
  const pickAnswer=(opt)=>{
    if(ans) return;
    setAns(opt);
    try{localStorage.setItem("wc-trivia-"+todaySeed,JSON.stringify(opt));}catch{}
    fetch("/api/community?action=trivia",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({questionDate:todaySeed,deviceId:deviceId.current,answer:opt,correct:opt===q.a}),
    }).then(()=>
      fetch(`/api/community?action=trivia&questionDate=${todaySeed}`).then(r=>r.json()).then(setTally)
    ).catch(()=>{});
  };

  const totalVotes=tally?.totalVotes||0;
  const pctFor=(opt)=>totalVotes>0?Math.round(((tally?.tally?.[opt]||0)/totalVotes)*100):0;

  return <Panel style={{marginBottom:20,borderColor:C.gold,background:"linear-gradient(135deg, rgba(232,184,75,.07), rgba(232,184,75,.02))"}}>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
      <div style={{font:`700 11px ${mono}`,color:C.gold,letterSpacing:".1em"}}>🧠 DAILY TRIVIA{q.year?` · ${q.year}`:""}</div>
      {totalVotes>0&&<span style={{font:`10px ${mono}`,color:C.mute}}>{totalVotes} {totalVotes===1?"answer":"answers"} today</span>}
    </div>
    <div style={{font:`700 16px/1.4 ${display}`,color:C.chalk,marginBottom:14}}>{q.q}</div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:ans?12:0}}>
      {q.opts.map((opt,i)=>{
        const selected=ans===opt, isCorrect=opt===q.a;
        const showResult=!!ans;
        const bg=showResult?(isCorrect?"rgba(63,174,111,.14)":selected?"rgba(217,84,63,.12)":"transparent"):"transparent";
        const border=showResult?(isCorrect?C.grass:selected?C.red:C.line):C.line;
        const col=showResult?(isCorrect?C.grass:selected?C.red:C.mute):C.chalk;
        return <button key={opt} onClick={()=>pickAnswer(opt)}
          onMouseEnter={e=>{ if(!ans){e.currentTarget.style.borderColor=C.gold;e.currentTarget.style.transform="scale(1.02)";} }}
          onMouseLeave={e=>{ if(!ans){e.currentTarget.style.borderColor=C.line;e.currentTarget.style.transform="scale(1)";} }}
          style={{font:`600 13px ${display}`,padding:"10px 12px",cursor:ans?"default":"pointer",
            borderRadius:5,border:`1px solid ${border}`,background:bg,color:col,
            textAlign:"left",transition:"all .15s",position:"relative",overflow:"hidden"}}>
          <span style={{position:"relative",zIndex:1,display:"flex",justifyContent:"space-between"}}>
            <span>{"ABCD"[i]}. {opt}</span>
            {showResult&&totalVotes>0&&<span style={{font:`10px ${mono}`,opacity:.8}}>{pctFor(opt)}%</span>}
          </span>
          {showResult&&totalVotes>0&&<span style={{position:"absolute",left:0,top:0,bottom:0,width:pctFor(opt)+"%",background:isCorrect?"rgba(63,174,111,.1)":"rgba(255,255,255,.04)",zIndex:0}}/>}
        </button>;
      })}
    </div>
    {ans&&<div style={{padding:"11px 14px",borderRadius:5,background:correct?"rgba(63,174,111,.08)":"rgba(217,84,63,.08)",border:`1px solid ${correct?C.grass:"rgba(217,84,63,.4)"}`}}>
      <div style={{font:`700 13px ${display}`,color:correct?C.grass:C.red,marginBottom:4}}>{correct?"Correct!":"Not quite — "+q.a}</div>
      <div style={{font:`12px/1.5 ${display}`,color:C.mute}}>{q.fact}</div>
    </div>}
  </Panel>;
}

function DailyTrivia(){
  // Seed with today's date so everyone gets the same question each day
  const todaySeed=new Date().toISOString().slice(0,10).replace(/-/g,'');
  const idx=parseInt(todaySeed)%TRIVIA.length;
  const q=TRIVIA[idx];
  const [ans,setAns]=useState(null);
  const [showFact,setShowFact]=useState(false);
  const correct=ans===q.a;
  return <div>
    <H2 eyebrow="Daily Trivia" title="Test your World Cup IQ"/>
    <p style={{font:`13px/1.5 ${display}`,color:C.mute,margin:"0 0 20px",maxWidth:560}}>A new question every day, drawn from 90 years of World Cup history. Everyone gets the same question.</p>

      <div style={{font:`600 11px ${mono}`,color:C.gold,letterSpacing:".1em",marginBottom:12}}>

      </div>
      <div style={{font:`700 18px/1.4 ${display}`,color:C.chalk,marginBottom:20}}>{q.q}</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
        {q.opts.map(opt=>{
          const selected=ans===opt;
          const isCorrect=opt===q.a;
          const bg=ans?(isCorrect?"rgba(63,174,111,.15)":selected?"rgba(217,84,63,.15)":"transparent"):selected?"rgba(232,184,75,.1)":"transparent";
          const border=ans?(isCorrect?C.grass:selected?C.red:C.line):selected?C.gold:C.line;
          const col=ans?(isCorrect?C.grass:selected?C.red:C.mute):selected?C.gold:C.mute;
          return <button key={opt} onClick={()=>{if(!ans){setAns(opt);setTimeout(()=>setShowFact(true),400);}}}
            style={{font:`600 14px ${display}`,padding:"12px 16px",cursor:ans?"default":"pointer",borderRadius:4,
              border:`1px solid ${border}`,background:bg,color:col,textAlign:"left",transition:"all .2s"}}>
            {ans&&isCorrect&&"✓ "}{ans&&selected&&!isCorrect&&"✗ "}{opt}
          </button>;
        })}
      </div>
      {ans&&<div style={{padding:"14px 16px",borderRadius:4,background:correct?"rgba(63,174,111,.08)":"rgba(217,84,63,.08)",border:`1px solid ${correct?C.grass:C.red}`,marginBottom:12}}>
        <div style={{font:`700 15px ${display}`,color:correct?C.grass:C.red,marginBottom:6}}>{correct?"🎉 Correct!":"❌ Not quite — the answer is "+q.a}</div>
        {showFact&&<div style={{font:`13px/1.6 ${display}`,color:C.mute}}>{q.fact}</div>}
      </div>}

        <button onClick={()=>{setAns(null);setShowFact(false);}} style={{font:`600 12px ${mono}`,padding:"8px 14px",cursor:"pointer",borderRadius:4,border:`1px solid ${C.line}`,background:"transparent",color:C.mute}}>Try again</button>
        <button onClick={()=>{const txt=`I just answered a World Cup Trivia question ${correct?"correctly! 🎉":"incorrectly... 😅"} Can you beat me? Try at fifa.rajeevbuilds.dev`;navigator.clipboard?.writeText(txt).catch(()=>{});}} style={{font:`600 12px ${mono}`,padding:"8px 14px",cursor:"pointer",borderRadius:4,border:`1px solid ${C.gold}`,background:"transparent",color:C.gold}}>📋 Copy & Share</button>

    <Panel style={{padding:"12px 16px"}}>
      <div style={{font:`600 10px ${mono}`,color:C.mute,marginBottom:8}}>ALL TRIVIA QUESTIONS ({TRIVIA.length} total — cycles daily)</div>

function NewsFeed(){
  const [data,setData]=useState(null);
  const [err,setErr]=useState(null);
  const [filter,setFilter]=useState("all");
  useEffect(()=>{
    fetch("/api/visit?news=1").then(r=>r.json()).then(j=>{
      if(j.error&&!j.items) throw new Error(j.error);
      setData(j);
    }).catch(e=>setErr(e.message));
  },[]);

  const sources=data?[...new Set(data.items.map(i=>i.src))]:[];
  const items=(data?.items||[]).filter(i=>filter==="all"||i.src===filter);
  const timeAgo=(pub)=>{
    if(!pub) return "";
    const diff=Date.now()-new Date(pub).getTime();
    const h=Math.floor(diff/3600000);
    if(h<1) return `${Math.floor(diff/60000)}m ago`;
    if(h<24) return `${h}h ago`;
    return `${Math.floor(h/24)}d ago`;
  };

  return <div>
    <H2 eyebrow="Football News" title="Latest World Cup news"/>
    <p style={{font:`13px/1.5 ${display}`,color:C.mute,margin:"0 0 16px",maxWidth:560}}>
      Live headlines from BBC Sport, The Guardian, and Google News. Updates every 30 minutes. Click any story to read the full article.
    </p>

    {/* Source filter */}
    {sources.length>0&&<div style={{display:"flex",gap:8,marginBottom:16,flexWrap:"wrap"}}>
      {["all",...sources].map(s=><button key={s} onClick={()=>setFilter(s)}
        style={{font:`600 11px ${mono}`,padding:"6px 12px",cursor:"pointer",borderRadius:20,
          border:`1px solid ${filter===s?C.gold:C.line}`,
          background:filter===s?C.gold:"transparent",
          color:filter===s?C.pitch:C.mute}}>
        {s==="all"?"All sources":s}
      </button>)}
    </div>}

    {err&&<Panel style={{borderColor:"rgba(217,84,63,.35)"}}>
      <div style={{font:`13px ${display}`,color:C.red}}>News feed unavailable — {err}</div>
      <div style={{font:`12px ${mono}`,color:C.mute,marginTop:6}}>RSS feeds may be temporarily unreachable. Try again in a few minutes.</div>
    </Panel>}

    {!data&&!err&&<div style={{display:"grid",gap:12}}>
      {[1,2,3,4,5].map(i=><Panel key={i} style={{padding:16}}>
        <Skeleton width="60%" height={14} style={{marginBottom:8}}/>
        <Skeleton width="90%" height={12} style={{marginBottom:6}}/>
        <Skeleton width="75%" height={12}/>
      </Panel>)}
    </div>}

    {items.length>0&&<div style={{display:"grid",gap:10}}>
      {items.map((item,i)=>(
        <a key={i} href={item.link} target="_blank" rel="noopener noreferrer"
          style={{textDecoration:"none",display:"block"}}>
          <div style={{background:C.panel,border:`1px solid ${C.line}`,borderRadius:4,padding:16,
            transition:"border-color .15s,background .15s",cursor:"pointer"}}
            onMouseEnter={e=>{e.currentTarget.style.borderColor=C.gold;e.currentTarget.style.background=`rgba(232,184,75,.04)`;}}
            onMouseLeave={e=>{e.currentTarget.style.borderColor=C.line;e.currentTarget.style.background=C.panel;}}>
            <div style={{display:"flex",gap:14,alignItems:"flex-start"}}>
              {item.img&&<img src={item.img} alt="" loading="lazy"
                style={{width:80,height:54,objectFit:"cover",borderRadius:3,flexShrink:0,border:`1px solid ${C.line}`}}
                onError={e=>e.target.style.display="none"}/>}
              <div style={{flex:1,minWidth:0}}>
                <div style={{font:`700 15px/1.3 ${display}`,color:C.chalk,marginBottom:6}}>{item.title}</div>
                {item.desc&&<div style={{font:`12px/1.5 ${display}`,color:C.mute,marginBottom:8,
                  overflow:"hidden",display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical"}}>
                  {item.desc}
                </div>}
                <div style={{display:"flex",gap:10,font:`10px ${mono}`,color:C.mute,alignItems:"center"}}>
                  <span style={{color:C.gold,fontWeight:600}}>{item.src}</span>
                  {item.pub&&<span>{timeAgo(item.pub)}</span>}

              </div>
            </div>
          </div>
        </a>
      ))}
