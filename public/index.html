// 2026 WC knockout: R32(16 matches) -> R16(8) -> QF(4) -> SF(2) -> Final(1)
// We seed from Elo ratings — top 16 vs bottom 16 by rating order
function BracketSimulator(){
  const M=window.WCModel;
  const allTeams=Object.keys(M.RATINGS).sort((a,b)=>M.rating(b)-M.rating(a));
  // Seeds: top 16 (1-16) vs bottom 16 (17-32 reversed for bracket balance)
  const top=allTeams.slice(0,16);
  const bot=allTeams.slice(16,32);
  const initMatchups=top.map((t,i)=>({home:t,away:bot[15-i]}));

  const ROUNDS=["Round of 32","Round of 16","Quarter-finals","Semi-finals","Final"];
  const [bracket,setBracket]=useState(()=>{
    // bracket[round] = array of {home,away,winner}
    return [initMatchups.map(m=>({...m,winner:null})),...Array(4).fill(null).map(()=>[])];
  });
  const [view,setView]=useState("bracket"); // "bracket" | "share"
  const [shareMsg,setShareMsg]=useState(null);

  const simulateMatch=(home,away)=>{
    const {winA,winB}=M.matchOutcome(home,away);
    return Math.random()<winA/(winA+winB)?home:away;
  };

  const pickWinner=(roundIdx,matchIdx,winner)=>{
    setBracket(prev=>{
      const next=prev.map(r=>r.map(m=>({...m})));
      next[roundIdx][matchIdx].winner=winner;
      // Advance winner to next round
      const nextRound=roundIdx+1;
      if(nextRound<=4){
        const slot=Math.floor(matchIdx/2);
        if(!next[nextRound][slot]) next[nextRound][slot]={home:null,away:null,winner:null};
        if(matchIdx%2===0) next[nextRound][slot].home=winner;
        else next[nextRound][slot].away=winner;
        // Clear any downstream winners when re-picking
        for(let r=nextRound;r<=4;r++){
          const s=Math.floor(matchIdx/Math.pow(2,r-roundIdx));
          if(next[r][s]){
            if(r>nextRound) next[r][s]={home:null,away:null,winner:null};
            else { next[r][s].winner=null; }
          }
        }
      }
      return next;
    });
  };

  const simulateRound=(roundIdx)=>{
    setBracket(prev=>{
      const next=prev.map(r=>r.map(m=>({...m})));
      const matches=next[roundIdx];
      matches.forEach((m,i)=>{
        if(m.home&&m.away&&!m.winner){
          const w=simulateMatch(m.home,m.away);
          next[roundIdx][i].winner=w;
          const nextRound=roundIdx+1;
          if(nextRound<=4){
            const slot=Math.floor(i/2);
            if(!next[nextRound][slot]) next[nextRound][slot]={home:null,away:null,winner:null};
            if(i%2===0) next[nextRound][slot].home=w;
            else next[nextRound][slot].away=w;
          }
        }
      });
      return next;
    });
  };

  const simulateAll=()=>{
    let b=[initMatchups.map(m=>({...m,winner:null})),...Array(4).fill(null).map(()=>[])];
    for(let r=0;r<4;r++){
      const matches=b[r];
      matches.forEach((m,i)=>{
        if(m.home&&m.away){
          const w=simulateMatch(m.home,m.away);
          b[r][i].winner=w;
          const slot=Math.floor(i/2);
          if(!b[r+1][slot]) b[r+1][slot]={home:null,away:null,winner:null};
          if(i%2===0) b[r+1][slot].home=w;
          else b[r+1][slot].away=w;
        }
      });
    }
    setBracket(b);
  };

  const reset=()=>setBracket([initMatchups.map(m=>({...m,winner:null})),...Array(4).fill(null).map(()=>[])]);

  const champion=bracket[4]?.[0]?.winner;
  const finalist1=bracket[3]?.[0]?.winner;
  const finalist2=bracket[3]?.[1]?.winner;

  const genShare=()=>{
    const msg=champion
      ?`My 2026 World Cup bracket predicts a ${finalist1||"?"} vs ${finalist2||"?"} Final, with ${champion} lifting the trophy! Can you do better? Build your bracket at fifa.rajeevbuilds.dev #WorldCup2026`
      :"Complete your bracket first, then share!";
    setShareMsg(msg);
    if(champion) navigator.clipboard?.writeText(msg).catch(()=>{});
  };

  const Matchup=({roundIdx,matchIdx})=>{
    const m=bracket[roundIdx]?.[matchIdx];
    if(!m||(!m.home&&!m.away)) return <div style={{height:52,border:`1px dashed ${C.line}`,borderRadius:4,margin:"4px 0"}}/>;
    const {winA,winB}=m.home&&m.away?M.matchOutcome(m.home,m.away):{winA:.5,winB:.5};
    const favPct=Math.round(Math.max(winA,winB)*100);
    const fav=winA>winB?m.home:m.away;
    return <div style={{margin:"4px 0",borderRadius:4,border:`1px solid ${m.winner?C.gold:C.line}`,overflow:"hidden"}}>
      {[m.home,m.away].map((team,ti)=>{
        if(!team) return <div key={ti} style={{padding:"6px 8px",background:C.pitch2,borderBottom:ti===0?`1px solid ${C.line}`:"none"}}>
          <span style={{font:`11px ${mono}`,color:C.mute}}>TBD</span>
        </div>;
        const isWinner=m.winner===team;
        const isLoser=m.winner&&m.winner!==team;
        return <div key={ti} onClick={()=>m.home&&m.away&&pickWinner(roundIdx,matchIdx,team)}
          style={{padding:"6px 8px",background:isWinner?"rgba(232,184,75,.12)":C.pitch2,
            borderBottom:ti===0?`1px solid ${C.line}`:"none",
            cursor:m.home&&m.away?"pointer":"default",
            opacity:isLoser?.45:1,transition:"all .15s",
            display:"flex",alignItems:"center",justifyContent:"space-between",gap:6}}>
          <span style={{font:`600 12px ${display}`,color:isWinner?C.gold:C.chalk,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",flex:1}}>{team}</span>
          {team===fav&&m.home&&m.away&&!m.winner&&<span style={{font:`9px ${mono}`,color:C.gold,flexShrink:0}}>{favPct}%</span>}
          {isWinner&&<span style={{color:C.gold,flexShrink:0,fontSize:10}}>✓</span>}
        </div>;
      })}
    </div>;
  };

  return <div>
    <H2 eyebrow="Interactive — 2026 Bracket" title="Predict the knockout bracket"/>
    <p style={{font:`13px/1.5 ${display}`,color:C.mute,margin:"0 0 16px",maxWidth:600}}>
      Click any player in a match to pick your winner. Use AI Simulate to let the Elo model pick, or simulate all rounds at once. Seeded by pre-tournament Elo ratings.
    </p>
    <div style={{display:"flex",gap:8,marginBottom:20,flexWrap:"wrap"}}>
      <button onClick={simulateAll} style={{font:`600 12px ${mono}`,padding:"9px 16px",cursor:"pointer",borderRadius:4,border:`1px solid ${C.gold}`,background:C.gold,color:C.pitch}}>Simulate All (AI)</button>
      <button onClick={reset} style={{font:`600 12px ${mono}`,padding:"9px 16px",cursor:"pointer",borderRadius:4,border:`1px solid ${C.line}`,background:"transparent",color:C.mute}}>Reset</button>
      <button onClick={genShare} style={{font:`600 12px ${mono}`,padding:"9px 16px",cursor:"pointer",borderRadius:4,border:`1px solid ${C.grass}`,background:"transparent",color:C.grass}}>Share my bracket</button>
    </div>

    {shareMsg&&<div style={{padding:"12px 16px",borderRadius:4,background:"rgba(63,174,111,.08)",border:`1px solid ${C.grass}`,marginBottom:16,font:`12px/1.5 ${display}`,color:C.chalk}}>
      <div style={{font:`600 10px ${mono}`,color:C.grass,marginBottom:4}}>COPIED TO CLIPBOARD</div>
      {shareMsg}
    </div>}

    {champion&&<div style={{padding:"14px 16px",borderRadius:4,background:"rgba(232,184,75,.1)",border:`1px solid ${C.gold}`,marginBottom:16,display:"flex",alignItems:"center",gap:12}}>
      <span style={{fontSize:28}}>🏆</span>
      <div><div style={{font:`700 11px ${mono}`,color:C.gold,letterSpacing:".1em"}}>YOUR PREDICTED CHAMPION</div>
      <div style={{font:`800 22px ${display}`,color:C.chalk}}>{champion}</div></div>
    </div>}

    {/* Bracket grid — horizontal scroll on mobile */}
    <div style={{overflowX:"auto",paddingBottom:8}}>
      <div style={{display:"flex",gap:12,minWidth:800,alignItems:"flex-start"}}>
        {ROUNDS.map((label,ri)=>(
          <div key={ri} style={{flex:1,minWidth:ri===0?140:120}}>
            <div style={{font:`600 10px ${mono}`,color:C.gold,letterSpacing:".1em",marginBottom:8,textAlign:"center"}}>{label}</div>
            <div style={{display:"flex",flexDirection:"column",justifyContent:"space-around",gap:ri===0?2:ri===1?8:ri===2?20:ri===3?52:0}}>
              {Array.from({length:Math.pow(2,3-ri)}).map((_,mi)=>(
                <Matchup key={mi} roundIdx={ri} matchIdx={mi}/>
              ))}
            </div>
          </div>
        ))}
      </div>
    </div>
    <div style={{font:`11px ${mono}`,color:C.mute,marginTop:16}}>
      Click any team name to pick them as the winner. AI Simulate uses Elo win probabilities to auto-pick each match.
    </div>
  </div>;
}

/* ===================== LIVE MOMENTUM CHART ===================== */
function LiveMomentum({matchId,homeTeam,awayTeam}){
  const [events,setEvents]=useState(null);
  useEffect(()=>{
    if(!matchId) return;
    fetch("/api/match?id="+matchId).then(r=>r.json()).then(d=>{
      if(!d.error) setEvents(d.events||[]);
    }).catch(()=>{});
  },[matchId]);
  if(!events||events.length===0) return null;

  // Build momentum timeline: each goal/card/sub gets a momentum value
  // +15 goal for scoring team, -8 red card, +3 substitution (tactical)
  const timeline=[];
  let homeM=50, awayM=50;
  // Generate minute-by-minute from events
  const eventsByMin={};
  events.forEach(e=>{
    const min=e.minute||0;
    if(!eventsByMin[min]) eventsByMin[min]=[];
    eventsByMin[min].push(e);
  });
  const maxMin=Math.max(90,...Object.keys(eventsByMin).map(Number));
  for(let min=0;min<=maxMin;min+=5){
    const evts=Object.entries(eventsByMin)
      .filter(([m])=>Number(m)>=min&&Number(m)<min+5)
      .flatMap(([,e])=>e);
    evts.forEach(e=>{
      const isHome=e.team===homeTeam;
      if(e.type==="GOAL"){ if(isHome){homeM=Math.min(95,homeM+18);}else{awayM=Math.min(95,awayM+18);homeM=Math.max(5,homeM-10);} }
      if(e.type==="RED"){ if(isHome){homeM=Math.max(5,homeM-15);}else{awayM=Math.max(5,awayM-15);} }
    });
    // Natural drift back to 50 over time
    homeM=Math.round(homeM*.92+50*.08);
    awayM=Math.round(awayM*.92+50*.08);
    timeline.push({min,home:homeM,away:awayM});
  }

  const W=340,H=100,PAD=20;
  const xScale=(min)=>PAD+(min/maxMin)*(W-PAD*2);
  const yScale=(v)=>H-PAD-(v/100)*(H-PAD*2);
  const pathHome=timeline.map((p,i)=>`${i===0?"M":"L"}${xScale(p.min)},${yScale(p.home)}`).join(" ");
  const pathAway=timeline.map((p,i)=>`${i===0?"M":"L"}${xScale(p.min)},${yScale(p.away)}`).join(" ");

  return <div style={{marginTop:16,paddingTop:14,borderTop:`1px solid ${C.line}`}}>
    <div style={{font:`600 10px ${mono}`,color:C.mute,letterSpacing:".1em",marginBottom:8}}>MATCH MOMENTUM</div>
    <div style={{display:"flex",gap:12,marginBottom:6,font:`10px ${mono}`}}>
      <span style={{color:C.gold}}>— {homeTeam}</span>
      <span style={{color:C.red}}>— {awayTeam}</span>
    </div>
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:H,display:"block"}}>
      {/* Centre line */}
      <line x1={PAD} y1={yScale(50)} x2={W-PAD} y2={yScale(50)} stroke={C.line} strokeWidth="1" strokeDasharray="3,3"/>
      {/* Goal event markers */}
      {events.filter(e=>e.type==="GOAL").map((e,i)=>(
        <line key={i} x1={xScale(e.minute||0)} y1={PAD} x2={xScale(e.minute||0)} y2={H-PAD}
          stroke={e.team===homeTeam?C.gold:C.red} strokeWidth="1" strokeDasharray="2,2" opacity=".6"/>
      ))}
      {/* Momentum lines */}
      <path d={pathHome} fill="none" stroke={C.gold} strokeWidth="2" strokeLinejoin="round"/>
      <path d={pathAway} fill="none" stroke={C.red} strokeWidth="2" strokeLinejoin="round"/>
    </svg>
    <div style={{display:"flex",justifyContent:"space-between",font:`9px ${mono}`,color:C.mute,marginTop:2}}>
      <span>0'</span><span>45'</span><span>{maxMin}'</span>
    </div>
    <div style={{font:`10px ${mono}`,color:C.mute,marginTop:6}}>
      Momentum proxy from goal/card events — not possession data
    </div>
  </div>;
}

/* ===================== PLAYER STOCK MARKET ===================== */
function PlayerStockMarket(){
  const [data,setData]=useState(null);
  const [err,setErr]=useState(null);
  const [sortBy,setSortBy]=useState("stock");
  useEffect(()=>{ fetch("/api/scorers").then(r=>r.json()).then(setData).catch(e=>setErr(e.message)); },[]);

  // Stock price formula: goals weighted by stage + assists
  // Group goal=10pts, KO goal=18pts, assist=5pts, penalty=3pts
  // Previous session stock = stock - (goals from last match * 10)
  // Change % = (current - prev) / prev * 100
  const calcStock=(s)=>{
    const goals=s.goals||0, assists=s.assists||0, pens=s.penalties||0;
    // Rough stage weight — if tournament is in KO phase, weight higher
    const stageMultiplier=goals>2?1.4:1.0; // assume top scorers have KO goals
    const stock=Math.round((goals*10*stageMultiplier)+(assists*5)+(pens*3)+50);
    // Simulate prev session (one goal ago)
    const prevStock=goals>0?Math.round(((goals-1)*10*stageMultiplier)+(assists*5)+(pens*3)+50):stock;
    const change=prevStock>0?Math.round((stock-prevStock)/prevStock*100):0;
    return {stock,change,prevStock};
  };

  const rows=(data?.scorers||[])
    .filter(s=>(s.goals||0)+(s.assists||0)>0)
    .map(s=>({...s,...calcStock(s)}))
    .sort((a,b)=>sortBy==="stock"?b.stock-a.stock:Math.abs(b.change)-Math.abs(a.change))
    .slice(0,12);

  const maxStock=rows[0]?.stock||100;

  return <div>
    <H2 eyebrow="Player Trading Floor" title="Golden Boot Stock Market"/>
    <p style={{font:`13px/1.5 ${display}`,color:C.mute,margin:"0 0 16px",maxWidth:560}}>
      Tournament Impact Stock — a synthetic engagement metric priced from goals, assists and stage weighting.
      <Info text="Stock price = (goals × 10 × stage multiplier) + (assists × 5) + (penalties × 3) + base 50. Stage multiplier rises as tournament progresses. % change reflects gain since previous match. This is a model-generated metric for engagement — not sourced from FIFA, Opta or any official provider."/>
      {" "}<span style={{font:`11px ${mono}`,color:C.red,border:`1px solid ${C.red}`,borderRadius:3,padding:"1px 5px"}}>MODEL ONLY</span>
    </p>
    <div style={{padding:"8px 12px",borderRadius:4,background:"rgba(217,84,63,.06)",border:`1px solid rgba(217,84,63,.2)`,marginBottom:16,font:`11px/1.5 ${mono}`,color:C.mute}}>
      Data source: live scorer feed (goals/assists) + synthetic weighting formula. For real shot accuracy, xG and advanced metrics, official providers include{" "}
      <a href="https://statsbomb.com/what-we-do/data/" target="_blank" rel="noopener noreferrer" style={{color:C.gold,textDecoration:"none"}}>StatsBomb</a>,{" "}
      <a href="https://www.statsperform.com/opta/" target="_blank" rel="noopener noreferrer" style={{color:C.gold,textDecoration:"none"}}>Opta</a>, and{" "}
      <a href="https://developer.sportradar.com/" target="_blank" rel="noopener noreferrer" style={{color:C.gold,textDecoration:"none"}}>SportsRadar</a>.
    </div>
    <div style={{display:"flex",gap:8,marginBottom:16}}>
      {[["stock","By Stock Price"],["change","By Movement"]].map(([k,l])=>(
        <button key={k} onClick={()=>setSortBy(k)} style={{font:`600 11px ${mono}`,padding:"7px 14px",cursor:"pointer",borderRadius:3,border:"none",background:sortBy===k?C.gold:"transparent",outline:sortBy===k?"none":`1px solid ${C.line}`,color:sortBy===k?C.pitch:"#a0b8ac"}}>{l}</button>
      ))}
    </div>
    {err&&<Panel style={{borderColor:"rgba(217,84,63,.35)"}}><span style={{color:C.red,fontFamily:mono}}>{err}</span></Panel>}
    {!data&&!err&&<Panel><MatchSkeleton/><MatchSkeleton/><MatchSkeleton/></Panel>}
    {rows.length>0&&<Panel>
      {/* Column headers */}
      <div style={{display:"grid",gridTemplateColumns:"24px 1fr 80px 56px 60px",gap:8,padding:"0 0 8px",borderBottom:`1px solid ${C.line}`,font:`500 9px ${mono}`,color:C.mute,letterSpacing:".1em"}}>
        <span/><span>PLAYER</span><span style={{textAlign:"right"}}>STOCK</span><span style={{textAlign:"right"}}>CHANGE</span><span style={{textAlign:"right"}}>GOALS</span>
      </div>
      {rows.map((s,i)=>{
        const up=s.change>0, flat=s.change===0;
        const changeColor=up?C.grass:flat?C.mute:C.red;
        return <div key={i} style={{display:"grid",gridTemplateColumns:"24px 1fr 80px 56px 60px",gap:8,padding:"10px 0",borderBottom:`1px solid ${C.line}`,alignItems:"center"}}>
          <span style={{font:`700 12px ${mono}`,color:i===0?C.gold:C.mute}}>{i+1}</span>
          <div style={{display:"flex",alignItems:"center",gap:8,minWidth:0}}>
            <Avatar name={s.player} team={s.team} size={30}/>
            <div style={{minWidth:0}}>
              <div style={{font:`600 13px ${display}`,color:C.chalk,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{s.player}</div>
              <div style={{font:`10px ${mono}`,color:C.mute}}>{s.team}</div>
            </div>
          </div>
          {/* Stock bar */}
          <div style={{textAlign:"right"}}>
            <div style={{font:`700 15px ${display}`,color:i===0?C.gold:C.chalk,marginBottom:3}}>{s.stock}</div>
            <div style={{height:3,background:C.pitch2,borderRadius:2,overflow:"hidden"}}>
              <div style={{width:(s.stock/maxStock*100)+"%",height:"100%",background:i===0?C.gold:C.grass,borderRadius:2}}/>
            </div>
          </div>
          {/* Change */}
          <div style={{textAlign:"right",font:`700 12px ${mono}`,color:changeColor}}>
            {up?"▲":flat?"—":"▼"} {Math.abs(s.change)}%
          </div>
          {/* Goals */}
          <div style={{textAlign:"right",font:`700 16px ${display}`,color:C.gold}}>{s.goals||0}</div>
        </div>;
      })}
      <div style={{font:`11px ${mono}`,color:C.mute,marginTop:12,paddingTop:10,borderTop:`1px solid ${C.line}`}}>
        Model estimates only — not official FIFA data. Refreshes with the scorer feed.
      </div>
    </Panel>}
  </div>;
}

          <div style={{padding:"12px 14px",borderRadius:5,background:correct?"rgba(63,174,111,.08)":"rgba(217,84,63,.08)",
            border:`1px solid ${correct?C.grass:C.red}`,marginBottom:12}}>
            <div style={{font:`700 14px ${display}`,color:correct?C.grass:C.red,marginBottom:6}}>{correct?"🎉 Correct!":"Not quite — "+q.a}</div>
            <div style={{font:`12px/1.5 ${display}`,color:C.mute}}>{q.fact}</div>
          </div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={share} style={{flex:1,font:`600 12px ${mono}`,padding:"9px",cursor:"pointer",borderRadius:4,border:`1px solid ${C.gold}`,background:"transparent",color:C.gold}}>
              {copied?"✓ Copied!":"📋 Copy & Share"}
            </button>
            <button onClick={onClose} style={{font:`600 12px ${mono}`,padding:"9px 16px",cursor:"pointer",borderRadius:4,border:`1px solid ${C.line}`,background:"transparent",color:C.mute}}>Close</button>
          </div>
        </div>}
      </div>
    </div>
  );
}

function FooterVisits(){
  const [v,setV]=useState(null);
  useEffect(()=>{ fetch("/api/visit").then(r=>r.json()).then(setV).catch(()=>{}); },[]);
  if(!v||(!v.total&&!v.today)) return null;
  return (
    <div style={{marginTop:10,paddingTop:10,borderTop:`1px solid ${C.line}`,font:`11px ${mono}`,color:C.mute,display:"flex",alignItems:"center",justifyContent:"center",gap:16,flexWrap:"wrap"}}>
      <span>👁 <b style={{color:C.chalk}}>{(v.total||0).toLocaleString()}</b> total visits</span>
      <span style={{color:C.line}}>·</span>
      <span><b style={{color:C.chalk}}>{(v.today||0).toLocaleString()}</b> today</span>
    </div>
  );
}

const NAV_GROUPS=[
  {label:"LIVE",  icon:"●", tabs:["Live","News","Results","Standings","Scorer Race"]},
  {label:"INTEL", icon:"◈", tabs:["Search","Vs Mode","Teams","Scores","Coaches","Coach Ranking","Upsets","Stories","Knowledge Graph","Nation Evolution"]},
  {label:"PREDICT",icon:"◎",tabs:["Qual Odds","Path to Final","Bracket","Team Predictor","Golden Boot","Stock Market"]},
  {label:"MORE",  icon:"⊞", tabs:["Trivia","History","Alerts"]},
];

function App(){
  const [tab,setTab]=useState(0);
  const [matchId,setMatchId]=useState(null);
  const [teamId,setTeamId]=useState(null);
  const [showTrivia,setShowTrivia]=useState(false);

  // Theme — persisted in localStorage
  const [theme,setTheme]=useState(()=>{
    try { return localStorage.getItem("wc-theme")||"dark"; } catch { return "dark"; }
  });
  _theme=theme; // update the C proxy
  const toggleTheme=()=>{
    const next=theme==="dark"?"light":"dark";
    setTheme(next);
    try { localStorage.setItem("wc-theme",next); } catch {}
  };
  // Apply bg colour to body so no white flash outside the app div
  useEffect(()=>{ document.body.style.background=THEMES[theme].bg; },[theme]);

  // Fire a visit count ping once when the app loads — no personal data stored
  useEffect(()=>{ fetch("/api/visit",{method:"POST"}).catch(()=>{}); },[]);

  const go=(i)=>{ setTab(i); window.scrollTo({top:0,behavior:"smooth"}); };
  const navigate=(label)=>{ const i=NAV.findIndex(([l])=>l===label); if(i>=0) go(i); };

  const activeLabel=NAV[tab]?.[0]||"Home";
  const activeSection=NAV_GROUPS.findIndex(g=>g.tabs.includes(activeLabel));
  const subTabs=activeSection>=0?NAV_GROUPS[activeSection].tabs:[];
  const Active=tab===0?null:NAV[tab]?.[1]||null;

  const isLight=theme==="light";

  return (<ThemeCtx.Provider value={theme}><div style={{minHeight:"100vh",background:C.bg,color:C.chalk,transition:"background .2s,color .2s"}}>
    <MatchModal id={matchId} onClose={()=>setMatchId(null)}/>
    <SquadModal id={teamId} onClose={()=>setTeamId(null)}/>
    {showTrivia&&<TriviaModal onClose={()=>setShowTrivia(false)}/>}

    {/* HEADER */}
    <header style={{borderBottom:`1px solid ${C.line}`,padding:"14px 24px",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:10,background:C.navBg}}>
      <div style={{display:"flex",alignItems:"center",gap:12,cursor:"pointer"}} onClick={()=>go(0)}>
        <div style={{width:30,height:30,borderRadius:"50%",background:`radial-gradient(circle at 35% 30%, ${C.gold}, ${C.goldDim})`,boxShadow:`0 0 0 2px ${C.navBg}, 0 0 0 3px ${C.goldDim}`,flexShrink:0}}></div>
        <div>
          <div style={{font:`900 16px/1 ${display}`,letterSpacing:"-.01em",color:C.chalk}}>WORLD CUP INTELLIGENCE HUB</div>
          <div style={{font:`500 9px/1 ${mono}`,letterSpacing:".18em",color:C.mute,marginTop:4}}>LIVE · 2026 · USA · CANADA · MEXICO</div>
        </div>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:14}}>
        {/* Theme toggle */}
        <button onClick={toggleTheme} title={isLight?"Switch to dark mode":"Switch to light mode"}
          style={{background:"none",border:`1px solid ${C.line}`,borderRadius:20,padding:"5px 12px",cursor:"pointer",
            font:`600 11px ${mono}`,color:C.mute,display:"flex",alignItems:"center",gap:6,transition:"border-color .15s"}}>
          <span style={{fontSize:14}}>{isLight?"🌙":"☀️"}</span>
          <span>{isLight?"Dark":"Light"}</span>
        </button>
        <div style={{font:`600 11px ${mono}`,color:C.red,display:"flex",alignItems:"center",gap:6}}><span className="pulse"></span>LIVE</div>
      </div>
    </header>

    {/* NAV */}
    <div style={{background:C.navBg,borderBottom:`1px solid ${C.line}`,position:"sticky",top:0,zIndex:20}}>
      {/* Row 1 — section labels */}
      <div style={{display:"flex",padding:"0 16px",gap:2,borderBottom:`1px solid ${C.line}`,overflowX:"auto"}}>
        <button onClick={()=>go(0)}
          style={{font:`700 11px ${mono}`,padding:"10px 14px",cursor:"pointer",background:"none",border:"none",
            color:tab===0?C.gold:"#a0b8ac",borderBottom:`2px solid ${tab===0?C.gold:"transparent"}`,
            whiteSpace:"nowrap",flexShrink:0,letterSpacing:".06em"}}>
          HOME
        </button>
        {NAV_GROUPS.map((g,gi)=>{
          const isActive=activeSection===gi;
          const firstTabIdx=NAV.findIndex(([l])=>l===g.tabs[0]);
          return <button key={g.label} onClick={()=>go(firstTabIdx)}
            style={{font:`700 11px ${mono}`,padding:"10px 14px",cursor:"pointer",background:"none",border:"none",
              color:isActive?C.gold:"#a0b8ac",borderBottom:`2px solid ${isActive?C.gold:"transparent"}`,
              whiteSpace:"nowrap",flexShrink:0,letterSpacing:".06em",display:"flex",alignItems:"center",gap:5}}>
            <span style={{fontSize:8,...(g.label==="LIVE"?{animation:"p 1.4s infinite",color:C.red}:{})}}>{g.icon}</span>{g.label}
          </button>;
        })}
      </div>
      {/* Row 2 — sub-tabs. Always visible when inside a section. */}
      {subTabs.length>0&&<div style={{display:"flex",padding:"0 16px",overflowX:"auto",gap:0}}>
        {subTabs.map(label=>{
          const i=NAV.findIndex(([l])=>l===label);
          const active=tab===i;
          return <button key={label} onClick={()=>go(i)}
            style={{font:`500 12px ${display}`,padding:"9px 14px",cursor:"pointer",background:"none",border:"none",
              color:active?C.chalk:"#a0b8ac",borderBottom:`2px solid ${active?C.gold:"transparent"}`,
              whiteSpace:"nowrap",flexShrink:0}}>
            {label}
          </button>;
        })}
      </div>}
    </div>

    <main style={{maxWidth:1040,margin:"0 auto",padding:"28px 24px 80px"}}>
      {tab===0 ? <Homepage onNavigate={navigate} onTrivia={()=>setShowTrivia(true)} onOpenMatch={setMatchId}/> : Active ? <Active onOpenMatch={setMatchId} onOpenTeam={setTeamId}/> : null}
    </main>
    <footer style={{borderTop:`1px solid ${C.line}`,padding:"20px 28px",font:`12px/1.6 ${mono}`,color:C.mute,textAlign:"center",background:C.navBg}}>
      <div style={{color:C.gold,letterSpacing:".06em"}}>★ A hobby project — built for fun, not affiliated with FIFA.</div>
      <div style={{marginTop:6}}>Live data via football-data.org · Historical 1930–2022 · Predictions are Elo-model estimates, not statements of fact.</div>
      <div style={{marginTop:6}}>Made by Rajeev · rajeevbuilds.dev · <a href="mailto:raj.ranjan.sinha@gmail.com" style={{color:C.gold,textDecoration:"none"}}>raj.ranjan.sinha@gmail.com</a></div>
      <FooterVisits/>
    </footer>
  </div></ThemeCtx.Provider>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
