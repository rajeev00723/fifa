<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>World Cup Intelligence Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --pitch:#0a1f1a; --pitch2:#0f2a22; --panel:#10241d; --line:#1d3b31;
    --gold:#e8b84b; --gold-dim:#9a7c33; --chalk:#eef3ee; --mute:#7e9a8c; --grass:#3fae6f; --red:#d9543f;
    --mono:'JetBrains Mono',ui-monospace,monospace; --display:'Archivo','Arial Narrow',sans-serif;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--pitch); color:var(--chalk); font-family:var(--display); }
  button:focus-visible, select:focus-visible { outline:2px solid var(--gold); outline-offset:2px; }
  select option { background:var(--pitch2); }
  @media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important;} }
  .pulse { width:8px;height:8px;border-radius:50%;background:var(--red);display:inline-block;animation:p 1.4s infinite; }
  @keyframes p { 0%,100%{opacity:1;} 50%{opacity:.3;} }
  ::-webkit-scrollbar{height:8px;width:8px;} ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
  .est { font:600 9px var(--mono); letter-spacing:.1em; color:var(--pitch); background:var(--gold); padding:2px 6px; border-radius:3px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.12.7/Recharts.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
<script src="/model.js"></script>
<script type="text/babel" data-presets="env,react">
const { useState, useEffect, useRef } = React;
const { ResponsiveContainer, BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend,
        LineChart, Line, RadarChart, PolarGrid, PolarAngleAxis, PolarRadiusAxis, Radar,
        AreaChart, Area } = Recharts;
const M = window.WCModel, H = window.WCHistory;

const C = { pitch:"#0a1f1a", pitch2:"#0f2a22", panel:"#10241d", line:"#1d3b31",
  gold:"#e8b84b", goldDim:"#9a7c33", chalk:"#eef3ee", mute:"#7e9a8c", grass:"#3fae6f", red:"#d9543f" };
const mono="'JetBrains Mono',ui-monospace,monospace";
const display="'Archivo','Arial Narrow',sans-serif";
const REFRESH_MS = 60000;

const Eyebrow = ({children}) => <div style={{font:`600 11px/1 ${mono}`,letterSpacing:".22em",textTransform:"uppercase",color:C.gold}}>{children}</div>;
const Panel = ({children,style}) => <div style={{background:C.panel,border:`1px solid ${C.line}`,borderRadius:4,padding:20,...style}}>{children}</div>;
const Stat = ({label,value,accent}) => (
  <div style={{borderLeft:`2px solid ${accent||C.line}`,paddingLeft:12}}>
    <div style={{font:`700 24px/1 ${display}`,color:C.chalk}}>{value}</div>
    <div style={{font:`500 10px/1.3 ${mono}`,letterSpacing:".12em",textTransform:"uppercase",color:C.mute,marginTop:6}}>{label}</div>
  </div>
);
const H2 = ({eyebrow,title,right}) => (
  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end",flexWrap:"wrap",gap:10,marginBottom:22}}>
    <div><Eyebrow>{eyebrow}</Eyebrow><h2 style={{font:`800 30px/1 ${display}`,margin:"10px 0 0"}}>{title}</h2></div>
    {right}
  </div>
);
const Empty = ({children}) => <div style={{font:`13px ${display}`,color:C.mute,padding:"10px 0"}}>{children}</div>;
const Select = ({label,value,onChange,options}) => (
  <label style={{flex:1,minWidth:140}}>
    <div style={{font:`600 10px ${mono}`,letterSpacing:".14em",color:C.mute,marginBottom:6,textTransform:"uppercase"}}>{label}</div>
    <select value={value} onChange={e=>onChange(e.target.value)} style={{width:"100%",font:`600 14px ${display}`,padding:"10px 12px",color:C.chalk,background:C.pitch2,border:`1px solid ${C.line}`,borderRadius:3}}>
      {options.map(o=><option key={o} value={o}>{o}</option>)}
    </select>
  </label>
);
const tip = {contentStyle:{background:C.pitch,border:`1px solid ${C.line}`,fontFamily:mono,fontSize:12,color:C.chalk},cursor:{fill:"rgba(255,255,255,.03)"}};

/* ===================== LIVE ===================== */
function Live() {
  const [data,setData]=useState(null); const [err,setErr]=useState(null);
  const [secs,setSecs]=useState(REFRESH_MS/1000); const timer=useRef(null);
  async function load(){ try{ const r=await fetch("/api/live"); if(!r.ok)throw new Error("Feed "+r.status); setData(await r.json()); setErr(null);}catch(e){setErr(e.message);} setSecs(REFRESH_MS/1000); }
  useEffect(()=>{ load(); timer.current=setInterval(load,REFRESH_MS); const t=setInterval(()=>setSecs(s=>s>0?s-1:0),1000); return()=>{clearInterval(timer.current);clearInterval(t);}; },[]);
  const Row=({m})=>(
    <div style={{display:"flex",alignItems:"center",gap:12,padding:"14px 0",borderBottom:`1px solid ${C.line}`}}>
      <div style={{flex:1,textAlign:"right",font:`600 15px ${display}`}}>{m.home.name}</div>
      <div style={{display:"flex",gap:6,alignItems:"center",minWidth:90,justifyContent:"center"}}>
        <span style={{font:`800 20px ${display}`,color:C.gold}}>{m.home.score??"–"}</span><span style={{color:C.mute}}>:</span><span style={{font:`800 20px ${display}`,color:C.gold}}>{m.away.score??"–"}</span>
      </div>
      <div style={{flex:1,font:`600 15px ${display}`}}>{m.away.name}</div>
      <div style={{width:70,textAlign:"right",font:`600 11px ${mono}`,color:m.status==="LIVE"?C.red:C.mute}}>{m.status==="LIVE"?(m.minute?m.minute+"'":"LIVE"):m.status==="FINISHED"?"FT":new Date(m.utcKickoff).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}</div>
    </div>
  );
  return (<div>
    <H2 eyebrow="Live Feed — 2026 FIFA World Cup" title="Today's matches" right={
      <div style={{font:`600 11px ${mono}`,color:C.mute,textAlign:"right"}}><div><span className="pulse"></span> &nbsp;AUTO-REFRESH</div><div style={{marginTop:6}}>next pull in {secs}s</div></div>}/>
    {err && <Panel style={{borderColor:C.red}}><div style={{font:`600 13px ${mono}`,color:C.red}}>Feed unavailable</div><div style={{font:`13px/1.5 ${display}`,color:C.mute,marginTop:8}}>{err}. Check FOOTBALL_DATA_API_KEY in Vercel. Retrying automatically.</div></Panel>}
    {!data && !err && <div style={{padding:40,textAlign:"center",color:C.mute,fontFamily:mono}}>Loading feed…</div>}
    {data && <div>
      {data.live.length>0 && <Panel style={{marginBottom:16,borderColor:C.red}}><div style={{font:`700 11px ${mono}`,letterSpacing:".14em",color:C.red,marginBottom:6}}>● IN PLAY</div>{data.live.map(m=><Row key={m.id} m={m}/>)}</Panel>}
      <Panel style={{marginBottom:16}}><div style={{font:`700 11px ${mono}`,letterSpacing:".14em",color:C.gold,marginBottom:6}}>FINISHED TODAY</div>{data.finishedToday.length?data.finishedToday.map(m=><Row key={m.id} m={m}/>):<Empty>No matches finished yet today.</Empty>}</Panel>
      <Panel><div style={{font:`700 11px ${mono}`,letterSpacing:".14em",color:C.mute,marginBottom:6}}>UPCOMING TODAY</div>{data.upcomingToday.length?data.upcomingToday.map(m=><Row key={m.id} m={m}/>):<Empty>Nothing else scheduled today.</Empty>}</Panel>
      <div style={{font:`11px ${mono}`,color:C.mute,textAlign:"center",marginTop:16}}>Feed updated {new Date(data.updatedAt).toLocaleTimeString()} · served from cache</div>
    </div>}
  </div>);
}

/* ===================== SCORER RACE (live) ===================== */
function ScorerRace(){
  const [data,setData]=useState(null); const [err,setErr]=useState(null);
  useEffect(()=>{ fetch("/api/scorers").then(r=>r.json()).then(setData).catch(e=>setErr(e.message)); },[]);
  const rows=(data?.scorers||[]).slice(0,12).map(s=>({name:s.player,goals:s.goals,team:s.team}));
  return (<div>
    <H2 eyebrow="Live — Golden Boot Race" title="Top scorers, this tournament"/>
    {err && <Panel style={{borderColor:C.red}}><span style={{color:C.red,fontFamily:mono}}>Scorers unavailable — {err}</span></Panel>}
    {!data && !err && <div style={{padding:30,color:C.mute,fontFamily:mono}}>Loading…</div>}
    {data && rows.length===0 && <Empty>No goals recorded yet — check back once matches are underway.</Empty>}
    {rows.length>0 && <Panel>
      <ResponsiveContainer width="100%" height={Math.max(260,rows.length*34)}>
        <BarChart data={rows} layout="vertical" margin={{left:30,right:30,top:0,bottom:0}}>
          <CartesianGrid stroke={C.line} horizontal={false}/>
          <XAxis type="number" tick={{fill:C.mute,fontSize:11,fontFamily:mono}} allowDecimals={false}/>
          <YAxis type="category" dataKey="name" width={130} tick={{fill:C.chalk,fontSize:12,fontFamily:display}}/>
          <Tooltip {...tip} formatter={(v,n,p)=>[v+" goals — "+p.payload.team,"Goals"]}/>
          <Bar dataKey="goals" fill={C.gold} radius={[0,3,3,0]} label={{position:"right",fill:C.chalk,fontFamily:mono,fontSize:11}}/>
        </BarChart>
      </ResponsiveContainer>
      <div style={{font:`11px ${mono}`,color:C.mute,marginTop:10}}>Live from your feed, cached server-side. Updates as goals go in.</div>
    </Panel>}
  </div>);
}

/* ===================== QUALIFICATION ODDS (live standings + model) ===================== */
function QualOdds(){
  const [data,setData]=useState(null); const [err,setErr]=useState(null);
  useEffect(()=>{ fetch("/api/standings").then(r=>r.json()).then(setData).catch(e=>setErr(e.message)); },[]);
  // Simple, transparent: blend current points with Elo strength to estimate
  // probability of finishing top 2 in the group.
  function odds(group){
    const teams=group.table.map(r=>({team:r.team,pts:r.points,played:r.played,elo:M.rating(r.team)}));
    const scored=teams.map(t=>({...t, score: t.pts*1.0 + (t.elo-1750)/100 + (3-t.played)*0.1}));
    const exps=scored.map(t=>Math.exp(t.score/1.5));
    const sum=exps.reduce((a,b)=>a+b,0);
    // approximate P(top2) by softmax mass of the two best slots
    return scored.map((t,i)=>({team:t.team, p: Math.min(0.99, (exps[i]/sum)*2 )})).sort((a,b)=>b.p-a.p);
  }
  return (<div>
    <H2 eyebrow="Live — Qualification Model" title="Who advances?" right={<span className="est">MODEL ESTIMATE</span>}/>
    <p style={{font:`13px/1.5 ${display}`,color:C.mute,margin:"0 0 18px",maxWidth:560}}>Probability of finishing top-2 and reaching the knockouts. Blends current points (real) with team strength and games remaining. An estimate, not a guarantee.</p>
    {err && <Panel style={{borderColor:C.red}}><span style={{color:C.red,fontFamily:mono}}>Standings unavailable — {err}</span></Panel>}
    {!data && !err && <div style={{padding:30,color:C.mute,fontFamily:mono}}>Loading…</div>}
    {data && data.groups.map(g=>(
      <Panel key={g.group} style={{marginBottom:14}}>
        <div style={{font:`700 13px ${mono}`,color:C.gold,marginBottom:12}}>{g.group}</div>
        {odds(g).map(o=>(
          <div key={o.team} style={{display:"flex",alignItems:"center",gap:12,padding:"7px 0"}}>
            <div style={{width:150,font:`600 14px ${display}`}}>{o.team}</div>
            <div style={{flex:1,height:18,background:C.pitch2,borderRadius:3,overflow:"hidden"}}>
              <div style={{width:(o.p*100)+"%",height:"100%",background:o.p>0.55?C.grass:o.p>0.3?C.gold:C.goldDim}}></div>
            </div>
            <div style={{width:46,textAlign:"right",font:`700 13px ${mono}`,color:C.chalk}}>{(o.p*100).toFixed(0)}%</div>
          </div>
        ))}
      </Panel>
    ))}
  </div>);
}

/* ===================== HISTORY VISUALS ===================== */
function History(){
  const [team,setTeam]=useState("Brazil");
  // title timeline: one dot per edition, coloured if this team won
  const timeline=H.champions.map(c=>({year:c.year, team:c.team, won: c.team===team || (team==="Germany"&&c.team==="West Germany")?1:0}));
  const titleCounts={};
  H.champions.forEach(c=>{ const k=c.team==="West Germany"?"Germany":c.team; titleCounts[k]=(titleCounts[k]||0)+1; });
  const ranked=Object.entries(titleCounts).sort((a,b)=>b[1]-a[1]);
  const radar=Object.keys(H.teams[team]||{}).map(k=>({k, v:H.teams[team][k]}));
  return (<div>
    <H2 eyebrow="Archive — 1930 to 2022" title="Historical patterns" right={
      <Select label="Dynasty team" value={team} onChange={setTeam} options={Object.keys(H.teams)}/>}/>
    <Panel style={{marginBottom:16}}>
      <div style={{font:`600 11px ${mono}`,color:C.mute,marginBottom:12}}>GOALS PER MATCH BY ERA — peaked 1954, settled ~2.6 in the modern game</div>
      <ResponsiveContainer width="100%" height={230}>
        <AreaChart data={H.goalsPerMatch} margin={{top:5,right:10,left:-20,bottom:0}}>
          <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={C.gold} stopOpacity={.5}/><stop offset="100%" stopColor={C.gold} stopOpacity={0}/></linearGradient></defs>
          <CartesianGrid stroke={C.line} vertical={false}/>
          <XAxis dataKey="year" tick={{fill:C.mute,fontSize:10,fontFamily:mono}}/>
          <YAxis domain={[2,6]} tick={{fill:C.mute,fontSize:10,fontFamily:mono}}/>
          <Tooltip {...tip}/>
          <Area type="monotone" dataKey="v" stroke={C.gold} strokeWidth={2} fill="url(#g)"/>
        </AreaChart>
      </ResponsiveContainer>
    </Panel>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
      <Panel>
        <div style={{font:`600 11px ${mono}`,color:C.mute,marginBottom:12}}>{team.toUpperCase()} — TITLE TIMELINE</div>
        <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
          {timeline.map(t=>(
            <div key={t.year} title={t.year+" — "+t.team} style={{width:32,textAlign:"center"}}>
              <div style={{height:32,borderRadius:3,background:t.won?C.gold:C.pitch2,border:`1px solid ${t.won?C.gold:C.line}`,display:"grid",placeItems:"center"}}>
                {t.won?<span style={{font:`800 13px ${display}`,color:C.pitch}}>★</span>:null}
              </div>
              <div style={{font:`500 8px ${mono}`,color:C.mute,marginTop:3}}>{String(t.year).slice(2)}</div>
            </div>
          ))}
        </div>
        <div style={{marginTop:16,paddingTop:14,borderTop:`1px solid ${C.line}`}}>
          <div style={{font:`600 11px ${mono}`,color:C.mute,marginBottom:8}}>MOST TITLES</div>
          {ranked.map(([n,v],i)=>(
            <div key={n} style={{display:"flex",gap:10,padding:"6px 0",borderBottom:`1px solid ${C.line}`}}>
              <span style={{font:`800 13px ${mono}`,color:i===0?C.gold:C.mute,width:20}}>{i+1}</span>
              <span style={{flex:1,font:`600 14px ${display}`}}>{n}</span>
              <span style={{font:`600 12px ${mono}`,color:C.mute}}>{v}</span>
            </div>
          ))}
        </div>
      </Panel>
      <Panel>
        <div style={{font:`600 11px ${mono}`,color:C.mute,marginBottom:4}}>{team.toUpperCase()} — DYNASTY PROFILE</div>
        <ResponsiveContainer width="100%" height={290}>
          <RadarChart data={radar} outerRadius="72%">
            <PolarGrid stroke={C.line}/>
            <PolarAngleAxis dataKey="k" tick={{fill:C.mute,fontSize:11,fontFamily:mono}}/>
            <PolarRadiusAxis domain={[0,100]} tick={false} axisLine={false}/>
            <Radar dataKey="v" stroke={C.gold} fill={C.gold} fillOpacity={.28} strokeWidth={2}/>
          </RadarChart>
        </ResponsiveContainer>
      </Panel>
    </div>
  </div>);
}

/* ===================== TEAM PREDICTOR (bracket win prob) ===================== */
function TeamPredictor(){
  const teams=Object.keys(M.RATINGS);
  const [a,setA]=useState("Argentina"); const [b,setB]=useState("France");
  const o=M.matchOutcome(a,b); const [ga,gb]=M.expectedGoals(a,b);
  // title odds: pick 4 plausible rising opponents by rating tiers for illustration
  const tiers=teams.slice().sort((x,y)=>M.rating(y)-M.rating(x));
  const sampleRoad=[tiers[6],tiers[4],tiers[2],tiers[0]].filter(t=>t!==a);
  const odds=teams.slice().sort((x,y)=>M.rating(y)-M.rating(x)).slice(0,8).map(t=>({
    team:t, p: M.titleOdds(t,[tiers[7],tiers[5],tiers[3],tiers[1]].filter(x=>x!==t))*100
  }));
  const Bar3=()=>(
    <div style={{display:"flex",height:42,borderRadius:4,overflow:"hidden",border:`1px solid ${C.line}`}}>
      <div style={{width:(o.winA*100)+"%",background:C.gold,display:"grid",placeItems:"center",font:`700 13px ${mono}`,color:C.pitch}}>{(o.winA*100).toFixed(0)}%</div>
      <div style={{width:(o.draw*100)+"%",background:C.line,display:"grid",placeItems:"center",font:`700 11px ${mono}`}}>{(o.draw*100).toFixed(0)}%</div>
      <div style={{width:(o.winB*100)+"%",background:C.grass,display:"grid",placeItems:"center",font:`700 13px ${mono}`,color:C.pitch}}>{(o.winB*100).toFixed(0)}%</div>
    </div>
  );
  return (<div>
    <H2 eyebrow="Prediction — Team Model" title="Match & title odds" right={<span className="est">MODEL ESTIMATE</span>}/>
    <p style={{font:`13px/1.5 ${display}`,color:C.mute,margin:"0 0 18px",maxWidth:580}}>Elo win-expectancy: probabilities come from the rating gap, shown below. Swap any two teams. These are model outputs, not predictions of fact.</p>
    <div style={{display:"flex",gap:16,marginBottom:18,flexWrap:"wrap"}}>
      <Select label="Team A" value={a} onChange={setA} options={teams}/>
      <Select label="Team B" value={b} onChange={setB} options={teams}/>
    </div>
    <Panel style={{marginBottom:16}}>
      <div style={{display:"flex",justifyContent:"space-between",font:`700 11px ${mono}`,color:C.mute,marginBottom:8}}>
        <span style={{color:C.gold}}>{a} WIN</span><span>DRAW</span><span style={{color:C.grass}}>{b} WIN</span></div>
      <Bar3/>
      <div style={{display:"flex",justifyContent:"center",gap:30,marginTop:22,alignItems:"center"}}>
        <div style={{textAlign:"center"}}><div style={{font:`800 40px/1 ${display}`,color:C.gold}}>{Math.round(ga)}</div><div style={{font:`11px ${mono}`,color:C.mute,marginTop:4}}>{a}</div></div>
        <div style={{font:`600 16px ${mono}`,color:C.mute}}>xScore</div>
        <div style={{textAlign:"center"}}><div style={{font:`800 40px/1 ${display}`,color:C.grass}}>{Math.round(gb)}</div><div style={{font:`11px ${mono}`,color:C.mute,marginTop:4}}>{b}</div></div>
      </div>
      <div style={{font:`12px ${mono}`,color:C.mute,textAlign:"center",marginTop:18,paddingTop:14,borderTop:`1px solid ${C.line}`}}>Ratings — {a}: {M.rating(a)} · {b}: {M.rating(b)}</div>
    </Panel>
    <Panel>
      <div style={{font:`600 11px ${mono}`,color:C.mute,marginBottom:12}}>TITLE ODDS — TOP CONTENDERS (illustrative knockout road)</div>
      <ResponsiveContainer width="100%" height={300}>
        <BarChart data={odds} margin={{left:-10,right:20,top:0,bottom:0}}>
          <CartesianGrid stroke={C.line} vertical={false}/>
          <XAxis dataKey="team" tick={{fill:C.mute,fontSize:10,fontFamily:mono}} angle={-25} textAnchor="end" height={60}/>
          <YAxis tick={{fill:C.mute,fontSize:10,fontFamily:mono}} unit="%"/>
          <Tooltip {...tip} formatter={v=>[v.toFixed(1)+"%","Title odds"]}/>
          <Bar dataKey="p" fill={C.gold} radius={[3,3,0,0]}/>
        </BarChart>
      </ResponsiveContainer>
    </Panel>
  </div>);
}

/* ===================== PLAYER PREDICTOR (Golden Boot) ===================== */
function PlayerPredictor(){
  const [data,setData]=useState(null); const [err,setErr]=useState(null);
  const [remaining,setRemaining]=useState(4);
  useEffect(()=>{ fetch("/api/scorers").then(r=>r.json()).then(setData).catch(e=>setErr(e.message)); },[]);
  const live=(data?.scorers||[]).slice(0,8);
  const rows=live.map(s=>{
    const proj=M.bootProjection({currentGoals:s.goals,team:s.team,avgOpponent:"Average",remainingGames:remaining});
    return {name:s.player, Banked:proj.banked, Projected:proj.projected, total:proj.total};
  }).sort((a,b)=>b.total-a.total);
  return (<div>
    <H2 eyebrow="Prediction — Golden Boot" title="Final scorer projection" right={<span className="est">MODEL ESTIMATE</span>}/>
    <p style={{font:`13px/1.5 ${display}`,color:C.mute,margin:"0 0 16px",maxWidth:580}}>Each bar splits goals already scored (real, from the feed) from model-projected goals over the remaining games. Drag the slider to change how many games are left.</p>
    <Panel style={{marginBottom:16}}>
      <label style={{font:`600 11px ${mono}`,color:C.mute}}>REMAINING GAMES FOR LEADERS: <span style={{color:C.gold}}>{remaining}</span></label>
      <input type="range" min="0" max="6" value={remaining} onChange={e=>setRemaining(+e.target.value)} style={{width:"100%",marginTop:8,accentColor:C.gold}}/>
    </Panel>
    {err && <Panel style={{borderColor:C.red}}><span style={{color:C.red,fontFamily:mono}}>Scorers unavailable — {err}</span></Panel>}
    {!data && !err && <div style={{padding:30,color:C.mute,fontFamily:mono}}>Loading…</div>}
    {data && rows.length===0 && <Empty>No goals yet — projections appear once players are on the scoresheet.</Empty>}
    {rows.length>0 && <Panel>
      <ResponsiveContainer width="100%" height={Math.max(260,rows.length*42)}>
        <BarChart data={rows} layout="vertical" margin={{left:40,right:40,top:0,bottom:0}}>
          <CartesianGrid stroke={C.line} horizontal={false}/>
          <XAxis type="number" tick={{fill:C.mute,fontSize:11,fontFamily:mono}}/>
          <YAxis type="category" dataKey="name" width={130} tick={{fill:C.chalk,fontSize:12,fontFamily:display}}/>
          <Tooltip {...tip}/>
          <Legend wrapperStyle={{fontFamily:mono,fontSize:11}}/>
          <Bar dataKey="Banked" stackId="a" fill={C.gold} radius={[0,0,0,0]}/>
          <Bar dataKey="Projected" stackId="a" fill={C.goldDim} radius={[0,3,3,0]} label={{position:"right",fill:C.chalk,fontFamily:mono,fontSize:11,formatter:(v)=>""}}/>
        </BarChart>
      </ResponsiveContainer>
      <div style={{font:`11px ${mono}`,color:C.mute,marginTop:10}}>Gold = scored so far · dim = projected remaining. Projection assumes a striker converts a share of expected team goals.</div>
    </Panel>}
  </div>);
}

/* ===================== SHELL ===================== */
const NAV=[["Live",Live],["Scorer Race",ScorerRace],["Qual Odds",QualOdds],["History",History],["Team Predictor",TeamPredictor],["Golden Boot",PlayerPredictor]];
function App(){
  const [tab,setTab]=useState(0); const Active=NAV[tab][1];
  return (<div style={{minHeight:"100vh"}}>
    <header style={{borderBottom:`1px solid ${C.line}`,padding:"22px 28px",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:12}}>
      <div style={{display:"flex",alignItems:"center",gap:14}}>
        <div style={{width:34,height:34,borderRadius:"50%",background:`radial-gradient(circle at 35% 30%, ${C.gold}, ${C.goldDim})`,boxShadow:`0 0 0 2px ${C.pitch}, 0 0 0 3px ${C.goldDim}`}}></div>
        <div><div style={{font:`900 19px/1 ${display}`}}>WORLD CUP INTELLIGENCE HUB</div><div style={{font:`500 10px/1 ${mono}`,letterSpacing:".2em",color:C.mute,marginTop:5}}>LIVE FEED · 2026 · USA·CAN·MEX</div></div>
      </div>
      <div style={{font:`600 11px ${mono}`,color:C.red}}><span className="pulse"></span> &nbsp;LIVE</div>
    </header>
    <nav style={{display:"flex",gap:2,padding:"0 28px",borderBottom:`1px solid ${C.line}`,overflowX:"auto"}}>
      {NAV.map(([label],i)=>(<button key={label} onClick={()=>setTab(i)} style={{font:`700 13px ${display}`,padding:"16px 16px",cursor:"pointer",background:"none",border:"none",color:tab===i?C.chalk:C.mute,borderBottom:`2px solid ${tab===i?C.gold:"transparent"}`,whiteSpace:"nowrap"}}>{label}</button>))}
    </nav>
    <main style={{maxWidth:1000,margin:"0 auto",padding:"34px 28px 80px"}}><Active/></main>
    <footer style={{borderTop:`1px solid ${C.line}`,padding:"20px 28px",font:`12px/1.5 ${mono}`,color:C.mute,textAlign:"center"}}>Live data via football-data.org, cached server-side. Historical 1930–2022. Predictions are transparent Elo-model estimates, not statements of fact.</footer>
  </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
