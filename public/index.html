<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>World Cup Intelligence Hub</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="apple-touch-icon" href="/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --pitch:#0a1f1a; --pitch2:#0f2a22; --panel:#10241d; --line:#1d3b31;
    --gold:#e8b84b; --gold-dim:#9a7c33; --chalk:#eef3ee; --mute:#7e9a8c; --grass:#3fae6f; --red:#d9543f;
    --mono:'JetBrains Mono',ui-monospace,monospace; --display:'Archivo','Arial Narrow',sans-serif;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--pitch); color:var(--chalk); font-family:var(--display); }
  button:focus-visible, select:focus-visible { outline:2px solid var(--gold); outline-offset:2px; }
  select option { background:var(--pitch2); }
  @media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important;} }
  .pulse { width:8px;height:8px;border-radius:50%;background:var(--red);display:inline-block;animation:p 1.4s infinite; }
  @keyframes p { 0%,100%{opacity:1;} 50%{opacity:.3;} }
  ::-webkit-scrollbar{height:8px;width:8px;} ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
  .est { font:600 9px var(--mono); letter-spacing:.1em; color:var(--pitch); background:var(--gold); padding:2px 6px; border-radius:3px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.12.7/Recharts.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
<script src="/model.js"></script>
<script src="/data.js"></script>
<script type="text/babel" data-presets="env,react">
const { useState, useEffect, useRef } = React;
const { ResponsiveContainer, BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend,
        LineChart, Line, RadarChart, PolarGrid, PolarAngleAxis, PolarRadiusAxis, Radar,
        AreaChart, Area } = Recharts;
const M = window.WCModel, H = window.WCHistory;

// ── THEME SYSTEM ─────────────────────────────────────────────────────────────
const THEMES = {
  dark: {
    pitch:"#0a1f1a", pitch2:"#0f2a22", panel:"#10241d", line:"#1d3b31",
    gold:"#e8b84b", goldDim:"#9a7c33", chalk:"#eef3ee", mute:"#7e9a8c",
    grass:"#3fae6f", red:"#d9543f", bg:"#0a1f1a", navBg:"#0a1f1a",
  },
  light: {
    pitch:"#ffffff", pitch2:"#f4f7f5", panel:"#ffffff", line:"#dde8e3",
    gold:"#b8860b", goldDim:"#9a7333", chalk:"#1a2e24", mute:"#5a7a6c",
    grass:"#1e8a4a", red:"#c0392b", bg:"#f4f7f5", navBg:"#ffffff",
  },
};
const ThemeCtx = React.createContext("dark");
// C is a proxy that reads from the current theme — updated on toggle
let _theme = "dark";
const C = new Proxy({}, { get: (_, k) => THEMES[_theme][k] });

const mono="'JetBrains Mono',ui-monospace,monospace";
const display="'Archivo','Arial Narrow',sans-serif";
const REFRESH_MS = 60000;

const Eyebrow = ({children}) => <div style={{font:`600 11px/1 ${mono}`,letterSpacing:".22em",textTransform:"uppercase",color:C.gold}}>{children}</div>;
const Panel = ({children,style}) => <div style={{background:C.panel,border:`1px solid ${C.line}`,borderRadius:4,padding:20,...style}}>{children}</div>;
const Stat = ({label,value,accent}) => (
  <div style={{borderLeft:`2px solid ${accent||C.line}`,paddingLeft:12}}>
    <div style={{font:`700 24px/1 ${display}`,color:C.chalk}}>{value}</div>
    <div style={{font:`500 10px/1.3 ${mono}`,letterSpacing:".12em",textTransform:"uppercase",color:C.mute,marginTop:6,display:"flex",alignItems:"center",gap:4}}>{label}</div>
  </div>
);
const H2 = ({eyebrow,title,right}) => (
  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end",flexWrap:"wrap",gap:10,marginBottom:22}}>
    <div><Eyebrow>{eyebrow}</Eyebrow><h2 style={{font:`800 30px/1 ${display}`,margin:"10px 0 0"}}>{title}</h2></div>
    {right}
  </div>
);
const Empty = ({children}) => <div style={{font:`13px ${display}`,color:C.mute,padding:"10px 0"}}>{children}</div>;
// Team crest thumbnail. Falls back to a neutral dot if the feed has no crest yet.
const Crest = ({src,size=22}) => src
  ? <img src={src} alt="" width={size} height={size} loading="lazy" style={{objectFit:"contain",flexShrink:0,filter:"drop-shadow(0 1px 2px rgba(0,0,0,.4))"}} onError={e=>{e.target.style.visibility="hidden";}}/>
  : <span style={{width:size,height:size,borderRadius:"50%",background:C.pitch2,border:`1px solid ${C.line}`,display:"inline-block",flexShrink:0}}/>;
const Select = ({label,value,onChange,options}) => (
  <label style={{flex:1,minWidth:140}}>
    <div style={{font:`600 10px ${mono}`,letterSpacing:".14em",color:C.mute,marginBottom:6,textTransform:"uppercase"}}>{label}</div>
    <select value={value} onChange={e=>onChange(e.target.value)} style={{width:"100%",font:`600 14px ${display}`,padding:"10px 12px",color:C.chalk,background:C.pitch2,border:`1px solid ${C.line}`,borderRadius:3}}>
      {options.map(o=><option key={o} value={o}>{o}</option>)}
    </select>
  </label>
);
const tip = {contentStyle:{background:C.pitch,border:`1px solid ${C.line}`,fontFamily:mono,fontSize:12,color:C.chalk},cursor:{fill:"rgba(255,255,255,.03)"}};

/**
 * Tooltip — shows an explanation bubble on hover/tap.
 * Works on both desktop (hover) and mobile (tap to toggle).
 * Usage: <Info text="Explanation here" />
 *        <Info label="Elo model" text="Explanation" />
 */
function Info({text, label}){
  const [open,setOpen]=useState(false);
  return (
    <span style={{position:"relative",display:"inline-flex",alignItems:"center",gap:4,verticalAlign:"middle"}}>
      {label&&<span style={{font:`inherit`}}>{label}</span>}
      <button
        onClick={e=>{e.stopPropagation();setOpen(o=>!o);}}
        onMouseEnter={()=>setOpen(true)}
        onMouseLeave={()=>setOpen(false)}
        aria-label="More information"
        style={{background:"none",border:"none",cursor:"pointer",padding:"0 2px",display:"inline-flex",alignItems:"center",lineHeight:1}}>
        <span style={{
          display:"inline-flex",alignItems:"center",justifyContent:"center",
          width:14,height:14,borderRadius:"50%",
          border:`1px solid ${C.mute}`,
          font:`600 9px/1 ${mono}`,color:C.mute,flexShrink:0,
          transition:"border-color 120ms, color 120ms",
        }}>i</span>
      </button>
      {open&&<div role="tooltip" style={{
        position:"absolute",bottom:"calc(100% + 6px)",left:"50%",transform:"translateX(-50%)",
        background:C.pitch2,border:`1px solid ${C.line}`,borderRadius:5,
        padding:"8px 12px",width:220,zIndex:100,
        font:`12px/1.5 ${display}`,color:C.chalk,
        boxShadow:"0 4px 16px rgba(0,0,0,.5)",pointerEvents:"none",
      }}>
        {text}
        {/* little arrow */}
        <span style={{position:"absolute",top:"100%",left:"50%",transform:"translateX(-50%)",
          width:0,height:0,borderLeft:"6px solid transparent",borderRight:"6px solid transparent",
          borderTop:`6px solid ${C.line}`}}/>
      </div>}
    </span>
  );
}

// Shared time/date helpers — always render in the VISITOR'S local timezone.
// Passing no timeZone option to Intl/toLocaleTimeString uses the browser's
// local timezone automatically. We append the short TZ name (e.g. "GMT+8")
// so users know exactly what timezone they're seeing.
const TZ_LABEL = (() => {
  try { return Intl.DateTimeFormat().resolvedOptions().timeZone.replace("_"," "); } catch { return ""; }
})();
function localTime(utcString) {
  if (!utcString) return "—";
  return new Date(utcString).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
}
function localDate(utcString) {
  if (!utcString) return "—";
  return new Date(utcString).toLocaleDateString([], {weekday:"short", day:"numeric", month:"short"});
}
function localDateTime(utcString) {
  if (!utcString) return "—";
  return localDate(utcString) + " · " + localTime(utcString);
}

/* ── MICRO-INTERACTION COMPONENTS ────────────────────────────────────────── */

/** Counts up from 0 to target value on mount — energetic "live app" feel */
function AnimatedNumber({value, suffix="", duration=1200, style={}}){
  const [display,setDisplay]=useState(0);
  useEffect(()=>{
    if(!value) return;
    let start=null;
    const step=(ts)=>{
      if(!start) start=ts;
      const progress=Math.min((ts-start)/duration,1);
      // Ease out: fast at start, slow at end
      const eased=1-Math.pow(1-progress,3);
      setDisplay(Math.round(eased*value));
      if(progress<1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  },[value]);
  return <span style={style}>{display.toLocaleString()}{suffix}</span>;
}

/** Pulsing skeleton placeholder — shown while data is loading */
function Skeleton({width="100%", height=18, radius=4, style={}}){
  return <div style={{width,height,borderRadius:radius,background:`linear-gradient(90deg,${C.line} 25%,${C.pitch2} 50%,${C.line} 75%)`,backgroundSize:"200% 100%",animation:"shimmer 1.4s infinite",...style}}/>;
}
// Inject shimmer keyframe once
if(!document.getElementById("shimmer-style")){
  const s=document.createElement("style");
  s.id="shimmer-style";
  s.textContent=`@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}`;
  document.head.appendChild(s);
}

/** Skeleton card for match rows while live data loads */
function MatchSkeleton(){
  return <div style={{display:"flex",alignItems:"center",gap:12,padding:"14px 0",borderBottom:`1px solid ${C.line}`}}>
    <div style={{flex:1,display:"flex",justifyContent:"flex-end",gap:8}}><Skeleton width={120} height={14}/><Skeleton width={24} height={24} radius={12}/></div>
    <Skeleton width={80} height={20} radius={4}/>
    <div style={{flex:1,display:"flex",gap:8}}><Skeleton width={24} height={24} radius={12}/><Skeleton width={120} height={14}/></div>
  </div>;
}

// Inject high-contrast placeholder styles once — placeholder text must pass WCAG AA
if(!document.getElementById("placeholder-style")){
  const s=document.createElement("style");
  s.id="placeholder-style";
  s.textContent=`
    input::placeholder { color: #b8cfc8 !important; opacity: 1; }
    .search-hero::placeholder { color: #c8dbd5 !important; opacity: 1; }
  `;
  document.head.appendChild(s);
}

/** Typewriter input placeholder — cycles through questions every 4s */
function TypewriterInput({value, onChange, onKeyDown, style={}}){
  const prompts=[
    "Who has the most World Cup goals ever?",
    "Did Morocco make history in 2022?",
    "Which coach won the most tournaments?",
    "What was the biggest upset in 1950?",
    "How many finals has Germany reached?",
    "Who scored the Goal of the Century?",
    "Which team has the best knockout record?",
    "What happened at the 1970 final?",
  ];
  const [ph,setPh]=useState("");
  const [pidx,setPidx]=useState(0);
  const [typing,setTyping]=useState(true);
  useEffect(()=>{
    if(value) return; // don't animate when user is typing
    let i=0, timeout;
    const target=prompts[pidx];
    if(typing){
      const tick=()=>{
        i++;
        setPh(target.slice(0,i));
        if(i<target.length) timeout=setTimeout(tick,38);
        else timeout=setTimeout(()=>setTyping(false),2200);
      };
      timeout=setTimeout(tick,38);
    } else {
      const tick=()=>{
        i=ph.length;
        const erase=()=>{
          if(i>0){ i--; setPh(target.slice(0,i)); setTimeout(erase,18); }
          else { setPidx(p=>(p+1)%prompts.length); setTyping(true); }
        };
        erase();
      };
      timeout=setTimeout(tick,300);
    }
    return ()=>clearTimeout(timeout);
  },[pidx,typing,value]);
  return <input value={value} onChange={onChange} onKeyDown={onKeyDown}
    className="search-hero"
    placeholder={value?"Search teams, coaches, upsets, records…":ph||"Ask anything about the World Cup…"}
    style={style}/>;
}

/* ===================== MATCH DETAIL MODAL ===================== */
function MatchModal({id,onClose}){
  const [d,setD]=useState(null); const [err,setErr]=useState(null);
  const [story,setStory]=useState(null);
  useEffect(()=>{
    if(!id)return;
    setD(null); setErr(null); setStory(null);
    // Fetch match detail and story in parallel
    fetch("/api/match?id="+id).then(r=>r.json()).then(j=>{ if(j.error)throw new Error(j.error); setD(j); }).catch(e=>setErr(e.message));
    fetch("/api/story?id="+id).then(r=>r.json()).then(j=>{ if(!j.error) setStory(j); }).catch(()=>{});
  },[id]);
  if(!id) return null;
  const hasEvents=d?.events?.length>0;
  const hasLineup=s=>s?.lineup?.starting?.length>0;
  const hasAnyDetail=d&&(hasEvents||hasLineup(d?.home)||hasLineup(d?.away));
  const isFinished=d?.status==="FINISHED";
  const icon=(t)=>t==="GOAL"?"⚽":t==="RED"?"🟥":t==="YELLOW"?"🟨":t==="SUB"?"⇄":"•";
  const Side=({s})=>(
    <div style={{flex:1}}>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
        <Crest src={s.crest} size={18}/>
        <span style={{font:`700 13px ${display}`}}>{s.name}</span>
        {s.lineup?.formation&&<span style={{font:`600 10px ${mono}`,color:C.gold,marginLeft:4}}>{s.lineup.formation}</span>}
      </div>
      {hasLineup(s)?(s.lineup.starting||[]).map((p,i)=>(
        <div key={i} style={{display:"flex",gap:8,padding:"4px 0",font:`500 12px ${display}`,color:C.chalk,borderBottom:`1px solid ${C.line}`}}>
          <span style={{width:22,color:C.mute,fontFamily:mono,fontSize:11,textAlign:"right"}}>{p.shirt??""}</span>
          <span style={{flex:1}}>{p.name}</span>
          <span style={{color:C.mute,fontFamily:mono,fontSize:10}}>{p.position||""}</span>
        </div>
      )):<div style={{font:`12px ${mono}`,color:C.mute,padding:"8px 0"}}>Not available on free tier</div>}
    </div>
  );
  return (
    <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(4,12,9,.82)",zIndex:50,display:"grid",placeItems:"center",padding:16}}>
      <div onClick={e=>e.stopPropagation()} style={{background:C.panel,border:`1px solid ${C.line}`,borderRadius:6,maxWidth:680,width:"100%",maxHeight:"86vh",overflowY:"auto",padding:24}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}>
          <div><span style={{font:`700 11px ${mono}`,letterSpacing:".14em",color:C.gold}}>MATCH DETAIL</span>
          {d&&<span style={{font:`11px ${mono}`,color:C.mute,marginLeft:12}}>{d.stage?.replace(/_/g," ")}</span>}</div>
          <button onClick={onClose} style={{background:"none",border:`1px solid ${C.line}`,color:C.chalk,borderRadius:4,padding:"6px 12px",cursor:"pointer",fontFamily:mono}}>Close ✕</button>
        </div>
        {err&&<Panel style={{borderColor:C.red}}><span style={{color:C.red,fontFamily:mono,fontSize:13}}>{err}</span></Panel>}
        {!d&&!err&&<div style={{padding:30,textAlign:"center",color:C.mute,fontFamily:mono}}>Loading…</div>}
        {d&&<div>
          <div style={{textAlign:"center",padding:"16px 0 20px",borderBottom:`1px solid ${C.line}`,marginBottom:20}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:20,marginBottom:8}}>
              <div style={{display:"flex",alignItems:"center",gap:8,flex:1,justifyContent:"flex-end"}}>
                <span style={{font:`700 18px ${display}`}}>{d.home.name}</span><Crest src={d.home.crest} size={28}/>
              </div>
              <span style={{font:`900 36px/1 ${display}`,color:C.gold,minWidth:80,textAlign:"center"}}>{d.home.score??"-"} : {d.away.score??"-"}</span>
              <div style={{display:"flex",alignItems:"center",gap:8,flex:1}}>
                <Crest src={d.away.crest} size={28}/><span style={{font:`700 18px ${display}`}}>{d.away.name}</span>
              </div>
            </div>
            <div style={{font:`12px ${mono}`,color:d.status==="LIVE"?C.red:C.mute}}>
              {d.status==="LIVE"?"● LIVE":d.status==="FINISHED"?"FULL TIME":"SCHEDULED"} · {localDateTime(d.utcKickoff)} ({TZ_LABEL})
            </div>
          </div>
          {isFinished&&!hasAnyDetail&&<Panel style={{marginBottom:20,borderColor:C.goldDim,background:"rgba(232,184,75,.04)"}}>
            <div style={{font:`700 12px ${mono}`,color:C.gold,marginBottom:8}}>📊 Score data only</div>
            <div style={{font:`13px/1.6 ${display}`,color:C.mute}}>
              Lineups, goal scorers, cards and substitutions are not included in the <b style={{color:C.chalk}}>football-data.org free tier</b>. The score above is real and accurate.
            </div>
            <div style={{marginTop:12,display:"flex",gap:10,flexWrap:"wrap"}}>
              <a href="https://www.football-data.org/coverage" target="_blank" rel="noopener noreferrer"
                style={{font:`11px ${mono}`,color:C.gold,border:`1px solid ${C.goldDim}`,padding:"5px 10px",borderRadius:3,textDecoration:"none"}}>Upgrade provider →</a>
              <span style={{font:`11px ${mono}`,color:C.mute,padding:"5px 0"}}>or switch to API-Football free tier (includes lineups)</span>
            </div>
          </Panel>}
          {hasEvents&&<>
            <div style={{font:`600 11px ${mono}`,color:C.mute,letterSpacing:".12em",marginBottom:8}}>TIMELINE</div>
            {d.events.map((e,i)=>(
              <div key={i} style={{display:"flex",gap:12,padding:"8px 0",borderBottom:`1px solid ${C.line}`,alignItems:"center"}}>
                <span style={{width:34,fontFamily:mono,fontSize:12,color:C.gold,flexShrink:0}}>{e.minute!=null?e.minute+"'":""}</span>
                <span style={{width:20,flexShrink:0}}>{icon(e.type)}</span>
                {e.type==="GOAL"&&<Avatar name={e.player} team={e.team} size={28}/>}
                <span style={{flex:1,font:`500 13px ${display}`}}>{e.player}{e.type==="GOAL"&&e.assist?<span style={{color:C.mute}}> (assist {e.assist})</span>:null}{e.type==="SUB"&&e.playerOut?<span style={{color:C.mute}}> ↔ {e.playerOut}</span>:null}</span>
                <span style={{color:C.mute,fontFamily:mono,fontSize:11,flexShrink:0}}>{e.team}</span>
              </div>
            ))}
          </>}
          {(hasLineup(d.home)||hasLineup(d.away))&&<>
            <div style={{font:`600 11px ${mono}`,color:C.mute,letterSpacing:".12em",margin:"20px 0 10px"}}>LINEUPS</div>
            <div style={{display:"flex",gap:20}}><Side s={d.home}/><Side s={d.away}/></div>
          </>}

          {/* ── MATCH STORY ─────────────────────────────────────── */}
          {isFinished&&<div style={{marginTop:20,paddingTop:16,borderTop:`1px solid ${C.line}`}}>
            <div style={{font:`600 11px ${mono}`,color:C.gold,letterSpacing:".12em",marginBottom:12}}>📰 MATCH STORY</div>
            {!story&&<div style={{font:`12px ${mono}`,color:C.mute,padding:"10px 0"}}>Generating story…</div>}
            {story&&<>
              {/* headline */}
              {story.headline&&<div style={{font:`800 18px/1.2 ${display}`,color:C.chalk,marginBottom:12}}>{story.headline}</div>}
              {/* key facts */}
              {story.facts?.length>0&&<div style={{marginBottom:14}}>
                <div style={{font:`600 10px ${mono}`,color:C.mute,letterSpacing:".1em",marginBottom:8}}>KEY FACTS</div>
                {story.facts.map((f,i)=>(
                  <div key={i} style={{display:"flex",gap:10,padding:"6px 0",borderBottom:`1px solid ${C.line}`,alignItems:"flex-start"}}>
                    <span style={{color:C.gold,fontFamily:mono,fontSize:12,flexShrink:0,marginTop:1}}>▸</span>
                    <span style={{font:`13px/1.5 ${display}`,color:C.chalk}}>{f}</span>
                  </div>
                ))}
              </div>}
              {/* AI narrative */}
              {story.narrative&&<>
                <div style={{font:`600 10px ${mono}`,color:C.mute,letterSpacing:".1em",marginBottom:8}}>MATCH REPORT</div>
                <div style={{font:`14px/1.7 ${display}`,color:C.mute}}>{story.narrative}</div>
                <div style={{font:`10px ${mono}`,color:C.line,marginTop:10}}>AI-generated from match data · Not a human report</div>
              </>}
              {!story.narrative&&<div style={{font:`12px ${mono}`,color:C.mute}}>Add ANTHROPIC_API_KEY to Vercel env vars to enable AI match reports.</div>}
            </>}
          </div>}
        </div>}
      </div>
    </div>
  );
}

/* ===================== LIVE ===================== */
function Live({onOpenMatch}) {
  const [data,setData]=useState(null); const [err,setErr]=useState(null);
  const [secs,setSecs]=useState(REFRESH_MS/1000); const timer=useRef(null);
  async function load(){ try{ const r=await fetch("/api/live"); if(!r.ok)throw new Error("Feed "+r.status); setData(await r.json()); setErr(null);}catch(e){setErr(e.message);} setSecs(REFRESH_MS/1000); }
  useEffect(()=>{ load(); timer.current=setInterval(load,REFRESH_MS); const t=setInterval(()=>setSecs(s=>s>0?s-1:0),1000); return()=>{clearInterval(timer.current);clearInterval(t);}; },[]);
  const Row=({m})=>(
    <div onClick={()=>onOpenMatch&&onOpenMatch(m.id)} style={{display:"flex",alignItems:"center",gap:12,padding:"14px 0",borderBottom:`1px solid ${C.line}`,cursor:"pointer"}} title="View match detail">
      <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"flex-end",gap:9,font:`600 15px ${display}`,minWidth:0}}><span style={{whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{m.home.name}</span><Crest src={m.home.crest}/></div>
      <div style={{display:"flex",gap:6,alignItems:"center",minWidth:90,justifyContent:"center"}}>
        <span style={{font:`800 20px ${display}`,color:C.gold}}>{m.home.score??"–"}</span><span style={{color:C.mute}}>:</span><span style={{font:`800 20px ${display}`,color:C.gold}}>{m.away.score??"–"}</span>
      </div>

function QualOdds(){
  const [data,setData]=useState(null); const [err,setErr]=useState(null);
  useEffect(()=>{ fetch("/api/standings").then(r=>r.json()).then(setData).catch(e=>setErr(e.message)); },[]);
  // Simple, transparent: blend current points with Elo strength to estimate
  // probability of finishing top 2 in the group.
  function odds(group){
    const teams=group.table.map(r=>({team:r.team,pts:r.points,played:r.played,elo:M.rating(r.team)}));
    const scored=teams.map(t=>({...t, score: t.pts*1.0 + (t.elo-1750)/100 + (3-t.played)*0.1}));
    const exps=scored.map(t=>Math.exp(t.score/1.5));
    const sum=exps.reduce((a,b)=>a+b,0);
    // approximate P(top2) by softmax mass of the two best slots
    return scored.map((t,i)=>({team:t.team, p: Math.min(0.99, (exps[i]/sum)*2 )})).sort((a,b)=>b.p-a.p);
  }
  return (<div>
    <H2 eyebrow="Live — Qualification Model" title="Who advances?" right={<span className="est" style={{display:"inline-flex",alignItems:"center",gap:5}}>MODEL ESTIMATE <Info text="These percentages are calculated by a mathematical model — not official predictions. They blend real current points with each team's pre-tournament strength rating. Treat them as informed estimates, not facts."/></span>}/>
    <p style={{font:`13px/1.5 ${display}`,color:C.mute,margin:"0 0 18px",maxWidth:560}}>Probability of finishing top-2 and reaching the knockouts. Blends current points (real) with team strength and games remaining. An estimate, not a guarantee.</p>
    {err && <Panel style={{borderColor:C.red}}><span style={{color:C.red,fontFamily:mono}}>Standings unavailable — {err}</span></Panel>}
    {!data && !err && <div style={{padding:30,color:C.mute,fontFamily:mono}}>Loading…</div>}
    {data && data.groups.map(g=>(
      <Panel key={g.group} style={{marginBottom:14}}>
        <div style={{font:`700 13px ${mono}`,color:C.gold,marginBottom:12}}>{g.group}</div>
        {odds(g).map(o=>(
          <div key={o.team} style={{display:"flex",alignItems:"center",gap:12,padding:"7px 0"}}>
            <div style={{width:150,font:`600 14px ${display}`}}>{o.team}</div>
            <div style={{flex:1,height:18,background:C.pitch2,borderRadius:3,overflow:"hidden"}}>
              <div style={{width:(o.p*100)+"%",height:"100%",background:o.p>0.55?C.grass:o.p>0.3?C.gold:C.goldDim}}></div>
            </div>
            <div style={{width:46,textAlign:"right",font:`700 13px ${mono}`,color:C.chalk}}>{(o.p*100).toFixed(0)}%</div>
          </div>
        ))}
      </Panel>
    ))}
  </div>);
}

/* ===================== PLAYER PREDICTOR (Golden Boot) ===================== */
function PlayerPredictor(){
  const [data,setData]=useState(null); const [err,setErr]=useState(null);
  const [remaining,setRemaining]=useState(4);
  useEffect(()=>{ fetch("/api/scorers").then(r=>r.json()).then(setData).catch(e=>setErr(e.message)); },[]);
  const live=(data?.scorers||[]).slice(0,8);
  const rows=live.map(s=>{
    const proj=M.bootProjection({currentGoals:s.goals,team:s.team,avgOpponent:"Average",remainingGames:remaining});
    return {name:s.player, Banked:proj.banked, Projected:proj.projected, total:proj.total};
  }).sort((a,b)=>b.total-a.total);
  return (<div>
    <H2 eyebrow="Prediction — Golden Boot" title="Final scorer projection" right={<span className="est">MODEL ESTIMATE</span>}/>
    <p style={{font:`13px/1.5 ${display}`,color:C.mute,margin:"0 0 16px",maxWidth:580}}>Each bar splits goals already scored (real, from the feed) from model-projected goals over the remaining games. Drag the slider to change how many games are left.</p>
    <Panel style={{marginBottom:16}}>
      <label style={{font:`600 11px ${mono}`,color:C.mute}}>REMAINING GAMES FOR LEADERS: <span style={{color:C.gold}}>{remaining}</span></label>
      <input type="range" min="0" max="6" value={remaining} onChange={e=>setRemaining(+e.target.value)} style={{width:"100%",marginTop:8,accentColor:C.gold}}/>
    </Panel>
    {err && <Panel style={{borderColor:C.red}}><span style={{color:C.red,fontFamily:mono}}>Scorers unavailable — {err}</span></Panel>}
    {!data && !err && <div style={{padding:30,color:C.mute,fontFamily:mono}}>Loading…</div>}
    {data && rows.length===0 && <Empty>No goals yet — projections appear once players are on the scoresheet.</Empty>}
    {rows.length>0 && <Panel>
      <ResponsiveContainer width="100%" height={Math.max(260,rows.length*42)}>
        <BarChart data={rows} layout="vertical" margin={{left:40,right:40,top:0,bottom:0}}>
          <CartesianGrid stroke={C.line} horizontal={false}/>

          <Tooltip {...tip}/>
          <Legend wrapperStyle={{fontFamily:mono,fontSize:11}}/>

        </BarChart>

      <div style={{font:`11px ${mono}`,color:C.mute,marginTop:10}}>Gold = scored so far · dim = projected remaining. Projection assumes a striker converts a share of expected team goals.</div>
    </Panel>}
  </div>);
}

/* ===================== PATH TO FINAL (Monte Carlo) ===================== */
function Simulator(){
  const teams=Object.keys(M.RATINGS);
  const [team,setTeam]=useState("Brazil");
  const [rounds,setRounds]=useState(4);
  const [res,setRes]=useState(null);
  const [running,setRunning]=useState(false);
  function run(){
    setRunning(true);
    // defer so the button can show "running" before the 10k-loop blocks
    setTimeout(()=>{
      const field=teams.slice().sort((a,b)=>M.rating(b)-M.rating(a)).slice(0,16);
      const withTeam=field.includes(team)?field:[team,...field.slice(0,15)];
      setRes(M.simulateBracket(team,withTeam,rounds,10000));
      setRunning(false);
    },30);
  }
  useEffect(()=>{ run(); },[team,rounds]); // eslint-disable-line
  const roundsLabel={1:"Final only",2:"From semis",3:"From quarters",4:"From Round of 16"};
  return (<div>
    <H2 eyebrow="Prediction — Monte Carlo" title={<>Path to the final <Info text="Simulates a team's full knockout run thousands of times, accounting for realistic draw of opponents each round. The % is how often they win the whole thing across all simulations."/></>} right={<span className="est">10,000 SIMS</span>}/>
    <p style={{font:`13px/1.5 ${display}`,color:C.mute,margin:"0 0 18px",maxWidth:600}}>Simulates a team's remaining knockout run ten thousand times. Each round the opponent is a random survivor weighted by strength — so the odds reflect a realistic, uncertain path, not one fixed bracket. <Info text="A Monte Carlo simulation runs thousands of random 'versions' of the tournament. Each run picks a random opponent for each round based on team strength. The final % shows how often your team wins across all those runs." label="How does this work?"/></p>
    <div style={{display:"flex",gap:16,marginBottom:18,flexWrap:"wrap"}}>
      <Select label="Team" value={team} onChange={setTeam} options={teams}/>
      <div style={{flex:1,minWidth:140}}>
        <div style={{font:`600 10px ${mono}`,letterSpacing:".14em",color:C.mute,marginBottom:6,textTransform:"uppercase",display:"flex",alignItems:"center",gap:6}}>
          Starting from <Info text={`Choose which stage of the knockout rounds to simulate from:\n4 = Round of 16 (last 32 teams)\n3 = Quarter-finals (last 8)\n2 = Semi-finals (last 4)\n1 = Final only`}/>
        </div>
        <select value={String(rounds)} onChange={e=>setRounds(+e.target.value)} style={{width:"100%",font:`600 14px ${display}`,padding:"10px 12px",color:C.chalk,background:C.pitch2,border:`1px solid ${C.line}`,borderRadius:3}}>
          {[["4","Round of 16 → Final"],["3","Quarter-final → Final"],["2","Semi-final → Final"],["1","Final only"]].map(([v,l])=><option key={v} value={v}>{l}</option>)}
        </select>
      </div>
    </div>
    <Panel style={{marginBottom:16,textAlign:"center"}}>
      <div style={{font:`600 11px ${mono}`,color:C.mute,letterSpacing:".12em"}}>TITLE ODDS — {team.toUpperCase()}, {roundsLabel[rounds]} <Info text="The probability this team lifts the trophy, based on 10,000 simulated knockout brackets. Not a prediction — a model estimate based on team strength ratings."/></div>
      <div style={{font:`800 64px/1 ${display}`,color:C.gold,margin:"10px 0"}}>{running?"…":res?(res.titleOdds*100).toFixed(1)+"%":"—"}</div>
      <button onClick={run} disabled={running} style={{font:`600 12px ${mono}`,padding:"8px 16px",cursor:"pointer",borderRadius:3,border:`1px solid ${C.gold}`,background:"transparent",color:C.gold}}>Re-run simulation</button>
    </Panel>
    {res && <Panel>
      <div style={{font:`600 11px ${mono}`,color:C.mute,letterSpacing:".12em",marginBottom:12}}>WHERE THE RUN ENDS — probability of exiting at each stage</div>
      <ResponsiveContainer width="100%" height={240}>
        <BarChart data={[...res.exitByRound.map(e=>({stage:e.label,pct:+(e.pct*100).toFixed(1)})),{stage:"Champion",pct:+(res.titleOdds*100).toFixed(1)}]} margin={{left:-12,right:16,top:0,bottom:0}}>
          <CartesianGrid stroke={C.line} vertical={false}/>
          <XAxis dataKey="stage" tick={{fill:C.mute,fontSize:10,fontFamily:mono}} angle={-20} textAnchor="end" height={56}/>
          <YAxis tick={{fill:C.mute,fontSize:10,fontFamily:mono}} unit="%"/>
          <Tooltip {...tip} formatter={v=>[v+"%","Probability"]}/>
          <Bar dataKey="pct" radius={[3,3,0,0]}>
            {[...res.exitByRound,{}].map((e,i,arr)=><Recharts.Cell key={i} fill={i===arr.length-1?C.gold:C.goldDim}/>)}
          </Bar>
        </BarChart>
      </ResponsiveContainer>
      <div style={{font:`11px ${mono}`,color:C.mute,marginTop:10}}>Gold = lifts the trophy. Field = top 16 teams by rating; opponents sampled by strength each round.</div>
    </Panel>}
  </div>);
}

function Alerts(){
  const teams=Object.keys(M.RATINGS).sort();

  async function submit(){
    setBusy(true); setStatus(null);
    const target = scope==="team"?team : scope==="player"?player : null;

/* ===================== COACH ANALYTICS ===================== */
function CoachAnalytics(){

          <div style={{font:`12px ${display}`,color:C.mute,marginTop:6}}>{c.bestFinish}</div>

      {teams.map(t=><button key={t} onClick={()=>{setCenter(t);setActiveNode(null);}} style={{font:`600 12px ${mono}`,padding:"8px 14px",cursor:"pointer",borderRadius:20,border:`1px solid ${center===t?C.gold:C.line}`,background:center===t?C.gold:"transparent",color:center===t?C.pitch:C.mute}}>{D.TEAMS[t]?.flag||""} {t}</button>)}
    </div>
    {/* Visual graph — SVG hub-and-spoke */}
    <Panel style={{marginBottom:16,overflow:"hidden"}}>
      <svg viewBox="0 0 700 380" style={{width:"100%",height:"auto"}}>
        {/* center node */}
        <circle cx="350" cy="190" r="46" fill={C.gold} opacity=".15" stroke={C.gold} strokeWidth="2"/>
        <text x="350" y="185" textAnchor="middle" style={{fill:C.gold,fontSize:14,fontWeight:800,fontFamily:display}}>{D.TEAMS[center]?.flag}</text>
        <text x="350" y="204" textAnchor="middle" style={{fill:C.chalk,fontSize:13,fontWeight:700,fontFamily:display}}>{center}</text>
        {/* spoke groups */}
        {nodeTypes.map((nt,gi)=>{
          const angles=[[270,315,45,90],[270,315,45,90]]; // top, right, bottom, left quadrant
          const baseAngle=gi*(360/nodeTypes.length)-30;
          const spokeAngle=(baseAngle)*Math.PI/180;
          const r=140;
          const sx=350+Math.cos(spokeAngle)*r;
          const sy=190+Math.sin(spokeAngle)*r;
          return <g key={gi}>
            <line x1="350" y1="190" x2={sx} y2={sy} stroke={nt.color} strokeWidth="1.5" strokeDasharray="4 3" opacity=".5"/>
            <circle cx={sx} cy={sy} r="30" fill={nt.color} opacity=".12" stroke={nt.color} strokeWidth="1.5"/>
            <text x={sx} y={sy-4} textAnchor="middle" style={{fill:nt.color,fontSize:11,fontWeight:700,fontFamily:mono}}>{nt.icon}</text>
            <text x={sx} y={sy+10} textAnchor="middle" style={{fill:C.chalk,fontSize:9,fontFamily:mono}}>{nt.label}</text>
          </g>;
        })}
      </svg>
    </Panel>
    {/* Expanded relationship panels */}
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
      {nodeTypes.map((nt,i)=>(
        <Panel key={i} style={{borderTop:`2px solid ${nt.color}`}}>
          <div style={{font:`700 11px ${mono}`,color:nt.color,letterSpacing:".1em",marginBottom:10}}>{nt.icon} {nt.label.toUpperCase()}</div>
          {nt.items.map((item,j)=>(
            <div key={j} onClick={()=>setActiveNode(activeNode===item?null:item)} style={{padding:"7px 0",borderBottom:`1px solid ${C.line}`,cursor:"pointer",font:`13px ${display}`,color:activeNode===item?nt.color:C.chalk}}>{item}</div>
          ))}
        </Panel>
      ))}
    </div>
  </div>;
}

function NationEvolution(){
  const D=window.WCData;
  const teams=Object.keys(D.TEAMS);
  const [sel,setSel]=useState("Brazil");
  const t=D.TEAMS[sel];
  const evoData=t.byDecade.map(d=>({
    decade:d.decade,
    winPct:d.played>0?+(d.won/d.played*100).toFixed(0):0,
    gpm:d.played>0?+(d.gf/d.played).toFixed(1):0,
    played:d.played
  })).filter(d=>d.played>0);
  return <div>
    <H2 eyebrow="Nation Evolution" title="How nations changed across eras"/>
    <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:20}}>
      {teams.map(n=><button key={n} onClick={()=>setSel(n)} style={{font:`600 12px ${mono}`,padding:"7px 12px",cursor:"pointer",borderRadius:3,border:`1px solid ${sel===n?C.gold:C.line}`,background:sel===n?C.gold:"transparent",color:sel===n?C.pitch:C.mute}}>{D.TEAMS[n].flag} {n}</button>)}
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginBottom:16}}>
      <Panel>
        <div style={{font:`600 11px ${mono}`,color:C.mute,letterSpacing:".12em",marginBottom:12}}>WIN % TREND BY DECADE</div>
        <ResponsiveContainer width="100%" height={220}>
          <AreaChart data={evoData} margin={{left:-20,right:8,top:5,bottom:0}}>
            <defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={C.gold} stopOpacity={.4}/><stop offset="100%" stopColor={C.gold} stopOpacity={0}/></linearGradient></defs>
            <CartesianGrid stroke={C.line} vertical={false}/>
            <XAxis dataKey="decade" tick={{fill:C.mute,fontSize:9,fontFamily:mono}} angle={-20} textAnchor="end" height={48}/>
            <YAxis tick={{fill:C.mute,fontSize:10,fontFamily:mono}} unit="%"/>
            <Tooltip {...tip} formatter={v=>[v+"%","Win %"]}/>
            <Area type="monotone" dataKey="winPct" stroke={C.gold} strokeWidth={2} fill="url(#wg)"/>
          </AreaChart>
        </ResponsiveContainer>
      </Panel>
      <Panel>
        <div style={{font:`600 11px ${mono}`,color:C.mute,letterSpacing:".12em",marginBottom:12}}>GOALS PER MATCH TREND</div>
        <ResponsiveContainer width="100%" height={220}>
          <AreaChart data={evoData} margin={{left:-20,right:8,top:5,bottom:0}}>
            <defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={C.grass} stopOpacity={.4}/><stop offset="100%" stopColor={C.grass} stopOpacity={0}/></linearGradient></defs>
            <CartesianGrid stroke={C.line} vertical={false}/>
            <XAxis dataKey="decade" tick={{fill:C.mute,fontSize:9,fontFamily:mono}} angle={-20} textAnchor="end" height={48}/>
            <YAxis tick={{fill:C.mute,fontSize:10,fontFamily:mono}}/>
            <Tooltip {...tip} formatter={v=>[v,"Goals/match"]}/>
            <Area type="monotone" dataKey="gpm" stroke={C.grass} strokeWidth={2} fill="url(#gg)"/>
          </AreaChart>
        </ResponsiveContainer>
      </Panel>
    </div>
    {/* Decade cards */}
    <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10}}>
      {t.byDecade.filter(d=>d.played>0).map((d,i)=>(
        <Panel key={i} style={{padding:14}}>
          <div style={{font:`700 13px ${mono}`,color:C.gold,marginBottom:8}}>{d.decade}</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
            <Stat label="Played" value={d.played}/>
            <Stat label="Win %" value={d.played>0?+(d.won/d.played*100).toFixed(0)+"%":"—"} accent={C.gold}/>
            <Stat label="GF" value={d.gf}/>
            <Stat label="GA" value={d.ga}/>
          </div>
        </Panel>
      ))}
    </div>
  </div>;
}

function initials(name) {
  if (!name) return "?";
  const parts = name.trim().split(" ");
  return parts.length === 1 ? parts[0][0] : parts[0][0] + parts[parts.length-1][0];
}
function Avatar({name, team, size=38}) {
  const bg = TEAM_COLOURS[team] || "#1d3b31";
  const ini = initials(name);
  return (
    <div style={{width:size,height:size,borderRadius:"50%",background:bg,display:"grid",
      placeItems:"center",flexShrink:0,border:`2px solid rgba(255,255,255,.12)`}}>
      <span style={{font:`700 ${Math.round(size*0.38)}px/1 ${display}`,color:"#fff",letterSpacing:"-.01em"}}>{ini.toUpperCase()}</span>
    </div>
  );
}
function LiveStatsWidget({onNavigate}){
  const [data,setData]=useState(null);
  const [statTab,setStatTab]=useState("goals");
  useEffect(()=>{
    fetch("/api/scorers").then(r=>r.json()).then(j=>{ if(!j.error)setData(j); }).catch(()=>{});
  },[]);
  if(!data||!data.scorers||data.scorers.length===0) return null;
  const tabs=[["goals","Goals"],["assists","Assists"],["penalties","Pens"]];
  const sorted=[...data.scorers]
    .filter(s=>s[statTab]!=null&&s[statTab]>0)
    .sort((a,b)=>(b[statTab]||0)-(a[statTab]||0))
    .slice(0,8);
  if(sorted.length===0) return null;
  const max=sorted[0][statTab]||1;
  return (
    <Panel style={{marginBottom:20,cursor:"default"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14,flexWrap:"wrap",gap:10}}>

          {tabs.map(([k,l])=><button key={k} onClick={()=>setStatTab(k)} style={{font:`600 11px ${mono}`,padding:"5px 10px",cursor:"pointer",borderRadius:3,border:`1px solid ${statTab===k?C.gold:C.line}`,background:statTab===k?C.gold:"transparent",color:statTab===k?C.pitch:C.mute}}>{l}</button>)}
        </div>
      </div>
      <div style={{display:"grid",gap:2}}>
        {sorted.map((s,i)=>(
          <div key={i} style={{display:"flex",alignItems:"center",gap:12,padding:"8px 0",borderBottom:`1px solid ${C.line}`}}>
            <span style={{font:`700 13px ${mono}`,color:i===0?C.gold:C.mute,width:20,textAlign:"right"}}>{i+1}</span>
            <Avatar name={s.player} team={s.team}/>
            <div style={{flex:1,minWidth:0}}>
              <div style={{font:`600 14px ${display}`,color:C.chalk,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{s.player}</div>
              <div style={{font:`11px ${mono}`,color:C.mute,marginTop:2}}>{s.team}</div>
            </div>
            {/* bar */}
            <div style={{width:100,height:6,background:C.pitch2,borderRadius:3,overflow:"hidden"}}>
              <div style={{width:((s[statTab]||0)/max*100)+"%",height:"100%",borderRadius:3,background:i===0?C.gold:C.goldDim}}/>
            </div>
            <span style={{font:`800 18px/1 ${display}`,color:i===0?C.gold:C.chalk,minWidth:24,textAlign:"right"}}>{s[statTab]||0}</span>
          </div>
        ))}
      </div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:10,paddingTop:10,borderTop:`1px solid ${C.line}`}}>
        <div style={{font:`11px ${mono}`,color:C.mute}}>Live from tournament feed</div>
        <button onClick={()=>onNavigate("Scorer Race")} style={{font:`11px ${mono}`,color:C.gold,background:"none",border:"none",cursor:"pointer",padding:0}}>View full leaderboard →</button>
      </div>
    </Panel>
  );
}

/* ===================== PAST RESULTS ===================== */
function Results({onOpenMatch}){
  const [data,setData]=useState(null); const [err,setErr]=useState(null);
  const [days,setDays]=useState(7);
  useEffect(()=>{
    setData(null); setErr(null);
    fetch(`/api/results?days=${days}`)
      .then(r=>r.json())
      .then(j=>{if(j.error)throw new Error(j.detail||j.error);setData(j);})
      .catch(e=>setErr(e.message));
  },[days]);

  // Sort group keys newest first
  const groupKeys = data ? Object.keys(data.groups).sort((a,b)=>b.localeCompare(a)) : [];

  const ResultRow=({m})=>(
    <div onClick={()=>onOpenMatch&&onOpenMatch(m.id)} style={{display:"flex",alignItems:"center",gap:12,padding:"12px 0",borderBottom:`1px solid ${C.line}`,cursor:"pointer"}} title="View match detail">
      <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"flex-end",gap:9,font:`600 14px ${display}`}}>
        <span>{m.home.name}</span><Crest src={m.home.crest}/>
      </div>
      <div style={{display:"flex",gap:8,alignItems:"center",minWidth:80,justifyContent:"center"}}>
        <span style={{font:`800 20px ${display}`,color:C.gold}}>{m.home.score}</span>
        <span style={{color:C.mute,font:`600 12px ${mono}`}}>–</span>
        <span style={{font:`800 20px ${display}`,color:C.gold}}>{m.away.score}</span>
      </div>
      <div style={{flex:1,display:"flex",alignItems:"center",gap:9,font:`600 14px ${display}`}}>
        <Crest src={m.away.crest}/><span style={{whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{m.away.name}</span>
      </div>
      <div style={{width:44,textAlign:"right",font:`600 10px ${mono}`,color:C.mute}}>FT</div>
    </div>
  );

  return <div>
    <H2 eyebrow="Past Results" title="Recent matches" right={
      <div style={{display:"flex",gap:6}}>
        {[3,7,14].map(d=><button key={d} onClick={()=>setDays(d)} style={{font:`600 11px ${mono}`,padding:"6px 10px",cursor:"pointer",borderRadius:3,border:`1px solid ${days===d?C.gold:C.line}`,background:days===d?C.gold:"transparent",color:days===d?C.pitch:C.mute}}>Last {d}d</button>)}
      </div>}/>
    <div style={{font:`11px ${mono}`,color:C.mute,marginBottom:16}}>
      All times shown in your local timezone ({TZ_LABEL}). Click any match for the goal timeline and lineups.
    </div>
    {err && <Panel style={{borderColor:C.red}}>
      <div style={{font:`600 13px ${mono}`,color:C.red,marginBottom:6}}>Results unavailable</div>
      <div style={{font:`12px/1.5 ${mono}`,color:C.mute}}>{err}</div>
      <div style={{font:`12px/1.5 ${display}`,color:C.mute,marginTop:8}}>This usually means the provider returned an error. Check your <b style={{color:C.chalk}}>FOOTBALL_DATA_API_KEY</b> in Vercel Environment Variables, then redeploy. Open the Vercel function logs for the exact provider message.</div>
    </Panel>}
    {!data && !err && <div style={{padding:30,color:C.mute,fontFamily:mono,textAlign:"center"}}>Loading results…</div>}
    {data && groupKeys.length===0 && <Empty>No finished matches in the last {days} days yet — check back once games have been played.</Empty>}
    {data && groupKeys.map(day=>(
      <div key={day} style={{marginBottom:20}}>
        <div style={{font:`700 11px ${mono}`,color:C.gold,letterSpacing:".14em",padding:"8px 0",borderBottom:`1px solid ${C.line}`,marginBottom:2}}>
          {localDate(day+"T12:00:00Z").toUpperCase()}
        </div>
        <Panel style={{padding:"4px 16px"}}>
          {data.groups[day].map(m=><ResultRow key={m.id} m={m}/>)}
        </Panel>
      </div>
    ))}
    {data && <div style={{font:`11px ${mono}`,color:C.mute,textAlign:"center",marginTop:8}}>
      Updated {localTime(data.updatedAt)} ({TZ_LABEL}) · cached 10 min server-side
    </div>}
  </div>;
}

/* ===================== DAILY TRIVIA ===================== */
const TRIVIA=[
  {q:"Which team pulled off the biggest statistical upset in 1950, defeating Brazil in front of 200,000 fans?",a:"Uruguay",opts:["Argentina","Uruguay","England","Sweden"],fact:"The 'Maracanazo' — Uruguay beat Brazil 2-1 in the deciding match at the Maracanã. It's still considered the greatest upset in football history.",year:1950},
  {q:"Who scored the 'Goal of the Century' — 11 touches, 60 metres, past 5 players — at the 1986 World Cup?",a:"Diego Maradona",opts:["Pelé","Zico","Diego Maradona","Gary Lineker"],fact:"Maradona dribbled from his own half past 5 English players and the goalkeeper in the quarter-final. FIFA fans voted it the greatest goal in World Cup history.",year:1986},
  {q:"Which country is the only one to have participated in every single World Cup?",a:"Brazil",opts:["Germany","Italy","Brazil","Argentina"],fact:"Brazil has appeared in all 23 World Cups (1930–2026), the only country with a 100% qualification record. They've won it 5 times.",year:null},
  {q:"Who is the all-time leading scorer in World Cup history with 16 goals across 4 tournaments?",a:"Miroslav Klose",opts:["Ronaldo","Gerd Müller","Miroslav Klose","Just Fontaine"],fact:"Klose scored 16 goals for Germany across 2002, 2006, 2010, and 2014. He surpassed Ronaldo's record of 15 in the 2014 semi-final against Brazil.",year:null},
  {q:"Saudi Arabia beat Argentina 2-1 in 2022. What was Argentina's approximate win probability before the match?",a:"Around 90%",opts:["Around 60%","Around 75%","Around 90%","Around 50%"],fact:"Argentina's Elo rating was ~350 points higher than Saudi Arabia's. The model gave Argentina roughly 88% probability of winning. Saudi Arabia's equalising goal came from a run of offside traps perfectly executed.",year:2022},
  {q:"Just Fontaine set the record for most goals in a single World Cup in 1958. How many did he score?",a:"13",opts:["11","13","15","10"],fact:"Fontaine scored 13 goals for France in just 6 matches at the 1958 World Cup in Sweden. The record has stood for 68 years and is unlikely to ever be broken.",year:1958},
  {q:"Which country hosted the first-ever FIFA World Cup in 1930?",a:"Uruguay",opts:["Brazil","Argentina","Uruguay","France"],fact:"Uruguay hosted and won the first World Cup. Only 13 teams participated — European nations largely refused to travel the long sea voyage. Uruguay beat Argentina 4-2 in the final.",year:1930},
  {q:"Germany beat Brazil 7-1 in the 2014 semi-final on Brazilian soil. What is this game known as?",a:"The Mineirazo",opts:["The Maracanazo","The Mineirazo","Die Schwarze Nacht","Das Wunder"],fact:"The 'Mineirazo' (after Estádio Mineirão in Belo Horizonte) is the most shocking scoreline in World Cup history. Germany scored 5 goals in 18 first-half minutes.",year:2014},
];
function DailyTrivia(){
  // Seed with today's date so everyone gets the same question each day
  const todaySeed=new Date().toISOString().slice(0,10).replace(/-/g,'');
  const idx=parseInt(todaySeed)%TRIVIA.length;
  const q=TRIVIA[idx];
  const [ans,setAns]=useState(null);
  const [showFact,setShowFact]=useState(false);
  const correct=ans===q.a;
  return <div>
    <H2 eyebrow="Daily Trivia" title="Test your World Cup IQ"/>
    <p style={{font:`13px/1.5 ${display}`,color:C.mute,margin:"0 0 20px",maxWidth:560}}>A new question every day, drawn from 90 years of World Cup history. Everyone gets the same question.</p>
    <Panel style={{marginBottom:16}}>
      <div style={{font:`600 11px ${mono}`,color:C.gold,letterSpacing:".1em",marginBottom:12}}>
        TODAY'S QUESTION{q.year?` · ${q.year} WORLD CUP`:""}
      </div>
      <div style={{font:`700 18px/1.4 ${display}`,color:C.chalk,marginBottom:20}}>{q.q}</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
        {q.opts.map(opt=>{
          const selected=ans===opt;
          const isCorrect=opt===q.a;
          const bg=ans?(isCorrect?"rgba(63,174,111,.15)":selected?"rgba(217,84,63,.15)":"transparent"):selected?"rgba(232,184,75,.1)":"transparent";
          const border=ans?(isCorrect?C.grass:selected?C.red:C.line):selected?C.gold:C.line;
          const col=ans?(isCorrect?C.grass:selected?C.red:C.mute):selected?C.gold:C.mute;
          return <button key={opt} onClick={()=>{if(!ans){setAns(opt);setTimeout(()=>setShowFact(true),400);}}}
            style={{font:`600 14px ${display}`,padding:"12px 16px",cursor:ans?"default":"pointer",borderRadius:4,
              border:`1px solid ${border}`,background:bg,color:col,textAlign:"left",transition:"all .2s"}}>
            {ans&&isCorrect&&"✓ "}{ans&&selected&&!isCorrect&&"✗ "}{opt}
          </button>;
        })}
      </div>
      {ans&&<div style={{padding:"14px 16px",borderRadius:4,background:correct?"rgba(63,174,111,.08)":"rgba(217,84,63,.08)",border:`1px solid ${correct?C.grass:C.red}`,marginBottom:12}}>
        <div style={{font:`700 15px ${display}`,color:correct?C.grass:C.red,marginBottom:6}}>{correct?"🎉 Correct!":"❌ Not quite — the answer is "+q.a}</div>
        {showFact&&<div style={{font:`13px/1.6 ${display}`,color:C.mute}}>{q.fact}</div>}
      </div>}
      {ans&&<div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
        <button onClick={()=>{setAns(null);setShowFact(false);}} style={{font:`600 12px ${mono}`,padding:"8px 14px",cursor:"pointer",borderRadius:4,border:`1px solid ${C.line}`,background:"transparent",color:C.mute}}>Try again</button>
        <button onClick={()=>{const txt=`I just answered a World Cup Trivia question ${correct?"correctly! 🎉":"incorrectly... 😅"} Can you beat me? Try at fifa.rajeevbuilds.dev`;navigator.clipboard?.writeText(txt).catch(()=>{});}} style={{font:`600 12px ${mono}`,padding:"8px 14px",cursor:"pointer",borderRadius:4,border:`1px solid ${C.gold}`,background:"transparent",color:C.gold}}>📋 Copy & Share</button>
      </div>}
    </Panel>
    <Panel style={{padding:"12px 16px"}}>
      <div style={{font:`600 10px ${mono}`,color:C.mute,marginBottom:8}}>ALL TRIVIA QUESTIONS ({TRIVIA.length} total — cycles daily)</div>
      {TRIVIA.map((t,i)=><div key={i} style={{padding:"6px 0",borderBottom:`1px solid ${C.line}`,font:`12px ${display}`,color:i===idx?C.gold:C.mute,display:"flex",gap:8}}>
        <span style={{fontFamily:mono,flexShrink:0}}>{i===idx?"▶":"  "} {t.year||"All time"}</span>
        <span>{t.q.slice(0,60)}…</span>
      </div>)}
    </Panel>
  </div>;
}

/* ===================== NEWS FEED ===================== */
function NewsFeed(){
  const [data,setData]=useState(null);
  const [err,setErr]=useState(null);
  const [filter,setFilter]=useState("all");
  useEffect(()=>{
    fetch("/api/visit?news=1").then(r=>r.json()).then(j=>{
      if(j.error&&!j.items) throw new Error(j.error);
      setData(j);
    }).catch(e=>setErr(e.message));
  },[]);

  const sources=data?[...new Set(data.items.map(i=>i.src))]:[];
  const items=(data?.items||[]).filter(i=>filter==="all"||i.src===filter);
  const timeAgo=(pub)=>{
    if(!pub) return "";
    const diff=Date.now()-new Date(pub).getTime();
    const h=Math.floor(diff/3600000);
    if(h<1) return `${Math.floor(diff/60000)}m ago`;
    if(h<24) return `${h}h ago`;
    return `${Math.floor(h/24)}d ago`;
  };

  return <div>
    <H2 eyebrow="Football News" title="Latest World Cup news"/>
    <p style={{font:`13px/1.5 ${display}`,color:C.mute,margin:"0 0 16px",maxWidth:560}}>
      Live headlines from BBC Sport, The Guardian, and Google News. Updates every 30 minutes. Click any story to read the full article.
    </p>

    {/* Source filter */}
    {sources.length>0&&<div style={{display:"flex",gap:8,marginBottom:16,flexWrap:"wrap"}}>
      {["all",...sources].map(s=><button key={s} onClick={()=>setFilter(s)}
        style={{font:`600 11px ${mono}`,padding:"6px 12px",cursor:"pointer",borderRadius:20,
          border:`1px solid ${filter===s?C.gold:C.line}`,
          background:filter===s?C.gold:"transparent",
          color:filter===s?C.pitch:C.mute}}>
        {s==="all"?"All sources":s}
      </button>)}
    </div>}

    {err&&<Panel style={{borderColor:C.red}}>
      <div style={{font:`13px ${display}`,color:C.red}}>News feed unavailable — {err}</div>
      <div style={{font:`12px ${mono}`,color:C.mute,marginTop:6}}>RSS feeds may be temporarily unreachable. Try again in a few minutes.</div>
    </Panel>}

    {!data&&!err&&<div style={{display:"grid",gap:12}}>
      {[1,2,3,4,5].map(i=><Panel key={i} style={{padding:16}}>
        <Skeleton width="60%" height={14} style={{marginBottom:8}}/>
        <Skeleton width="90%" height={12} style={{marginBottom:6}}/>
        <Skeleton width="75%" height={12}/>
      </Panel>)}
    </div>}

    {items.length>0&&<div style={{display:"grid",gap:10}}>
      {items.map((item,i)=>(
        <a key={i} href={item.link} target="_blank" rel="noopener noreferrer"
          style={{textDecoration:"none",display:"block"}}>
          <div style={{background:C.panel,border:`1px solid ${C.line}`,borderRadius:4,padding:16,
            transition:"border-color .15s,background .15s",cursor:"pointer"}}
            onMouseEnter={e=>{e.currentTarget.style.borderColor=C.gold;e.currentTarget.style.background=`rgba(232,184,75,.04)`;}}
            onMouseLeave={e=>{e.currentTarget.style.borderColor=C.line;e.currentTarget.style.background=C.panel;}}>
            <div style={{display:"flex",gap:14,alignItems:"flex-start"}}>
              {item.img&&<img src={item.img} alt="" loading="lazy"
                style={{width:80,height:54,objectFit:"cover",borderRadius:3,flexShrink:0,border:`1px solid ${C.line}`}}
                onError={e=>e.target.style.display="none"}/>}
              <div style={{flex:1,minWidth:0}}>
                <div style={{font:`700 15px/1.3 ${display}`,color:C.chalk,marginBottom:6}}>{item.title}</div>
                {item.desc&&<div style={{font:`12px/1.5 ${display}`,color:C.mute,marginBottom:8,
                  overflow:"hidden",display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical"}}>
                  {item.desc}
                </div>}
                <div style={{display:"flex",gap:10,font:`10px ${mono}`,color:C.mute,alignItems:"center"}}>
                  <span style={{color:C.gold,fontWeight:600}}>{item.src}</span>
                  {item.pub&&<span>{timeAgo(item.pub)}</span>}
                  <span style={{marginLeft:"auto",color:C.gold}}>Read →</span>
                </div>
              </div>
            </div>
          </div>
        </a>
      ))}
    </div>}

    {data&&items.length===0&&<Empty>No news articles found for this filter. Try "All sources".</Empty>}

    {data&&<div style={{font:`11px ${mono}`,color:C.mute,marginTop:14,textAlign:"center"}}>
      Updated {localTime(data.fetchedAt)} · Cached 30 min · Links open original sources
    </div>}
  </div>;
}

const NAV=[["Home",null],["Live",Live],["News",NewsFeed],["Results",Results],["Standings",Standings],["Scorer Race",ScorerRace],["Search",Search],["Vs Mode",VsMode],["Trivia",DailyTrivia],["Teams",TeamIntelligence],["Scores",IntelligenceScores],["Coaches",CoachAnalytics],["Coach Ranking",CoachImpact],["Upsets",Upsets],["Stories",Stories],["Knowledge Graph",KnowledgeGraph],["Nation Evolution",NationEvolution],["Qual Odds",QualOdds],["Path to Final",Simulator],["History",History],["Team Predictor",TeamPredictor],["Golden Boot",PlayerPredictor],["Alerts",Alerts]];

// Grouped nav: section → [tab labels]. Order matches NAV array labels exactly.
/* ===================== FOOTER VISITS ===================== */
/* ===================== TRIVIA MODAL (overlay) ===================== */
function TriviaModal({onClose}){
  const todaySeed=new Date().toISOString().slice(0,10).replace(/-/g,'');
  const q=TRIVIA[parseInt(todaySeed)%TRIVIA.length];
  const [ans,setAns]=useState(null);
  const [copied,setCopied]=useState(false);
  const correct=ans===q.a;
  const share=()=>{
    const txt=`I just answered today's World Cup Trivia ${correct?"correctly! 🏆":"incorrectly 😅"} Can you beat me? Try at fifa.rajeevbuilds.dev`;
    navigator.clipboard?.writeText(txt).then(()=>setCopied(true)).catch(()=>{});
    setTimeout(()=>setCopied(false),2000);
  };
  return (
    <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(4,12,9,.86)",zIndex:100,display:"grid",placeItems:"center",padding:16}}>
      <div onClick={e=>e.stopPropagation()} style={{background:C.panel,border:`1px solid ${C.gold}`,borderRadius:8,maxWidth:480,width:"100%",padding:24,animation:"slideUp .25s ease"}}>
        <style>{`@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}`}</style>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
          <div style={{font:`700 11px ${mono}`,color:C.gold,letterSpacing:".12em"}}>🧠 DAILY TRIVIA{q.year?` · ${q.year}`:""}</div>
          <button onClick={onClose} style={{background:"none",border:`1px solid ${C.line}`,color:C.mute,borderRadius:4,padding:"4px 10px",cursor:"pointer",fontFamily:mono,fontSize:12}}>✕</button>
        </div>
        <div style={{font:`700 17px/1.4 ${display}`,color:C.chalk,marginBottom:20}}>{q.q}</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:16}}>
          {q.opts.map((opt,i)=>{
            const selected=ans===opt, isCorrect=opt===q.a;
            const bg=ans?(isCorrect?"rgba(63,174,111,.15)":selected?"rgba(217,84,63,.12)":"transparent"):"transparent";
            const border=ans?(isCorrect?C.grass:selected?C.red:C.line):C.line;
            const col=ans?(isCorrect?C.grass:selected?C.red:C.mute):C.chalk;
            return <button key={opt} onClick={()=>{ if(!ans) setAns(opt); }}
              style={{font:`600 13px ${display}`,padding:"11px 14px",cursor:ans?"default":"pointer",
                borderRadius:5,border:`1px solid ${border}`,background:bg,color:col,
                textAlign:"left",transition:"all .18s",display:"flex",alignItems:"center",gap:8}}>
              <span style={{font:`700 12px ${mono}`,color:C.mute,flexShrink:0}}>{"ABCD"[i]}</span>{opt}
              {ans&&isCorrect&&<span style={{marginLeft:"auto"}}>✓</span>}
              {ans&&selected&&!isCorrect&&<span style={{marginLeft:"auto"}}>✗</span>}
            </button>;
          })}
        </div>
        {ans&&<div>
          <div style={{padding:"12px 14px",borderRadius:5,background:correct?"rgba(63,174,111,.08)":"rgba(217,84,63,.08)",
            border:`1px solid ${correct?C.grass:C.red}`,marginBottom:12}}>
            <div style={{font:`700 14px ${display}`,color:correct?C.grass:C.red,marginBottom:6}}>{correct?"🎉 Correct!":"Not quite — "+q.a}</div>
            <div style={{font:`12px/1.5 ${display}`,color:C.mute}}>{q.fact}</div>
          </div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={share} style={{flex:1,font:`600 12px ${mono}`,padding:"9px",cursor:"pointer",borderRadius:4,border:`1px solid ${C.gold}`,background:"transparent",color:C.gold}}>
              {copied?"✓ Copied!":"📋 Copy & Share"}
            </button>
            <button onClick={onClose} style={{font:`600 12px ${mono}`,padding:"9px 16px",cursor:"pointer",borderRadius:4,border:`1px solid ${C.line}`,background:"transparent",color:C.mute}}>Close</button>
          </div>
        </div>}
      </div>
    </div>
  );
}

function FooterVisits(){
  const [v,setV]=useState(null);
  useEffect(()=>{ fetch("/api/visit").then(r=>r.json()).then(setV).catch(()=>{}); },[]);
  if(!v||(!v.total&&!v.today)) return null;
  return (
    <div style={{marginTop:10,paddingTop:10,borderTop:`1px solid ${C.line}`,font:`11px ${mono}`,color:C.mute,display:"flex",alignItems:"center",justifyContent:"center",gap:16,flexWrap:"wrap"}}>
      <span>👁 <b style={{color:C.chalk}}>{(v.total||0).toLocaleString()}</b> total visits</span>
      <span style={{color:C.line}}>·</span>
      <span><b style={{color:C.chalk}}>{(v.today||0).toLocaleString()}</b> today</span>
    </div>
  );
}

const NAV_GROUPS=[
  {label:"LIVE",  icon:"●", tabs:["Live","News","Results","Standings","Scorer Race"]},
  {label:"INTEL", icon:"◈", tabs:["Search","Vs Mode","Teams","Scores","Coaches","Coach Ranking","Upsets","Stories","Knowledge Graph","Nation Evolution"]},
  {label:"PREDICT",icon:"◎",tabs:["Qual Odds","Path to Final","Team Predictor","Golden Boot"]},
  {label:"MORE",  icon:"⊞", tabs:["Trivia","History","Alerts"]},
];

function App(){
  const [tab,setTab]=useState(0);
  const [matchId,setMatchId]=useState(null);
  const [teamId,setTeamId]=useState(null);
  const [showTrivia,setShowTrivia]=useState(false);

  // Theme — persisted in localStorage
  const [theme,setTheme]=useState(()=>{
    try { return localStorage.getItem("wc-theme")||"dark"; } catch { return "dark"; }
  });
  _theme=theme; // update the C proxy
  const toggleTheme=()=>{
    const next=theme==="dark"?"light":"dark";
    setTheme(next);
    try { localStorage.setItem("wc-theme",next); } catch {}
  };
  // Apply bg colour to body so no white flash outside the app div
  useEffect(()=>{ document.body.style.background=THEMES[theme].bg; },[theme]);

  // Fire a visit count ping once when the app loads — no personal data stored
  useEffect(()=>{ fetch("/api/visit",{method:"POST"}).catch(()=>{}); },[]);

  const go=(i)=>{ setTab(i); window.scrollTo({top:0,behavior:"smooth"}); };
  const navigate=(label)=>{ const i=NAV.findIndex(([l])=>l===label); if(i>=0) go(i); };

  const activeLabel=NAV[tab]?.[0]||"Home";
  const activeSection=NAV_GROUPS.findIndex(g=>g.tabs.includes(activeLabel));
  const subTabs=activeSection>=0?NAV_GROUPS[activeSection].tabs:[];
  const Active=tab===0?null:NAV[tab]?.[1]||null;

  const isLight=theme==="light";

  return (<ThemeCtx.Provider value={theme}><div style={{minHeight:"100vh",background:C.bg,color:C.chalk,transition:"background .2s,color .2s"}}>
    <MatchModal id={matchId} onClose={()=>setMatchId(null)}/>
    <SquadModal id={teamId} onClose={()=>setTeamId(null)}/>
    {showTrivia&&<TriviaModal onClose={()=>setShowTrivia(false)}/>}

    {/* HEADER */}
    <header style={{borderBottom:`1px solid ${C.line}`,padding:"14px 24px",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:10,background:C.navBg}}>
      <div style={{display:"flex",alignItems:"center",gap:12,cursor:"pointer"}} onClick={()=>go(0)}>
        <div style={{width:30,height:30,borderRadius:"50%",background:`radial-gradient(circle at 35% 30%, ${C.gold}, ${C.goldDim})`,boxShadow:`0 0 0 2px ${C.navBg}, 0 0 0 3px ${C.goldDim}`,flexShrink:0}}></div>
        <div>
          <div style={{font:`900 16px/1 ${display}`,letterSpacing:"-.01em",color:C.chalk}}>WORLD CUP INTELLIGENCE HUB</div>
          <div style={{font:`500 9px/1 ${mono}`,letterSpacing:".18em",color:C.mute,marginTop:4}}>LIVE · 2026 · USA · CANADA · MEXICO</div>
        </div>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:14}}>
        {/* Theme toggle */}
        <button onClick={toggleTheme} title={isLight?"Switch to dark mode":"Switch to light mode"}
          style={{background:"none",border:`1px solid ${C.line}`,borderRadius:20,padding:"5px 12px",cursor:"pointer",
            font:`600 11px ${mono}`,color:C.mute,display:"flex",alignItems:"center",gap:6,transition:"border-color .15s"}}>
          <span style={{fontSize:14}}>{isLight?"🌙":"☀️"}</span>
          <span>{isLight?"Dark":"Light"}</span>
        </button>
        <div style={{font:`600 11px ${mono}`,color:C.red,display:"flex",alignItems:"center",gap:6}}><span className="pulse"></span>LIVE</div>
      </div>
    </header>

    {/* NAV */}
    <div style={{background:C.navBg,borderBottom:`1px solid ${C.line}`,position:"sticky",top:0,zIndex:20}}>
      {/* Row 1 — section labels */}
      <div style={{display:"flex",padding:"0 16px",gap:2,borderBottom:`1px solid ${C.line}`,overflowX:"auto"}}>
        <button onClick={()=>go(0)}
          style={{font:`700 11px ${mono}`,padding:"10px 14px",cursor:"pointer",background:"none",border:"none",
            color:tab===0?C.gold:"#a0b8ac",borderBottom:`2px solid ${tab===0?C.gold:"transparent"}`,
            whiteSpace:"nowrap",flexShrink:0,letterSpacing:".06em"}}>
          HOME
        </button>
        {NAV_GROUPS.map((g,gi)=>{
          const isActive=activeSection===gi;
          const firstTabIdx=NAV.findIndex(([l])=>l===g.tabs[0]);
          return <button key={g.label} onClick={()=>go(firstTabIdx)}
            style={{font:`700 11px ${mono}`,padding:"10px 14px",cursor:"pointer",background:"none",border:"none",
              color:isActive?C.gold:"#a0b8ac",borderBottom:`2px solid ${isActive?C.gold:"transparent"}`,
              whiteSpace:"nowrap",flexShrink:0,letterSpacing:".06em",display:"flex",alignItems:"center",gap:5}}>
            <span style={{fontSize:8}}>{g.icon}</span>{g.label}
          </button>;
        })}
      </div>
      {/* Row 2 — sub-tabs. Always visible when inside a section. */}
      {subTabs.length>0&&<div style={{display:"flex",padding:"0 16px",overflowX:"auto",gap:0}}>
        {subTabs.map(label=>{
          const i=NAV.findIndex(([l])=>l===label);
          const active=tab===i;
          return <button key={label} onClick={()=>go(i)}
            style={{font:`500 12px ${display}`,padding:"9px 14px",cursor:"pointer",background:"none",border:"none",
              color:active?C.chalk:"#a0b8ac",borderBottom:`2px solid ${active?C.gold:"transparent"}`,
              whiteSpace:"nowrap",flexShrink:0}}>
            {label}
          </button>;
        })}
      </div>}
    </div>

    <main style={{maxWidth:1040,margin:"0 auto",padding:"28px 24px 80px"}}>
      {tab===0 ? <Homepage onNavigate={navigate} onTrivia={()=>setShowTrivia(true)}/> : Active ? <Active onOpenMatch={setMatchId} onOpenTeam={setTeamId}/> : null}
    </main>
    <footer style={{borderTop:`1px solid ${C.line}`,padding:"20px 28px",font:`12px/1.6 ${mono}`,color:C.mute,textAlign:"center",background:C.navBg}}>
      <div style={{color:C.gold,letterSpacing:".06em"}}>★ A hobby project — built for fun, not affiliated with FIFA.</div>
      <div style={{marginTop:6}}>Live data via football-data.org · Historical 1930–2022 · Predictions are Elo-model estimates, not statements of fact.</div>
      <div style={{marginTop:6}}>Made by Rajeev · rajeevbuilds.dev · <a href="mailto:raj.ranjan.sinha@gmail.com" style={{color:C.gold,textDecoration:"none"}}>raj.ranjan.sinha@gmail.com</a></div>
      <FooterVisits/>
    </footer>
  </div></ThemeCtx.Provider>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
